<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Scripts Hub</title>
    <link rel="stylesheet" href="youtube-scripts-viewer.css" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"></div>
            <h1>My YouTube Scripts <span class="hand-note">✍️</span></h1>
            <span class="subtitle">Datapizza-AI YouTube Scripts Hub</span>
        </header>

        <div class="tabs-container" id="tabsContainer"></div>

        <div class="content-area" id="contentArea">
            <div class="empty-state">
                <div class="empty-state-icon">📝</div>
                <h2>Seleziona una tab per iniziare</h2>
                <p>I file Markdown in Scripts/ verranno elencati qui</p>
            </div>
        </div>
    </div>

    <div class="timestamp" id="timestamp"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="youtube-scripts-viewer.js" defer></script>
</body>
</html>
