<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="yamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dagFromYamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="executionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="finalResultsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0e27">
    <animate attributeName="fill" values="#0a0e27;#1a1e37;#0a0e27" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">
    DAG Pipeline YAML Flow
    <animate attributeName="fill" values="#fff;#4facfe;#f093fb;#fff" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Top row: YAML Config and Loading -->
  <g id="yamlConfig">
    <rect x="60" y="80" width="160" height="60" rx="10" fill="url(#yamlGrad)" filter="url(#shadow)"/>
    <text x="140" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      📄 dag_config.yaml
    </text>
    <text x="140" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      Configuration File
    </text>
  </g>

  <g id="dagFromYaml">
    <rect x="280" y="80" width="180" height="60" rx="10" fill="url(#dagFromYamlGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      DagPipeline.from_yaml
    </text>
  </g>

  <g id="loadModules">
    <rect x="520" y="80" width="120" height="60" rx="10" fill="url(#executionGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="580" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Load Modules
    </text>
  </g>

  <!-- Module definitions row -->
  <g id="documentLoader">
    <rect x="180" y="220" width="150" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="255" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      DocumentLoader
    </text>
  </g>

  <g id="textProcessor">
    <rect x="370" y="220" width="150" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="445" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      TextProcessor
    </text>
  </g>

  <!-- Pipeline Execution -->
  <g id="pipelineExecution">
    <rect x="60" y="340" width="180" height="60" rx="10" fill="url(#executionGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="150" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Pipeline Execution
    </text>
  </g>

  <!-- Execution nodes -->
  <g id="dataLoaderNode">
    <rect x="300" y="360" width="140" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      data_loader
    </text>
  </g>

  <g id="processorNode">
    <rect x="500" y="360" width="140" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="570" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      processor
    </text>
  </g>

  <!-- Final Results -->
  <g id="processedResults">
    <rect x="310" y="480" width="180" height="60" rx="10" fill="url(#finalResultsGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      📊 Processed Results
    </text>
    <text x="400" y="525" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      Final DAG Output
    </text>
  </g>

  <!-- Animated connections -->
  
  <!-- YAML to DagPipeline.from_yaml -->
  <line x1="220" y1="110" x2="280" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#1976d2" filter="url(#glow)">
    <animateMotion dur="0.8s" repeatCount="indefinite">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>
  <path id="path1" d="M220,110 L280,110" fill="none"/>

  <!-- DagPipeline.from_yaml to Load Modules -->
  <line x1="460" y1="110" x2="520" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#7b1fa2" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>
  <path id="path2" d="M460,110 L520,110" fill="none"/>

  <!-- Load Modules to module definitions -->
  <line x1="560" y1="140" x2="255" y2="220" stroke="#43e97b" stroke-width="2" opacity="0.3"/>
  <line x1="580" y1="140" x2="445" y2="220" stroke="#fa709a" stroke-width="2" opacity="0.3"/>

  <circle r="4" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="1s" begin="1s" repeatCount="indefinite">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>
  <path id="path3" d="M560,140 L255,220" fill="none"/>

  <!-- Module connections to execution nodes -->
  <line x1="255" y1="270" x2="370" y2="360" stroke="#43e97b" stroke-width="2" opacity="0.3"/>
  <line x1="445" y1="270" x2="570" y2="360" stroke="#fa709a" stroke-width="2" opacity="0.3"/>

  <!-- Pipeline Execution to data_loader -->
  <line x1="240" y1="370" x2="300" y2="385" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="1s" begin="2s" repeatCount="indefinite">
      <mpath href="#path4"/>
    </animateMotion>
  </circle>
  <path id="path4" d="M240,370 L300,385" fill="none"/>

  <!-- data_loader to processor -->
  <line x1="440" y1="385" x2="500" y2="385" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="470" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#fa709a" font-style="italic">
    documents
  </text>
  <circle r="5" fill="#43e97b" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="2.5s" repeatCount="indefinite">
      <mpath href="#path5"/>
    </animateMotion>
  </circle>
  <path id="path5" d="M440,385 L500,385" fill="none"/>

  <!-- processor to Processed Results -->
  <line x1="570" y1="410" x2="400" y2="480" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#fa709a" filter="url(#glow)">
    <animateMotion dur="1s" begin="3s" repeatCount="indefinite">
      <mpath href="#path6"/>
    </animateMotion>
  </circle>
  <path id="path6" d="M570,410 L400,480" fill="none"/>

  <!-- Status indicators -->
  <g id="status-indicators">
    <circle cx="140" cy="110" r="90" fill="none" stroke="#1976d2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="90;100;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="370" cy="110" r="100" fill="none" stroke="#7b1fa2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="100;110;100" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="580" cy="110" r="70" fill="none" stroke="#f57c00" stroke-width="2" opacity="0">
      <animate attributeName="r" values="70;80;70" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="370" cy="385" r="80" fill="none" stroke="#43e97b" stroke-width="2" opacity="0">
      <animate attributeName="r" values="80;90;80" dur="2s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="570" cy="385" r="80" fill="none" stroke="#fa709a" stroke-width="2" opacity="0">
      <animate attributeName="r" values="80;90;80" dur="2s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles -->
  <g id="particles">
    <circle r="2" fill="#fff" opacity="0.3">
      <animateMotion dur="18s" repeatCount="indefinite">
        <mpath href="#particlePath"/>
      </animateMotion>
    </circle>
    <circle r="1.5" fill="#4facfe" opacity="0.5">
      <animateMotion dur="15s" repeatCount="indefinite">
        <mpath href="#particlePath2"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Hidden paths for particles -->
  <path id="particlePath" d="M100,80 Q400,50 700,80 Q400,500 100,80" fill="none"/>
  <path id="particlePath2" d="M700,500 Q400,550 100,500 Q400,100 700,500" fill="none"/>

  <!-- Flow direction indicators -->
  <g id="flow-indicators">
    <polygon points="460,105 480,110 460,115" fill="#fff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="460,380 480,385 460,390" fill="#fff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" begin="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Section dividers -->
  <g id="section-dividers" opacity="0.3">
    <line x1="50" y1="180" x2="750" y2="180" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="320" x2="750" y2="320" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="450" x2="750" y2="450" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Section labels -->
  <g font-family="Arial" font-size="12" fill="#888" font-style="italic">
    <text x="400" y="70" text-anchor="middle">Configuration Loading</text>
    <text x="400" y="210" text-anchor="middle">Module Definitions</text>
    <text x="400" y="310" text-anchor="middle">Pipeline Execution</text>
    <text x="400" y="470" text-anchor="middle">Results</text>
  </g>

  <!-- Legend -->
  <g id="legend" opacity="0.8">
    <rect x="20" y="560" width="15" height="15" fill="#1976d2"/>
    <text x="40" y="572" font-family="Arial" font-size="11" fill="#aaa">Configuration</text>
    
    <rect x="130" y="560" width="15" height="15" fill="#7b1fa2"/>
    <text x="150" y="572" font-family="Arial" font-size="11" fill="#aaa">Loading</text>
    
    <rect x="220" y="560" width="15" height="15" fill="#f57c00"/>
    <text x="240" y="572" font-family="Arial" font-size="11" fill="#aaa">Execution</text>
    
    <rect x="320" y="560" width="15" height="15" fill="#43e97b"/>
    <text x="340" y="572" font-family="Arial" font-size="11" fill="#aaa">Data Processing</text>
    
    <rect x="440" y="560" width="15" height="15" fill="#fa709a"/>
    <text x="460" y="572" font-family="Arial" font-size="11" fill="#aaa">Text Processing</text>
    
    <rect x="560" y="560" width="15" height="15" fill="#388e3c"/>
    <text x="580" y="572" font-family="Arial" font-size="11" fill="#aaa">Results</text>
  </g>

  <!-- Connection labels -->
  <g font-family="Arial" font-size="10" fill="#aaa" opacity="0.7">
    <text x="250" y="105" text-anchor="middle">load</text>
    <text x="490" y="105" text-anchor="middle">parse</text>
    <text x="400" y="300" text-anchor="middle">instantiate</text>
    <text x="270" y="365" text-anchor="middle">execute</text>
    <text x="485" y="450" text-anchor="middle">output</text>
  </g>
</svg>
