<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="yamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="fromYamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="loadModulesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="executionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="finalReportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="#0a0e27">
    <animate attributeName="fill" values="#0a0e27;#1a1e37;#0a0e27" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="900" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">
    Functional Pipeline YAML Configuration Flow
    <animate attributeName="fill" values="#fff;#4facfe;#f093fb;#fff" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Top row: YAML Config and Loading -->
  <g id="yamlConfig">
    <rect x="50" y="80" width="200" height="60" rx="10" fill="url(#yamlGrad)" filter="url(#shadow)"/>
    <text x="150" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      📄 functional_pipeline_config.yaml
    </text>
    <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      Configuration File
    </text>
  </g>

  <g id="fromYaml">
    <rect x="300" y="80" width="200" height="60" rx="10" fill="url(#fromYamlGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      FunctionalPipeline.from_yaml
    </text>
  </g>

  <g id="loadModules">
    <rect x="550" y="80" width="140" height="60" rx="10" fill="url(#loadModulesGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="620" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Load Modules
    </text>
  </g>

  <!-- Module definitions row -->
  <g id="documentLoader">
    <rect x="80" y="220" width="130" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="145" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      DocumentLoader
    </text>
  </g>

  <g id="textProcessor">
    <rect x="240" y="220" width="130" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="305" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      TextProcessor
    </text>
  </g>

  <g id="dataValidator">
    <rect x="400" y="220" width="130" height="50" rx="8" fill="url(#moduleGrad3)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="465" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      DataValidator
    </text>
  </g>

  <g id="reportBuilder">
    <rect x="560" y="220" width="130" height="50" rx="8" fill="url(#moduleGrad4)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="625" y="250" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      ReportBuilder
    </text>
  </g>

  <!-- Pipeline Execution -->
  <g id="pipelineExecution">
    <rect x="120" y="340" width="180" height="60" rx="10" fill="url(#executionGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="210" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Pipeline Execution
    </text>
  </g>

  <!-- Execution flow steps -->
  <g id="loadData">
    <rect x="120" y="450" width="120" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="180" y="480" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      load_data
    </text>
  </g>

  <g id="process">
    <rect x="280" y="450" width="120" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="480" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      process
    </text>
  </g>

  <g id="validate">
    <rect x="440" y="450" width="120" height="50" rx="8" fill="url(#moduleGrad3)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="480" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      validate
    </text>
  </g>

  <g id="buildReport">
    <rect x="600" y="450" width="120" height="50" rx="8" fill="url(#moduleGrad4)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="660" y="480" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      build_report
    </text>
  </g>

  <!-- Module to execution mappings -->
  <g id="mappings">
    <line x1="145" y1="270" x2="180" y2="450" stroke="#43e97b" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
    <line x1="305" y1="270" x2="340" y2="450" stroke="#fa709a" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
    <line x1="465" y1="270" x2="500" y2="450" stroke="#4facfe" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
    <line x1="625" y1="270" x2="660" y2="450" stroke="#667eea" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
  </g>

  <!-- Final Report -->
  <g id="finalReport">
    <rect x="360" y="580" width="180" height="80" rx="10" fill="url(#finalReportGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="610" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">
      📊 Final Report
    </text>
    <text x="450" y="630" text-anchor="middle" font-family="Arial" font-size="11" fill="white" opacity="0.9">
      Complete Pipeline Results
    </text>
    <text x="450" y="650" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      Documents processed, validated, and reported
    </text>
  </g>

  <!-- Animated connections -->
  
  <!-- YAML to from_yaml -->
  <line x1="250" y1="110" x2="300" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#1976d2" filter="url(#glow)">
    <animateMotion dur="0.8s" repeatCount="indefinite">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>
  <path id="path1" d="M250,110 L300,110" fill="none"/>

  <!-- from_yaml to Load Modules -->
  <line x1="500" y1="110" x2="550" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#7b1fa2" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>
  <path id="path2" d="M500,110 L550,110" fill="none"/>

  <!-- Load Modules to module definitions (branching lines) -->
  <line x1="600" y1="140" x2="145" y2="220" stroke="#43e97b" stroke-width="2" opacity="0.3"/>
  <line x1="610" y1="140" x2="305" y2="220" stroke="#fa709a" stroke-width="2" opacity="0.3"/>
  <line x1="620" y1="140" x2="465" y2="220" stroke="#4facfe" stroke-width="2" opacity="0.3"/>
  <line x1="630" y1="140" x2="625" y2="220" stroke="#667eea" stroke-width="2" opacity="0.3"/>

  <circle r="4" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="1.2s" begin="1s" repeatCount="indefinite">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>
  <path id="path3" d="M600,140 L145,220" fill="none"/>

  <!-- Pipeline Execution to load_data -->
  <line x1="210" y1="400" x2="180" y2="450" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="2s" repeatCount="indefinite">
      <mpath href="#path4"/>
    </animateMotion>
  </circle>
  <path id="path4" d="M210,400 L180,450" fill="none"/>

  <!-- Execution flow -->
  <line x1="240" y1="475" x2="280" y2="475" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="260" y="465" text-anchor="middle" font-family="Arial" font-size="9" fill="#fa709a" font-style="italic">
    documents
  </text>
  <circle r="4" fill="#43e97b" filter="url(#glow)">
    <animateMotion dur="0.6s" begin="2.5s" repeatCount="indefinite">
      <mpath href="#path5"/>
    </animateMotion>
  </circle>
  <path id="path5" d="M240,475 L280,475" fill="none"/>

  <line x1="400" y1="475" x2="440" y2="475" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="420" y="465" text-anchor="middle" font-family="Arial" font-size="9" fill="#4facfe" font-style="italic">
    processed_docs
  </text>
  <circle r="4" fill="#fa709a" filter="url(#glow)">
    <animateMotion dur="0.6s" begin="3s" repeatCount="indefinite">
      <mpath href="#path6"/>
    </animateMotion>
  </circle>
  <path id="path6" d="M400,475 L440,475" fill="none"/>

  <line x1="560" y1="475" x2="600" y2="475" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="580" y="465" text-anchor="middle" font-family="Arial" font-size="9" fill="#667eea" font-style="italic">
    validation_results
  </text>
  <circle r="4" fill="#4facfe" filter="url(#glow)">
    <animateMotion dur="0.6s" begin="3.5s" repeatCount="indefinite">
      <mpath href="#path7"/>
    </animateMotion>
  </circle>
  <path id="path7" d="M560,475 L600,475" fill="none"/>

  <!-- build_report to Final Report -->
  <line x1="660" y1="500" x2="450" y2="580" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#667eea" filter="url(#glow)">
    <animateMotion dur="1s" begin="4s" repeatCount="indefinite">
      <mpath href="#path8"/>
    </animateMotion>
  </circle>
  <path id="path8" d="M660,500 L450,580" fill="none"/>

  <!-- Status indicators -->
  <g id="status-indicators">
    <circle cx="150" cy="110" r="110" fill="none" stroke="#1976d2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="110;120;110" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="400" cy="110" r="110" fill="none" stroke="#7b1fa2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="110;120;110" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="620" cy="110" r="80" fill="none" stroke="#f57c00" stroke-width="2" opacity="0">
      <animate attributeName="r" values="80;90;80" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="210" cy="370" r="100" fill="none" stroke="#f57c00" stroke-width="2" opacity="0">
      <animate attributeName="r" values="100;110;100" dur="2s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data flow arrows -->
  <g id="dataflow-arrows">
    <polygon points="265,470 275,475 265,480" fill="#43e97b" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="2.5s" repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="425,470 435,475 425,480" fill="#fa709a" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="3s" repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="585,470 595,475 585,480" fill="#4facfe" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="3.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Floating particles -->
  <g id="particles">
    <circle r="2" fill="#fff" opacity="0.3">
      <animateMotion dur="20s" repeatCount="indefinite">
        <mpath href="#particlePath"/>
      </animateMotion>
    </circle>
    <circle r="1.5" fill="#4facfe" opacity="0.5">
      <animateMotion dur="17s" repeatCount="indefinite">
        <mpath href="#particlePath2"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Hidden paths for particles -->
  <path id="particlePath" d="M100,80 Q450,50 800,80 Q450,700 100,80" fill="none"/>
  <path id="particlePath2" d="M800,700 Q450,750 100,700 Q450,100 800,700" fill="none"/>

  <!-- Section dividers -->
  <g id="section-dividers" opacity="0.2">
    <line x1="50" y1="180" x2="850" y2="180" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="320" x2="850" y2="320" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="420" x2="850" y2="420" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="550" x2="850" y2="550" stroke="#fff" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Section labels -->
  <g font-family="Arial" font-size="12" fill="#888" font-style="italic">
    <text x="450" y="70" text-anchor="middle">YAML Configuration Loading</text>
    <text x="450" y="210" text-anchor="middle">External Module Definitions</text>
    <text x="450" y="310" text-anchor="middle">Pipeline Execution Setup</text>
    <text x="450" y="440" text-anchor="middle">Sequential Processing Steps</text>
    <text x="450" y="570" text-anchor="middle">Final Output</text>
  </g>

  <!-- Legend -->
  <g id="legend" opacity="0.8">
    <rect x="20" y="750" width="15" height="15" fill="#1976d2"/>
    <text x="40" y="762" font-family="Arial" font-size="11" fill="#aaa">Configuration</text>
    
    <rect x="130" y="750" width="15" height="15" fill="#7b1fa2"/>
    <text x="150" y="762" font-family="Arial" font-size="11" fill="#aaa">Loading</text>
    
    <rect x="220" y="750" width="15" height="15" fill="#f57c00"/>
    <text x="240" y="762" font-family="Arial" font-size="11" fill="#aaa">Execution</text>
    
    <rect x="320" y="750" width="15" height="15" fill="#43e97b"/>
    <text x="340" y="762" font-family="Arial" font-size="11" fill="#aaa">Data Loading</text>
    
    <rect x="430" y="750" width="15" height="15" fill="#fa709a"/>
    <text x="450" y="762" font-family="Arial" font-size="11" fill="#aaa">Processing</text>
    
    <rect x="540" y="750" width="15" height="15" fill="#4facfe"/>
    <text x="560" y="762" font-family="Arial" font-size="11" fill="#aaa">Validation</text>
    
    <rect x="650" y="750" width="15" height="15" fill="#667eea"/>
    <text x="670" y="762" font-family="Arial" font-size="11" fill="#aaa">Report Generation</text>
    
    <rect x="780" y="750" width="15" height="15" fill="#388e3c"/>
    <text x="800" y="762" font-family="Arial" font-size="11" fill="#aaa">Final Output</text>
  </g>
</svg>
