<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="yamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="fromYamlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="loadModulesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="executionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="finalReportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="#0a0e27">
    <animate attributeName="fill" values="#0a0e27;#1a1e37;#0a0e27" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="900" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">
    YAML Functional Pipeline Flow
    <animate attributeName="fill" values="#fff;#4facfe;#f093fb;#fff" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Top row: YAML Config and Loading -->
  <g id="yamlConfig">
    <rect x="50" y="80" width="140" height="60" rx="10" fill="url(#yamlGrad)" filter="url(#shadow)"/>
    <text x="120" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      📄 YAML Config
    </text>
    <text x="120" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      functional_pipeline_config.yaml
    </text>
  </g>

  <g id="fromYaml">
    <rect x="250" y="80" width="180" height="60" rx="10" fill="url(#fromYamlGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      FunctionalPipeline.from_yaml
    </text>
  </g>

  <g id="loadModules">
    <rect x="490" y="80" width="120" height="60" rx="10" fill="url(#loadModulesGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Load Modules
    </text>
  </g>

  <!-- Module definitions row -->
  <g id="documentLoader">
    <rect x="50" y="200" width="140" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="120" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      DocumentLoader
    </text>
  </g>

  <g id="textProcessor">
    <rect x="220" y="200" width="140" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="290" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      TextProcessor
    </text>
  </g>

  <g id="dataValidator">
    <rect x="390" y="200" width="140" height="50" rx="8" fill="url(#moduleGrad3)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="460" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      DataValidator
    </text>
  </g>

  <g id="reportBuilder">
    <rect x="560" y="200" width="140" height="50" rx="8" fill="url(#moduleGrad4)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="630" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      ReportBuilder
    </text>
  </g>

  <!-- Pipeline Execution -->
  <g id="pipelineExecution">
    <rect x="50" y="320" width="180" height="60" rx="10" fill="url(#executionGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="140" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      Pipeline Execution
    </text>
  </g>

  <!-- Execution flow -->
  <g id="loadData">
    <rect x="300" y="420" width="120" height="50" rx="8" fill="url(#moduleGrad1)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="360" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      load_data
    </text>
  </g>

  <g id="process">
    <rect x="480" y="420" width="120" height="50" rx="8" fill="url(#moduleGrad2)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      process
    </text>
  </g>

  <g id="validate">
    <rect x="660" y="420" width="120" height="50" rx="8" fill="url(#moduleGrad3)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="720" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      validate
    </text>
  </g>

  <g id="buildReport">
    <rect x="480" y="540" width="120" height="50" rx="8" fill="url(#moduleGrad4)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="570" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">
      build_report
    </text>
  </g>

  <!-- Final Report -->
  <g id="finalReport">
    <rect x="350" y="660" width="180" height="60" rx="10" fill="url(#finalReportGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="685" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">
      📊 Final Report
    </text>
    <text x="440" y="705" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.8">
      Complete Analysis Results
    </text>
  </g>

  <!-- Animated connections -->
  
  <!-- YAML to from_yaml -->
  <line x1="190" y1="110" x2="250" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#1976d2" filter="url(#glow)">
    <animateMotion dur="0.8s" repeatCount="indefinite">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>
  <path id="path1" d="M190,110 L250,110" fill="none"/>

  <!-- from_yaml to Load Modules -->
  <line x1="430" y1="110" x2="490" y2="110" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#7b1fa2" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>
  <path id="path2" d="M430,110 L490,110" fill="none"/>

  <!-- Load Modules to module definitions -->
  <line x1="530" y1="140" x2="120" y2="200" stroke="#43e97b" stroke-width="2" opacity="0.3"/>
  <line x1="540" y1="140" x2="290" y2="200" stroke="#fa709a" stroke-width="2" opacity="0.3"/>
  <line x1="550" y1="140" x2="460" y2="200" stroke="#4facfe" stroke-width="2" opacity="0.3"/>
  <line x1="560" y1="140" x2="630" y2="200" stroke="#667eea" stroke-width="2" opacity="0.3"/>

  <circle r="4" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="1s" begin="1s" repeatCount="indefinite">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>
  <path id="path3" d="M530,140 L120,200" fill="none"/>

  <!-- Module connections to execution -->
  <line x1="120" y1="250" x2="360" y2="420" stroke="#43e97b" stroke-width="2" opacity="0.3"/>
  <line x1="290" y1="250" x2="540" y2="420" stroke="#fa709a" stroke-width="2" opacity="0.3"/>
  <line x1="460" y1="250" x2="720" y2="420" stroke="#4facfe" stroke-width="2" opacity="0.3"/>
  <line x1="630" y1="250" x2="540" y2="540" stroke="#667eea" stroke-width="2" opacity="0.3"/>

  <!-- Pipeline Execution to load_data -->
  <line x1="230" y1="350" x2="300" y2="445" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#f57c00" filter="url(#glow)">
    <animateMotion dur="1s" begin="2s" repeatCount="indefinite">
      <mpath href="#path4"/>
    </animateMotion>
  </circle>
  <path id="path4" d="M230,350 L300,445" fill="none"/>

  <!-- Execution flow -->
  <line x1="420" y1="445" x2="480" y2="445" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="450" y="435" text-anchor="middle" font-family="Arial" font-size="10" fill="#fa709a" font-style="italic">
    documents
  </text>
  <circle r="5" fill="#43e97b" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="2.5s" repeatCount="indefinite">
      <mpath href="#path5"/>
    </animateMotion>
  </circle>
  <path id="path5" d="M420,445 L480,445" fill="none"/>

  <line x1="600" y1="445" x2="660" y2="445" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="630" y="435" text-anchor="middle" font-family="Arial" font-size="10" fill="#4facfe" font-style="italic">
    processed_documents
  </text>
  <circle r="5" fill="#fa709a" filter="url(#glow)">
    <animateMotion dur="0.8s" begin="3s" repeatCount="indefinite">
      <mpath href="#path6"/>
    </animateMotion>
  </circle>
  <path id="path6" d="M600,445 L660,445" fill="none"/>

  <line x1="720" y1="470" x2="540" y2="540" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <text x="630" y="505" text-anchor="middle" font-family="Arial" font-size="10" fill="#667eea" font-style="italic">
    validation_results
  </text>
  <circle r="5" fill="#4facfe" filter="url(#glow)">
    <animateMotion dur="1s" begin="3.5s" repeatCount="indefinite">
      <mpath href="#path7"/>
    </animateMotion>
  </circle>
  <path id="path7" d="M720,470 L540,540" fill="none"/>

  <!-- build_report to Final Report -->
  <line x1="540" y1="590" x2="440" y2="660" stroke="#fff" stroke-width="3" opacity="0.3"/>
  <circle r="5" fill="#667eea" filter="url(#glow)">
    <animateMotion dur="1s" begin="4s" repeatCount="indefinite">
      <mpath href="#path8"/>
    </animateMotion>
  </circle>
  <path id="path8" d="M540,590 L440,660" fill="none"/>

  <!-- Status indicators -->
  <g id="status-indicators">
    <circle cx="120" cy="110" r="80" fill="none" stroke="#1976d2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="80;90;80" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="340" cy="110" r="100" fill="none" stroke="#7b1fa2" stroke-width="2" opacity="0">
      <animate attributeName="r" values="100;110;100" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles -->
  <g id="particles">
    <circle r="2" fill="#fff" opacity="0.3">
      <animateMotion dur="20s" repeatCount="indefinite">
        <mpath href="#particlePath"/>
      </animateMotion>
    </circle>
    <circle r="1.5" fill="#4facfe" opacity="0.5">
      <animateMotion dur="15s" repeatCount="indefinite">
        <mpath href="#particlePath2"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Hidden paths for particles -->
  <path id="particlePath" d="M100,80 Q450,50 800,80 Q450,700 100,80" fill="none"/>
  <path id="particlePath2" d="M800,700 Q450,750 100,700 Q450,100 800,700" fill="none"/>

  <!-- Legend -->
  <g id="legend" opacity="0.8">
    <rect x="20" y="750" width="15" height="15" fill="#1976d2"/>
    <text x="40" y="762" font-family="Arial" font-size="11" fill="#aaa">Configuration</text>
    
    <rect x="130" y="750" width="15" height="15" fill="#7b1fa2"/>
    <text x="150" y="762" font-family="Arial" font-size="11" fill="#aaa">Loading</text>
    
    <rect x="220" y="750" width="15" height="15" fill="#f57c00"/>
    <text x="240" y="762" font-family="Arial" font-size="11" fill="#aaa">Execution</text>
    
    <rect x="320" y="750" width="15" height="15" fill="#43e97b"/>
    <text x="340" y="762" font-family="Arial" font-size="11" fill="#aaa">Modules</text>
    
    <rect x="410" y="750" width="15" height="15" fill="#388e3c"/>
    <text x="430" y="762" font-family="Arial" font-size="11" fill="#aaa">Output</text>
  </g>

  <!-- Section labels -->
  <g font-family="Arial" font-size="12" fill="#888" font-style="italic">
    <text x="450" y="70" text-anchor="middle">Configuration Loading</text>
    <text x="450" y="190" text-anchor="middle">Module Definitions</text>
    <text x="450" y="310" text-anchor="middle">Pipeline Execution</text>
  </g>
</svg>
