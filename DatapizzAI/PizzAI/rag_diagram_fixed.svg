<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3e50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="ingestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7971E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD200;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="queryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="answerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 Z" fill="#FFD700"/>
    </marker>
    
    <marker id="arrowDashed" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1400" fill="url(#bgGrad)"/>
  
  <!-- Grid -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="50" height="50" fill="none" stroke="white" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="1400" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
    RAG System Architecture
  </text>
  
  <!-- INGESTION Section -->
  <g id="ingestionSection">
    <!-- Section container -->
    <rect x="30" y="85" width="380" height="650" rx="15" fill="white" fill-opacity="0.02" stroke="#FF6B6B" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Section label -->
    <rect x="130" y="95" width="180" height="38" rx="8" fill="#FF6B6B" fill-opacity="0.15"/>
    <text x="220" y="119" font-family="Arial, sans-serif" font-size="18" fill="#FF6B6B" font-weight="bold" text-anchor="middle">📥 INGESTION</text>
    
    <!-- Document Node -->
    <g transform="translate(220, 190)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#ingestGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-size="26" text-anchor="middle">📄</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">Documento</text>
    </g>
    
    <!-- Arrow 1 -->
    <line x1="220" y1="225" x2="220" y2="265" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Parser Node -->
    <g transform="translate(220, 300)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#processGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Parser</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(parse_text)</text>
    </g>
    
    <!-- Arrow 2 -->
    <line x1="220" y1="335" x2="220" y2="375" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Splitter Node -->
    <g transform="translate(220, 410)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#processGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Splitter</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(TextSplitter)</text>
    </g>
    
    <!-- Arrow 3 -->
    <line x1="220" y1="445" x2="220" y2="485" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    
    <!-- Chunks Node -->
    <g transform="translate(220, 520)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#processGrad)" filter="url(#shadow)"/>
      <!-- Chunk visualization -->
      <rect x="-70" y="-18" width="45" height="28" rx="4" fill="white" opacity="0.25"/>
      <rect x="-17" y="-18" width="45" height="28" rx="4" fill="white" opacity="0.25"/>
      <rect x="36" y="-18" width="45" height="28" rx="4" fill="white" opacity="0.25"/>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Chunks</text>
    </g>
    
    <!-- Arrow 4 -->
    <line x1="220" y1="555" x2="220" y2="595" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    
    <!-- Embedder Node -->
    <g transform="translate(220, 630)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#embedGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Embedder</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(NodeEmbedder)</text>
    </g>
    
    <!-- Arrow to Vector Store -->
    <line x1="310" y1="630" x2="420" y2="630" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#FFD700">
      <animateMotion path="M 310 630 L 420 630" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Vector Store (Central) -->
  <g transform="translate(550, 630)">
    <rect x="-130" y="-35" width="260" height="70" rx="15" fill="url(#storeGrad)" filter="url(#shadow)" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">Vector Store</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(QdrantVectorstore)</text>
  </g>
  
  <!-- RETRIEVAL Section -->
  <g id="retrievalSection">
    <!-- Section container -->
    <rect x="640" y="85" width="530" height="1250" rx="15" fill="white" fill-opacity="0.02" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Section label -->
    <rect x="790" y="95" width="180" height="38" rx="8" fill="#00d2ff" fill-opacity="0.15"/>
    <text x="880" y="119" font-family="Arial, sans-serif" font-size="18" fill="#00d2ff" font-weight="bold" text-anchor="middle">🔄 RETRIEVAL</text>
    
    <!-- Query Node -->
    <g transform="translate(880, 190)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#queryGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-size="26" text-anchor="middle">🔍</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">Query utente</text>
    </g>
    
    <!-- Arrow to Embedder -->
    <line x1="880" y1="225" x2="880" y2="375" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Query Embedder Node -->
    <g transform="translate(880, 410)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#embedGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Embedder query</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(ClientEmbedder)</text>
    </g>
    
    <!-- Arrow to Retrieval -->
    <line x1="880" y1="445" x2="880" y2="595" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Retrieval Node -->
    <g transform="translate(880, 630)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#queryGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Retrieval</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(Qdrant.search)</text>
    </g>
    
    <!-- Connection from Vector Store -->
    <path d="M 680 630 L 790 630" 
          stroke="#9CA3AF" 
          stroke-width="2.5" 
          stroke-dasharray="8,4" 
          fill="none" 
          marker-end="url(#arrowDashed)">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="735" y="620" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">documenti</text>
    <text x="735" y="645" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">rilevanti</text>
    
    <!-- Moving particles on dashed line -->
    <circle r="3" fill="#764ba2">
      <animateMotion path="M 680 630 L 790 630" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#764ba2">
      <animateMotion path="M 680 630 L 790 630" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Arrow to Reranker -->
    <line x1="880" y1="665" x2="880" y2="815" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    
    <!-- Reranker Node -->
    <g transform="translate(880, 850)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#queryGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Reranker</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(CohereReranker)</text>
    </g>
    
    <!-- Arrow to Generation -->
    <line x1="880" y1="885" x2="880" y2="1035" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    
    <!-- Generation Node -->
    <g transform="translate(880, 1070)">
      <rect x="-105" y="-35" width="210" height="70" rx="12" fill="url(#answerGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Generazione risposta</text>
      <text x="0" y="13" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9" text-anchor="middle">(OpenAIClient)</text>
    </g>
    
    <!-- Arrow to Final Answer -->
    <line x1="880" y1="1105" x2="880" y2="1255" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    
    <!-- Final Answer Node -->
    <g transform="translate(880, 1290)">
      <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#answerGrad)" filter="url(#shadow)"/>
      <text x="0" y="-5" font-size="26" text-anchor="middle">🤖</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">Risposta finale</text>
    </g>
  </g>
  
  <!-- CSS Animations -->
  <style>
    rect {
      transition: all 0.3s ease;
    }
    
    g:hover rect {
      transform: scale(1.05);
      filter: url(#shadow) brightness(1.1);
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    svg {
      animation: fadeIn 1s ease-out;
    }
  </style>
</svg>