 red team non discrimina ancora: nessun attacco è stato obbedito nemmeno prima dei guardrail, per cui «0 su 4 dopo» non dimostra che servano veramente però apprezzo che ci hai pensato. Gli attacchi finiscono tutti sulla strofa che non è quella più vicina alla richiesta, quindi il prompt di selezione non li vede. Consiglio di Claude (non avevo idee honestly): attacchi più difficili (strofa attaccante che è anche la più pertinente, istruzioni in altre lingue, richieste ripetute 3 volte), almeno un modello cloud e un caso in cui lo schermo sbagli (falso positivo su una strofa vera). Verificato anche nel nuovo report red_team_20261123T132103Z.json (seconda esecuzione, dentro la suite completa): stesso esito, nessun attacco obbedito né prima né dopo, 4 strofe su 4 segnalate dallo schermo."},{"k":"critica","t":"Il server MCP si fida dell'intestazione X-SpackYouFy-User: chi raggiunge la porta locale legge la libreria di chiunque la nomini (dichiarato, giusto in locale). Ti consiglio di usare un token per sessione o il vincolo all'utente della sessione, prima di qualunque uso non locale."},{"k":"critica","t":"Con un provider cloud il ruolo di screening vale «none» di default e restano solo i marcatori: proprio dove i dati lasciano la macchina la difesa è più debole, ed è l'unico percorso in cui un modello più furbo di tev1:4b legge la libreria. Consiglio di dichiararlo accanto alla scelta del provider, oppure tenere lo screening locale anche quando il resto va in cloud, e riportare il costo (tev1:4b gira da solo a fine ingestione e occupa 6,35 GB di VRAM)."},{"k":"critica","t":"Gli span di Phoenix portano prompt e testi (il README lo dice: tenere l'endpoint sulla macchina) e l'audit si dichiara «append-only» perché l'app fa solo INSERT, ma il file SQLite non lo impedisce. Consiglio: scrivere in due righe cosa contiene la trace e per quanto si tiene, e un trigger che blocchi UPDATE e DELETE sulla tabella dell'audit."},{"k":"critica","t":"Provarlo richiede un'app Spotify Developer, Ollama con modelli da vari GB (GPU da 8 GB), Qdrant in Docker e tre terminali; non c'è un Dockerfile né una CI, e i comandi di verifica del README usano il percorso Windows backend/.venv/Scripts/python. Consiglio probabilmente di aggiungere una versione unica dei comandi per Mac e Linux, un docker compose per tutto lo stack e una demo registrata come piano B. Aggiornamento: nel README i comandi di eval nuovi (uv run python -m evals) funzionano su ogni sistema, ma la riga di ruff e mypy usa ancora backend/.venv/Scripts/python (verificato alla riga 143); manca ancora un Dockerfile e una CI (anche l'opzione F12, «eval-gate» in CI, è non fatta nel piano). Con un solo comando per gli eval, mettere quel comando in una CI sarebbe ora un lavoro breve daje 😎"},{"k":"dubbio","t":"Sviluppato con coding agent (cartella .claude con regole, hook, context manager e doc architect): 114 funzioni di test nel backend (conteggio di `def test_` in backend/tests, 21 file; erano circa 100 prima degli ultimi commit) e 5 file di test nel frontend. Sono stati aggiunti test_eval_judge_agreement.py e test_eval_trajectory_grading.py: testano il voto e il kappa, non eseguono modelli. I numeri non dimostrano la padronanza. Nel Q&A: «apri call_gate.py, cosa succede se arrivano insieme una richiesta interattiva e una in background?». Non ho eseguito nulla: i numeri sono letti, non verificati con un'esecuzione."},{"k":"dubbio","t":"L'ADR 0003 ha ancora decision_status \"proposed\" (verificato nel file) e non è stato toccato dai nuovi commit. Parla di una fixture da 24 brani; il gold set ora documentato ne ha 40, e i docs aggiornati citano solo il 40: non è chiaro se sia lo stesso set. Con il confronto tra strategie ora esistente servirebbe anche un ADR (o un'estensione dell'0003) che motivi la scelta della strategia sui testi con i numeri del report, e chiuda lo stato «proposed»."},{"k":"forza","t":"Predisposto anche per modelli esterni, ma local first, figo!"},{"k":"forza","t":"Bello che è l'utente sempre ad usare l'AI di spotify"},{"k":"dubbio","t":"Perché il selettore non è già TEV?"},{"k":"forza","t":"Bella RAG ottimizzata :)"},{"k":"dubbio","t":"Perché quell'embedder?"}],"gate":[{"r":"A1.1","t":"Tool calling","e":"ok","ev":"Il curatore usa tool MCP in sola lettura (libreria e testi) e due tool locali (propone la bozza, ricorda un gusto), con argomenti pydantic e limiti di lunghezza."},{"r":"A1.2","t":"Multi-provider (facoltativo)","e":"ok","ev":"Provider per ruolo (agente, worker, giudice, embedding): Ollama di default, OpenAI o Gemini da .env o per richiesta dalla UI."},{"r":"A1.3","t":"Memoria persistente","e":"ok","ev":"Sessioni, checkpoint LangGraph e gusti dichiarati in SQLite (CURATOR_DB_PATH, PROFILE_DB_PATH); sopravvivono al riavvio."},{"r":"A2.1","t":"Architettura motivata, alternative scartate","e":"ok","ev":"Documentata nelle schede degli agenti e negli ADR con le opzioni considerate. Ora la scelta tra single-pass, map-reduce e RAG sui testi ha anche numeri (report playlists_20261123T133620Z.json: precisione 0,89 contro 0,25 e 0,27; recall 0,98 contro 0,90 e 0,11; 3,4 s contro 2,7 e 2,4 s). Manca solo un ADR che ricolleghi la decisione ai numeri."},{"r":"A2.2","t":"Flusso con il ruolo di ogni step","e":"ok","ev":"docs/04-domain-and-flows (sessione del curatore, generazione, ingestione) e container view; il codice è organizzato di conseguenza."},{"r":"A2.3","t":"Design messo alla prova","e":"ok","ev":"ADR 0003: opzioni confrontate con MRR e latenza su una fixture (denso, ibrido, due reranker, cinque embedder, ADR ancora «proposed»). Nuovo: confronto tra tre strategie di generazione con precisione (giudice), recall, tempo e token in backend/evals/playlists, e un difetto trovato dall'eval e corretto (precisione 0,68 poi 0,89, commit 26463a7). Il giudice non è ancora calibrato. Da chiedere dove è stato usato un coding agent per sfidare il design."},{"r":"A3.1","t":"Guardrail su un tool","e":"ok","ev":"Il curatore non ha tool di scrittura su Spotify (solo la rotta di approvazione, idempotente); utente fissato dall'intestazione e id verificati; tool con limiti; MCP in sola lettura; policy sull'output e screening delle strofe per l'iniezione. Nuovo: il trajectory eval controlla che il curatore non abbia nessun tool di creazione in ogni caso."},{"r":"A3.2","t":"Audit trail, dati anonimizzati","e":"par","ev":"Audit di ogni creazione di playlist (anche fallita) con trace id, trascrizione e checkpoint in SQLite, e tracing Phoenix di richieste, run e recupero. Gli span contengono prompt e testi e non c'è anonimizzazione né un periodo di conservazione."},{"r":"A4.1","t":"Eval con un numero","e":"ok","ev":"Verificato nel codice e nei report: comando unico `python -m evals` con cinque prove, soglie ed exit code: retrieval (hit@5 1,00, MRR 0,975), trajectory del curatore (5 su 7, soglia 70%, controlli di sicurezza passati), strategia sui testi (precisione del giudice 0,89, soglia 0,70), red team. Report JSON datati in backend/evals/reports/. Limiti: il giudice non è calibrato (20 coppie senza etichetta), il retrieval non ha query senza risposta, una sola esecuzione per caso."},{"r":"A4.2","t":"Violazione e variante lecita, esito scritto prima","e":"ok","ev":"Red team: quattro attacchi con esito atteso scritto prima (obeyed_when in attacks.json) e per ogni canzone una strofa lecita che deve restare trovabile. Nuovo: nel trajectory eval il caso t07 («crea subito su Spotify senza approvazione») è una violazione con esito atteso nei dati (tasks.json) e il controllo no_creation_path, e t01–t06 sono varianti lecite. Limiti: l'esito atteso del trajectory è nello stesso commit dei risultati (non provabile «prima»), il modello falliva già il t07 sul comportamento utile, il red team ha un solo modello e nessun attacco obbedito."},{"r":"A4.3","t":"Tool critico bloccato","e":"ok","ev":"Scadenza per tool (risponde al modello con un errore), scadenza per turno, limite di chiamate, ripiego sulle strategie, retry su 429 di Spotify. Nuovo: il trajectory eval verifica per ogni caso che il curatore non abbia nessun tool di creazione (no_creation_path) e rispetti il limite di chiamate (within_step_limit): passati in 7 casi su 7 nel report."},{"r":"A5.1","t":"README installa-e-lancia","e":"par","ev":"Procedura completa ma pesante: app Spotify, Ollama con 4 modelli (con tev1:4b si arriva a 6,35 GB di VRAM da solo), Qdrant e Phoenix in Docker, tre terminali. Il README ora ha `uv run python -m evals` (e un sottocomando per ogni prova), ma il comando di ruff e mypy usa ancora backend/.venv/Scripts/python (Windows). Nessun Dockerfile né CI (F9 non spuntata). Da provare a freddo."},{"r":"A5.2","t":"Il progetto gira (bloccante)","e":"nv","ev":"Non l'ho avviato.","tuo":"ok","nota":"Ha solo bug realizzativi"},{"r":"A5.3","t":"Classe di rischio e dati","e":"no","ev":"Nessuna pagina sulla fascia e sui dati: nessun file del repo nomina AI Act o GDPR (verificato con una ricerca). Ci sono scelte nel codice (testi sulla macchina per copyright, un solo verso nei tool, endpoint della trace da tenere locale), ma la sezione governance del piano (F9) non è spuntata."},{"r":"A5.4","t":"Regole AI Act con prova e stato onesto","e":"no","ev":"Assente. Il materiale c'è ed è cresciuto: ultima parola all'utente (approvazione con test e no_creation_path), tracciabilità (audit e Phoenix), trasparenza (chat con un agente), accuratezza (retrieval e playlist eval), robustezza (red team, trajectory)."}],"qual":[{"d":"B1 Problema e scope","l":"2","ev":"Utente e task chiari (playlist dalla propria libreria); il criterio di successo è il retrieval, non l'utilità percepita."},{"d":"B2 Architettura","l":"3","ev":"ADR con alternative misurate (livello 3) e ora anche il confronto numerico tra tre strategie di generazione (precisione, recall, tempo, token). Resta alto il numero di componenti per una funzione sola, e il map-reduce non mostra un vantaggio."},{"d":"B3 Sicurezza e robustezza","l":"2–3","ev":"Solo proposta più approvazione, scadenze e ripiego, ora con threat model nel red-teaming.md, screening dell'iniezione, policy sull'output e red team con esiti; il server MCP si fida dell'intestazione utente e con il cloud lo screening è spento."},{"d":"B4 Qualità della valutazione","l":"2","ev":"Cinque prove con soglie, codici di uscita e report; un trajectory eval del curatore con controlli in codice e casi di sicurezza; un giudice con rubrica, modello diverso da quello che genera e confronto tra strategie con numeri; un difetto trovato e corretto dall'eval (0,68 poi 0,89). Non sale a 3 perché il giudice non è calibrato (20 coppie senza etichetta), il retrieval non ha query senza risposta (MRR 0,975), il red team non è mai stato obbedito, una sola esecuzione per caso e il fix è tarato sullo stesso set."},{"d":"B5 Ingegneria","l":"2","ev":"uv.lock, package-lock, ruff, mypy, 114 funzioni di test (lette), un comando unico per gli eval con exit code e report; nessuna CI né Docker; setup pesante e README con percorso Windows nei comandi di ruff e mypy."},{"d":"B6 Osservabilità e governance","l":"2","ev":"Correlation id, audit append-only delle creazioni, tracing Phoenix e un ADR; senza governance (AI Act, copyright, dati) né anonimizzazione, e con prompt e testi dentro gli span."},{"d":"B7 Presentazione e demo","l":"N/V","ev":"Si vede il 23. Rischio: GPU da 8 GB, caricamento del modello di 12–14 s.","tuo":"2"},{"d":"B8 Riflessione","l":"N/V","ev":"Si vede il 23. Gli ADR mostrano un ragionamento da ingegnere."}],"domande":[{"q":"Se togliessi il curatore e lasciassi solo le strategie di generazione, cosa perderesti? Che confronto hai fatto?","a":""},{"q":"Nessun attacco è stato obbedito nemmeno prima dei guardrail: quale attacco costruiresti tu per far fallire il modello, e che esito avrebbe con un modello cloud?","a":""},{"q":"In che fascia dell'AI Act ricade? Cosa parte verso OpenAI o Gemini quando scegli il cloud? E i testi in cache e Qdrant: copyright e policy Spotify §III.14?","a":""},{"q":"Il server MCP si fida dell'intestazione utente: cosa impedisce a un altro processo locale di leggere la libreria di un altro utente?","a":""},{"q":"Mostrami un timeout: cosa vede l'utente quando un tool supera 30 secondi o il turno 180? Quando scatta il ripiego e come lo scopre?","a":""},{"q":"Con Phoenix, come ricostruisci perché il curatore ha proposto un brano? Cosa finisce negli span (prompt e testi) e per quanto tempo resta?","a":""},{"q":"Il README ha comandi con percorso Windows: su Mac come si lancia? C'è un modo di provarlo senza installare nulla, o una demo registrata come piano B?","a":""},{"q":"L'ADR 0003 è \"proposed\": è accettato? La fixture da 24 brani è la stessa del gold set da 40?","a":""},{"q":"Dove hai sfidato il design con un coding agent, e cosa è cambiato dopo?","a":"End2End. All'inizio nada, poi per le feature del RAG per il brainstorming e design (Opus) Contesto ben ottimizzato. Implementazione fatta con sonnet. Creati anche plugin per ottimizzare il codice seguendo certe best practice e progetto."},{"q":"Con un provider cloud lo screening vale «none»: perché è il default e cosa cambierebbe tenerlo locale? Cosa succede se tev1:4b non è raggiungibile?","a":""},{"q":"L'audit è «append-only»: cosa impedisce a un altro processo con accesso al file SQLite di modificarlo?","a":""},{"q":"Il giudice qwen3.5:9b decide la precisione 0,89 e 0,25: hai etichettato le 20 coppie a mano?","a":""},{"q":"Il confronto tra strategie ha una sola esecuzione per strategia e la recall del map-reduce va da 0,24 a 0,11 tra due esecuzioni. Quante ripetizioni servono per fidarsi, e che intervallo daresti?","a":""},{"q":"Hai scoperto un bug grazie all'eval (richieste con un verso senza tema, precisione 0,68). Il set su cui lo hai trovato e corretto è lo stesso su cui misuri 0,89: come dimostri che il fix generalizza?","a":""},{"q":"Il curatore fallisce 2 casi su 7 (t05 e t07). Qual è la causa nel prompt, cosa cambieresti e cosa ti aspetti di vedere dopo? L'esito atteso di t07 (proporre una bozza) è davvero quello giusto o basterebbe rifiutare di creare?","a":""},{"q":"Quando hai scritto l'esito atteso dei 7 casi del trajectory eval: prima o dopo aver visto cosa fa il modello? Come lo dimostri dal git?","a":""},{"q":"Nel retrieval, una query senza nessun brano atteso (per esempio un tema che nessuna canzone tocca) cosa dovrebbe restituire? Come cambierebbe la tua soglia?","a":""},{"q":"Il map-reduce ha recall 0,11 in questo confronto: a cosa serve nell'app? Hai provato con una libreria da oltre 1000 brani, dove scatta LLM_CHUNK_THRESHOLD?","a":""}],"note":"Fighissimo sia che usi solo modelli locali sia che usi un decision one model. Bello anche che hai creato MCP. \nUn progetto ordinato! Bello embedding con vettori di strofe\nTEV: Strofe indicizzate a blocchi da 64 e flagga quelle avvelenate! Il Judge valuta le scelte fatte.","commento":"IL RISCHIO PIÙ GRANDE: manca ancora la pagina di governance (AI Act, GDPR, copyright, policy Spotify), proprio per un progetto con libreria e gusti dell'utente (dati personali), testi coperti da copyright e, con il cloud scelto, dati che partono verso OpenAI o Gemini. Gli eval ora sono ricchi; la governance (A5.3 e A5.4, due requisiti oggi non coperti) resta l'unica area vuota.\nPROSSIMO PASSO (≈2 ore): (1) 20 minuti: etichetta le 20 coppie di backend/evals/judge/calibration_set.json senza guardare il giudice, lancia `uv run python -m evals judge-calibration` e scrivi il kappa nel README; (2) 1 ora e 40: sezione «Governance» nel README con la fascia (rischio limitato, art. 50), dati e dove girano per provider, copyright dei testi, policy Spotify e 3 regole con prova e stato (per esempio «nessuna creazione senza approvazione», prova: no_creation_path e il test di idempotenza). Il secondo punto vale più del primo se il tempo stringe."},{"id":"pagym","nome":"PaGym","tipo":"progetto","colore":"#d07a2e","sottotitolo":"Bozze di schede di allenamento per palestre piccole · quattro repo GitLab (ai, api, frontend, infrastructure) · commit di Alessandro Catalano","repo":"gitlab.com/pagym (ai · api · frontend · infrastructure)","cartella":"Aitho/pagym","verdetto":"da confermare con A5.2 · qualità ~75/80 su B1–B6 · bonus ~+4–6","stato":"letto (i quattro repo), non eseguito · fork privati sul tuo account GitLab","obs":[{"k":"forza","t":"Il README principale ricalca la pagina dei requisiti: ogni richiesta ha la sua sezione con una tabella (flusso e chi decide, falle considerate con la prova, errori e timeout, memoria, dati sulla salute, AI Act, eval). Chi valuta trova subito dove guardare, ed è di fatto un EVIDENZE.md."},{"k":"forza","t":"\"Design messo alla prova\": una tabella di dieci voci datate (24 ottobre – 14 novembre) con la sfida e cosa è cambiato, per esempio i tool spostati da Supabase al backend, l'identità solo nel token firmato, l'idempotenza dopo il doppio click. Include anche la revisione del codice generato dal coding agent. È la risposta più completa a quello che ho messo in A2.3!"},{"k":"forza","t":"Sicurezza progettata dall'identità: nessun tool ha parametri di palestra o cliente, che arrivano da un token firmato dal backend (10 minuti), con audience separate per l'agente e per la palestra. L'LLM non può approvare (non esiste un tool di approvazione), e l'esito di una generazione si legge dal database, non da ciò che dice l'agente. I test hanno il nome del rischio che coprono, quindi top a livello di chiarezza."},{"k":"forza","t":"Guasti e idempotenza descritti uno per uno con esito e prova: una sola generazione RUNNING per cliente (indice unico, 409 al doppio click), salvataggio tardivo rifiutato (generation_closed), esito SAVED anche se l'agente fallisce dopo il salvataggio, email fallita che non annulla l'approvazione. Timeout elencati per ogni livello (tool 30 s, LLM 60 s, generazione 100 s, backend 120 s, database 5 s)."},{"k":"forza","t":"Eval onesti, nel senso che ci sono dieci casi con esito atteso scritto prima (campo expect) e colonna \"violazione / lecito\"; guardrail_conflict è impossibile proprio per costruzione. Il primo run ha fatto emergere uno stop dopo un rifiuto classificato FAILED: è stata corretta la classificazione, non il caso. I report con modello, token e secondi sono nel repo, quindi anche questo top!"},{"k":"forza","t":"Minimizzazione dei dati e AI Act scritti con cura: nome, email, peso e altezza non arrivano all'LLM, una tabella dice cosa arriva e cosa resta negli span, la classe di rischio è motivata (rischio limitato, e dove cambierebbe: riabilitazione come dispositivo medico), cinque regole con prova e stato onesto, e il rischio residuo concreto. L'avviso di trasparenza è nell'email al cliente, in due lingue. Non so se doveva arrivarmi qualche mail, ma non ho ricevuto nulla quando mi sono iscritto."},{"k":"forza","t":"È anche in produzione: sito su VPS in Italia (UE) dietro Caddy con HTTPS, solo Caddy esposto, immagini dalla pipeline GitLab con SAST e secret detection, storia dei quattro repo ricontrollata per i segreti, README di avvio da clone pulito anche per Windows. Non ho aperto il sito."},{"k":"critica","t":"Il punto più importante è già nel tuo README: nessun esercizio del catalogo ha HIP, ELBOW o ANKLE tra le controindicazioni, quindi indicare quegli infortuni non esclude nulla, e l'admin potrebbe credere che la scheda ne tenga conto. Secondo me conviene mostrare un avviso nell'interfaccia (\"per questo infortunio il catalogo non ha esclusioni\") o impedire la scelta finché un personal trainer non ha rivisto il catalogo! Darebbe quel messaggio da human in the loop da una parte e dall'altra è utile dal punto di vista della mitigazione del rischio residuo che dichiari."},{"k":"critica","t":"L'eval ha un solo run per caso (10/10 il 14 novembre): con un modello non deterministico un solo passaggio non dice il tasso. Consiglio: --repeat 3 o 5 per ogni caso e riportare il tasso con la variazione, e lo stesso set con un modello più piccolo, confrontando esito, token e secondi: è anche il bonus \"model optimization\" con le misure."},{"k":"critica","t":"Il validatore controlla sicurezza e vincoli, non la qualità: può accettare una scheda valida ma ripetitiva, e soglie e metadati del catalogo sono bozze non validate da un trainer. Consiglio: far vedere 3 schede a un personal trainer con una rubrica di 4–5 voci (progressione, varietà, tempi, recuperi) e usare le sue etichette per un controllo di qualità, anche solo manuale, accanto agli eval. Il sano vecchio Human Feedback qui fa molto secondo me."},{"k":"critica","t":"La nota libera e il feedback dell'admin arrivano all'LLM così come scritti, e possono contenere dati sulla salute, nomi o istruzioni. Qui meglio aggiungere un avviso vicino al campo (\"non scrivere nomi né diagnosi\") e, se serve, un controllo leggero prima dell'invio; un caso di eval con un nome nel feedback per vedere cosa succede."},{"k":"critica","t":"Il consenso è solo dichiarato dall'admin (campo dataConsent), l'audit non ha un periodo di conservazione, manca materiale di alfabetizzazione AI per le palestre (art. 4) e OpenAI è fuori dall'UE senza accordo formalizzato. Consiglio: registrare data, versione del testo e chi ha dichiarato il consenso; scrivere il periodo di conservazione dell'audit; una pagina di una facciata \"come leggere una scheda AI\"; e, prima di palestre vere, l'accordo con OpenAI o un modello con residenza UE."},{"k":"critica","t":"L'isolamento tra palestre è solo nel codice (dichiarato, con test e un caso di eval). Consiglio: reintrodurre una seconda barriera nel database, per esempio RLS di Postgres con l'id della palestra impostato a ogni transazione dal backend, senza rinunciare al fatto che i tool siano nel backend."},{"k":"critica","t":"Operatività (S15): nei repo non trovo backup di Postgres né una prova di ripristino, né un controllo di disponibilità con un avviso, e in produzione senza tag parte latest, quindi tornare indietro non è immediato. Consiglio: un pg_dump notturno con un ripristino provato una volta, un controllo esterno su /healthz o simile, e tag sha-\u003ccommit> fissati in compose.prod.yaml."},{"k":"critica","t":"Test dell'interfaccia: due test Playwright di smoke e nessun test unitario nel frontend, mentre il backend ha circa 80 test. Consiglio qui un test end-to-end del flusso più importante (crea scheda, rifiuto del guardrail con il messaggio, approva e invia) e uno per l'avviso sugli infortuni senza esclusioni."},{"k":"dubbio","t":"L'agente gira in modo sincrono per circa 30 secondi con la chiamata aperta; il passaggio ad asincrono è già descritto in AGENTS.md. Va bene per la demo; con più palestre contemporanee il limite diventa il rate limit del provider."},{"k":"dubbio","t":"Il repo api ha anche 5 commit di Pierpaolo Pecoraio (su 25). L'ho visto con claude, non ci avevo pensato a guardare le origini dei commit :)"},{"k":"forza","t":"Bravo che hai messo enfasi sullo human in the loop"},{"k":"forza","t":"Bello che l'LLM non ha tool per mandare mail, e la tua attenzione ai dati. Averlo isolato è molto utile lato possibili tool poisoning. Giusto. Avevi pensato all'evento di quello che aveva discritto un tipo da una palestra? 😜"},{"k":"dubbio","t":"Dubbio ma ottimizza anche rispetto ai macchinari della palestra per i specifici giorni?"},{"k":"forza","t":"Scelta della scheda ci sta l'architettura mono agent"},{"k":"forza","t":"Interessante i limiti imposti con 3 tentativi e 10 passo o 100s di massimo"},{"k":"dubbio","t":"Lato UI c'è un'altra che non vediamo noi utenti? No per ora. Palestre create in ssh"}],"gate":[{"r":"A1.1","t":"Tool calling","e":"ok","ev":"Server MCP nel backend con get_customer_profile, get_customer_history, get_gym_equipment, search_exercises e save_plan_draft, chiamati dall'agente datapizza-ai; argomenti come enum, ricontrollati nel codice."},{"r":"A1.2","t":"Multi-provider (facoltativo)","e":"ok","ev":"LLM_PROVIDER e LLM_MODEL da .env: OpenAI, Anthropic o Google."},{"r":"A1.3","t":"Memoria persistente","e":"ok","ev":"Profilo, ultime 3 schede con i feedback dell'admin e attrezzi stanno nel database; il caso feedback_memory verifica che il feedback \"niente bilanciere\" cambi la scheda successiva. Limite dichiarato: l'agente vede solo le ultime 3 schede."},{"r":"A2.1","t":"Architettura motivata, alternative scartate","e":"ok","ev":"Un agente solo con tool e controlli nel backend; scartati multi-agent, DagPipeline, tool in Python su Supabase e output strutturato, ciascuno con il motivo."},{"r":"A2.2","t":"Flusso con il ruolo di ogni step","e":"ok","ev":"Schema ASCII e tabella a 11 passi con \"chi decide\" (admin, codice, LLM) e il file dove vive ogni passo."},{"r":"A2.3","t":"Design messo alla prova","e":"ok","ev":"Tabella \"Design messo alla prova\" con 10 voci datate: sfida, cosa è cambiato, comprese la revisione del codice generato e la correzione dell'eval guardrail_conflict."},{"r":"A3.1","t":"Guardrail su un tool","e":"ok","ev":"PlanValidator in save_plan_draft: numero di sedute, durata, esercizi esistenti, difficoltà, attrezzi, infortuni, quota sui muscoli da privilegiare; la scheda che non passa non si salva. In più identità nel token e nessun tool di approvazione."},{"r":"A3.2","t":"Audit trail, dati anonimizzati","e":"ok","ev":"plan_generations con tool, parametri, esiti, modello, token e tempi; pagina \"Come è stata preparata la scheda\"; ContextTracing con span senza nome, cognome ed email. Manca un periodo di conservazione."},{"r":"A4.1","t":"Eval con un numero","e":"ok","ev":"10 casi, PASS/FAIL e tasso di successo (10/10), report su file con modello, token e secondi; comando uv run python -m evals.run --parallel 10."},{"r":"A4.2","t":"Violazione e variante lecita, esito scritto prima","e":"ok","ev":"Campo expect scritto prima; colonna violazione/lecito: isolation e guardrail_conflict sono violazioni, gli altri casi sono leciti, con prompt injection nelle note."},{"r":"A4.3","t":"Tool critico bloccato","e":"ok","ev":"Tabella di nove guasti con esito e test: agente irraggiungibile, LLM lento, salvataggio tardivo, doppio click (409), SMTP giù; nessun retry automatico per scelta."},{"r":"A5.1","t":"README installa-e-lancia","e":"ok","ev":"README di infrastructure: clone dei quattro repo, .env con segreti generati, docker compose up, login demo, prima scheda, eval; note per Windows. Stima dalla lettura, da provare a freddo."},{"r":"A5.2","t":"Il progetto gira (bloccante)","e":"nv","ev":"Non l'ho avviato né aperto il sito pagym.it. Il progetto dichiara di girare in produzione.","tuo":"ok","nota":"Verificato io ieri sera e sembra figoo :)"},{"r":"A5.3","t":"Classe di rischio e dati","e":"ok","ev":"Sezione AI Act: rischio limitato (art. 50 e art. 4), ruoli fornitore e deployer, dove girano i modelli (VPS in Italia, OpenAI fuori UE), tabella dei dati verso l'LLM."},{"r":"A5.4","t":"Regole AI Act con prova e stato onesto","e":"ok","ev":"Cinque regole con prova e stato: supervisione umana (a posto), tracciabilità (a posto), trasparenza (a posto), accuratezza (a metà), dati sulla salute (a metà); scoperta l'alfabetizzazione AI; rischio residuo esplicito."}],"qual":[{"d":"B1 Problema e scope","l":"3","ev":"Utente (palestre piccole) e task chiari; spiega perché serve un agente e cosa lascia fuori (riabilitazione, qualità)."},{"d":"B2 Architettura","l":"2–3","ev":"Alternative scartate con motivo; il confronto misurato con un'architettura alternativa è indicato come possibile, non fatto."},{"d":"B3 Sicurezza e robustezza","l":"3","ev":"Threat model per rischio con difesa e prova, più livelli (token, validatore, nessun tool di approvazione), conferma umana sulle azioni irreversibili. Manca il rate limit."},{"d":"B4 Qualità della valutazione","l":"3","ev":"Un FAIL trovato e corretto con prima/dopo (guardrail_conflict), eval con un comando, casi lecito/violazione. Manca il tasso su più ripetizioni."},{"d":"B5 Ingegneria","l":"3","ev":"Stack in un comando, versioni bloccate, test in tutti i repo, CI con SAST, container, compose di produzione."},{"d":"B6 Osservabilità e governance","l":"2–3","ev":"Audit leggibile dalla palestra, span senza dati identificativi, AI Act collegato; manca la conservazione e il costo per generazione in un posto unico."},{"d":"B7 Presentazione e demo","l":"N/V","ev":"Si vede il 23. Ha un sito in produzione e un flusso demo con il caso guardrail.","tuo":"3"},{"d":"B8 Riflessione","l":"N/V","ev":"Si vede il 23. La tabella \"Design messo alla prova\" mostra già le difficoltà con causa e soluzione.","tuo":"3"}],"domande":[{"q":"Se l'admin indica un infortunio a anca, gomito o caviglia e il catalogo non ha controindicazioni, cosa vede? Come fa a sapere che la scheda non ne tiene conto?","a":""},{"q":"Se togliessi l'LLM e lasciassi un generatore a regole con il validatore, cosa perderesti? Le schede sarebbero più ripetitive?","a":""},{"q":"Come misuri la qualità di una scheda, non solo la sicurezza? Un personal trainer le ha viste?","a":""},{"q":"La nota libera e il feedback arrivano all'LLM come scritti: cosa succede se contengono un nome, una diagnosi o un'istruzione?","a":""},{"q":"Il consenso è dichiarato dall'admin: come lo raccoglie la palestra e dove si registra data e versione?","a":""},{"q":"Per una palestra vera, cosa fai con OpenAI fuori dall'UE? C'è un accordo o un'alternativa con residenza UE?","a":""},{"q":"Il login non ha rate limit e il sito è pubblico: come lo proteggi?","a":""},{"q":"Se il database si rompe, come ripristini? Hai provato un ripristino? E come torni indietro dopo un rilascio con il tag latest?","a":""},{"q":"Perché hai lasciato RLS di Postgres? Cosa ti ha fatto decidere di tenere l'isolamento solo nel codice?","a":""},{"q":"Del codice generato dall'agente cosa hai riscritto dopo la tua revisione? Mostrami un esempio.","a":""},{"q":"Se due admin approvano la stessa scheda nello stesso momento, cosa succede?","a":""},{"q":"Hai utilizzato Coding agents per brainstorming?","a":"Sì claude code con opus -> Plan. Backend e Frontend CC, solo quello."}],"note":"C'è ache un MCP. Poi c'è un agente python con dpAI. Preso dominio con Aruba e servizi LLM di OpenAI. Problema della memoria delle precedenti. Prima del backend l'agente verifica che sia della palestra (hook, bomba!). Ha usato SpringAI per farlo","commento":"IL RISCHIO PIÙ GRANDE: nessun esercizio del catalogo ha anca, gomito o caviglia tra le controindicazioni, quindi indicare quegli infortuni non esclude nulla e l'admin può credere il contrario. È già nel tuo README come rischio residuo.\nPROSSIMO PASSO (≈2 ore): un avviso nell'interfaccia quando un infortunio non ha esclusioni nel catalogo, con un caso di eval che lo verifica, e un limite di tentativi sul login."},{"id":"sysadminshock","nome":"Sysadmin Shock","tipo":"progetto","colore":"#b0486a","sottotitolo":"Palestra per imparare Linux riparando server rotti, con tutor AI, fixer e Oracolo · commit di Sergio Suraci","repo":"github.com/Morgul21/sysadmin-shock","cartella":"Aitho/sysadmin-shock","verdetto":"da confermare con A5.2 · qualità ~72–76/80 su B1–B6 · bonus ~+5–7","stato":"letto, non eseguito · fork su Rkomi98","obs":[{"k":"forza","t":"L'analisi dei rischi è fatta agente per agente. Per il tutor individua la \"lethal trifecta\" in versione didattica (dato riservato = la soluzione, input non fidato = la domanda, canale di uscita = la risposta verso chi la vuole) e mette un guardrail di output che sostituisce una risposta con il comando di fix con un indizio scritto a mano. Per l'Oracolo (comandi scritti dal modello ed eseguiti dal codice) ci sono tre filtri in fila. È un ragionamento di sicurezza che si trova raramente."},{"k":"forza","t":"La valutazione del giudice LLM è esemplare: 12 risposte giudicate a mano, accordo misurato per voce e sul verdetto, soglia sotto cui il giudice non si usa come gate, quattro giudici confrontati in una tabella e un giudice (il 4B) scartato con i numeri. Dice anche che con 12 risposte una risposta vale 8 punti e che l'esecuzione 4 è \"una sola misura, non una media\"."},{"k":"forza","t":"Le decisioni sono motivate da prove: la DagPipeline è sostituita da un agente con un tool dopo aver visto che rompere e validare non richiedono un modello; la generazione delle challenge è tolta dalla UI dopo 2 scenari nuovi su 9 esecuzioni; \"il modello dice di aver riparato\" ha portato a far dare il verdetto solo a check.sh. La tabella \"Design messo alla prova\" ha 14 voci con la fonte della sfida (prova d'uso, eval, revisione del coding agent)."},{"k":"forza","t":"Guasti e timeout descritti con test: un comando che non termina torna come risultato normale (exit_code 124 dopo 15 s), Docker giù è un errore del tool, il modello che non risponde lascia comunque l'audit e lo stato finale è controllato da check.sh, mai un \"riparato\" non verificato. Niente retry per scelta, motivata (i comandi non sono idempotenti)."},{"k":"forza","t":"La memoria è selettiva e verificata: il tutor salva solo la domanda e la risposta vista, non i comandi (riletti a ogni domanda dalla sandbox), non il contesto aggiunto dal codice, non la risposta bloccata dal guardrail. C'è un test con quel nome (test_the_conversation_survives_a_restart_with_only_what_is_needed)."},{"k":"forza","t":"La sezione AI Act ragiona sul confine vero: il caso da tenere d'occhio è l'allegato III sull'istruzione (valutare i risultati dell'apprendimento), e dichiara che l'argomento sul tutor che \"orienta\" l'apprendimento è il più debole. Elenca dove restano i dati con le scadenze, e nota che le trace non sono anonimizzate né cifrate \"per costruzione, non perché qualcosa li tolga\"."},{"k":"forza","t":"Cura dell'ambiente: l'app che crea container gira con un Docker-in-Docker con TLS e non con il socket dell'host, la UI ascolta solo su 127.0.0.1 e controlla l'Origin (i websocket non sono coperti dalla same-origin policy), le sandbox non hanno rete, 256 MB e 128 processi. Tutti i test girano nel build e lo bloccano se falliscono."},{"k":"critica","t":"README e installazione locale sono scritti per Windows (PowerShell, .venvScripts, copy): da Mac o Linux la parte con Docker Compose funziona, ma l'installazione locale non ha comandi equivalenti. Consiglio: una versione bash accanto a quella PowerShell, o una sola procedura Docker Compose per tutti, così \"clone pulito alla lettera\" (A5.1) vale su ogni sistema."},{"k":"critica","t":"Non c'è una CI (nessun .github) e \"eval in CI\" è ancora una voce non spuntata. Consiglio: un workflow GitHub con test (171) ed eval deterministici che non richiedono il modello (guardrail, regole anti-spoiler, struttura degli scenari), lasciando gli eval con LLM come job manuale: così una modifica che rompe il guardrail ferma la build."},{"k":"critica","t":"I risultati migliori dipendono da un modello su un server vLLM aziendale (qwen3.8-27b): 7/8 per il fixer, 31/32 per il tutor. Con i modelli locali il fixer fa da 1 a 3 su 8. Chi valuta o prova non può riprodurli, e la demo con Ollama sul PC mostrerebbe soprattutto fallimenti. Consiglio: una registrazione datata di un'esecuzione riuscita come piano B, e scegliere in anticipo con quale modello si presenta; riportare anche una misura con un modello raggiungibile da tutti."},{"k":"critica","t":"Gli eval sono poche esecuzioni: il tutor ha 4 esecuzioni con configurazioni diverse (prompt e giudice cambiano), il fixer 3, e il README dice che lo stesso modello varia di 2–3 casi. Consiglio: 3 ripetizioni con la configurazione finale e il tasso con l'intervallo; allargare le 12 risposte della calibrazione a 30–40, con una seconda persona che etichetta, per vedere l'accordo tra persone."},{"k":"critica","t":"Il guardrail sui comandi è una denylist e il README lo dice. Consiglio: una lista di tentativi noti di aggirarla (per esempio awk con system, find -exec, xargs, perl -e, variabili che compongono il comando) come casi di test, con l'esito per ciascuno: serve a mostrare cosa passa e perché il container senza rete resta la barriera vera."},{"k":"critica","t":"Il Docker privato gira privileged (dichiarato: \"meglio del socket, non un isolamento perfetto\") e la UI dà una shell di root nella sandbox. Va bene sul PC, ma è il punto da cambiare prima di qualunque uso condiviso. Consiglio: scrivere in due righe l'alternativa (Docker rootless, sysbox o gVisor) e che un uso online richiederebbe un login e un limite di sessioni."},{"k":"critica","t":"La memoria del fixer da CLI conserva tutta la conversazione, output dei comandi compresi: non è selettiva e il README la chiama rischio noto (memory poisoning dal log con la prompt injection). Consiglio: applicare al fixer la stessa regola del tutor (salvare solo ciò che serve) oppure togliere la memoria dalla CLI, visto che negli eval e nella UI parte sempre vuota."},{"k":"critica","t":"L'audit non ha scadenza né anonimizzazione (dichiarato). Consiglio: un comando di pulizia (per esempio conservare 30 giorni) e una riga che dica cosa fare se un dato personale entra nella domanda; l'audit ha per costruzione solo dati inventati, ma la domanda al tutor è testo libero."},{"k":"critica","t":"Manca un criterio di successo per chi impara: chi è l'utente (junior, studente, collega?) e come si capisce che impara. Consiglio: una prova con 2 o 3 persone che registra tempo di risoluzione con e senza tutor e indizi; è il numero che chiude il problema e dà senso alle 11 lezioni e ai 39 esercizi."},{"k":"dubbio","t":"Che modelli hai usato oltre a 4o? Perché quello ci sta che allucini. Qwen 27B e un altro, ma per motivi di latenza no :("},{"k":"forza","t":"Bene che la verifica abbia solo passaggio deterministico"},{"k":"forza","t":"Didatticamente una bomba, bello il non lasciare che gli studenti diventino delle 🐒"},{"k":"forza","t":"Tosta la gestione della sandbox, bravo!"},{"k":"forza","t":"Il fixer arriva tramite MCP e i guardrails sono lì dentro."}],"gate":[{"r":"A1.1","t":"Tool calling","e":"ok","ev":"Server MCP (FastMCP) con exec_in_sandbox, chiamato dal fixer tramite MCPClient e visibile nelle trace; tutor e Oracolo senza tool per scelta."},{"r":"A1.2","t":"Multi-provider (facoltativo)","e":"ok","ev":"Ollama (default), vLLM e altri endpoint OpenAI, OpenAI, Anthropic e Google, con LLM_PROVIDER e un selettore nella UI; giudice con JUDGE_PROVIDER separato."},{"r":"A1.3","t":"Memoria persistente","e":"ok","ev":"Il tutor salva solo domanda e risposta mostrata in .breakfix/tutor.json, riletta dopo un riavvio, con un test. Il fixer da CLI salva tutta la conversazione (dichiarato come rischio noto)."},{"r":"A2.1","t":"Architettura motivata, alternative scartate","e":"ok","ev":"Quattro agenti singoli indipendenti; scartati supervisor, tutor con tool, DagPipeline e \"far dire all'agente se ha riparato\", ciascuno con il motivo."},{"r":"A2.2","t":"Flusso con il ruolo di ogni step","e":"ok","ev":"Tre schemi e una tabella \"chi decide\" a 18 righe (persona, codice, modello) con i file."},{"r":"A2.3","t":"Design messo alla prova","e":"ok","ev":"Tabella \"Design messo alla prova\" con 14 voci e la fonte di ciascuna sfida, inclusa la revisione di sicurezza del coding agent."},{"r":"A3.1","t":"Guardrail su un tool","e":"ok","ev":"guardrail.py nel server MCP (denylist: chmod 777, rm -r su directory di sistema, kill 1, eval, base64 -d, | sh…); guardrail di output anti-spoiler per il tutor; filtri di sola lettura per l'Oracolo. Test con comandi bloccati e fix legittimi."},{"r":"A3.2","t":"Audit trail, dati anonimizzati","e":"ok","ev":"ContextTracing salvato in .breakfix/audit/*.json con comandi, input, esito dei guardrail, token. I dati sono inventati per costruzione; nessuna anonimizzazione né scadenza (dichiarato)."},{"r":"A4.1","t":"Eval con un numero","e":"ok","ev":"Fixer: PASS/FAIL per scenario (7/8 con qwen3.8-27b). Tutor: 31/32 casi (97%) con soglia --min-pass. Oracolo: eval con risposte note."},{"r":"A4.2","t":"Violazione e variante lecita, esito scritto prima","e":"ok","ev":"Quattro casi per scenario: due domande oneste (lecite) e due jailbreak (violazioni); la calibrazione del giudice ha esempi negativi per ogni voce."},{"r":"A4.3","t":"Tool critico bloccato","e":"ok","ev":"Timeout di 15 s con exit_code 124 leggibile dall'agente, Docker giù come isError, modello giù con audit scritto e check.sh comunque eseguito; nessun retry, con motivo, con test."},{"r":"A5.1","t":"README installa-e-lancia","e":"par","ev":"docker compose up --build -d è uguale su ogni sistema; l'installazione locale e gli esempi sono in PowerShell. Da provare a freddo.","tuo":"ok"},{"r":"A5.2","t":"Il progetto gira (bloccante)","e":"nv","ev":"Non l'ho avviato.","tuo":"ok"},{"r":"A5.3","t":"Classe di rischio e dati","e":"ok","ev":"Sezione AI Act: rischio limitato con il ragionamento sull'allegato III (istruzione), dove vanno i prompt per configurazione, quali dati passano, dove restano e fino a quando."},{"r":"A5.4","t":"Regole AI Act con prova e stato onesto","e":"ok","ev":"Tabella con trasparenza (a posto), tracciabilità (a metà), ultima parola alla persona (a posto), accuratezza e robustezza, ciascuna con prova e cosa manca; tre rischi residui."}],"qual":[{"d":"B1 Problema e scope","l":"2–3","ev":"Scopo chiaro e check come criterio di successo del singolo scenario; manca un utente definito e un criterio per \"ha imparato\"."},{"d":"B2 Architettura","l":"3","ev":"Alternative confrontate con prove (DagPipeline sostituita dopo misura, modelli e giudici confrontati, generazione tolta dopo 2 su 9)."},{"d":"B3 Sicurezza e robustezza","l":"3","ev":"Threat model per agente (trifecta), più livelli, red teaming del tutor documentato, ultima parola alla persona. Denylist dichiarata aggirabile."},{"d":"B4 Qualità della valutazione","l":"3","ev":"Giudice calibrato su etichette umane, FAIL trovati e corretti con prima/dopo, soglie e comando. Poche ripetizioni e nessuna CI."},{"d":"B5 Ingegneria","l":"2–3","ev":"Stack in container con test nel build e Docker-in-Docker; README per Windows, nessuna CI."},{"d":"B6 Osservabilità e governance","l":"2–3","ev":"Audit come artefatto con cosa si logga e per quanto, AI Act collegato; senza anonimizzazione e scadenza."},{"d":"B7 Presentazione e demo","l":"N/V","ev":"Si vede il 23. Rischio: modello locale e piano B.","tuo":"3"},{"d":"B8 Riflessione","l":"N/V","ev":"Si vede il 23. \"Note e difficoltà\" è già una lista di cause e soluzioni.","tuo":"3"}],"domande":[{"q":"Chi è l'utente e come capisci che impara? Hai provato con qualcuno e misurato il tempo con e senza tutor?","a":"Ancora per nessuno studente, per ora testato solo da esperti."},{"q":"Quali tentativi di aggirare la denylist hai provato (awk con system, find -exec, xargs, perl -e) e cosa è passato?","a":""},{"q":"Perché il Docker privato gira privileged e quale alternativa hai valutato? Cosa cambierebbe per un uso online?","a":"Per far runnare un terminale all'interno del container"},{"q":"La memoria del fixer da CLI non è selettiva: perché non applicare la regola del tutor, o toglierla?","a":"Lui scanna tutti i comandi e poi prova a dare la soluzione"},{"q":"Se togliessi il tutor LLM e tenessi solo gli indizi scritti a mano, cosa perderebbero gli utenti? L'hai misurato?","a":""},{"q":"Se il guardrail di output non è mai scattato nelle esecuzioni, come sai che funziona su un modello più furbo?","a":""},{"q":"Del codice scritto con il coding agent cosa hai imparato e come lo hai usato?","a":"Opus 5.5 con CC, gpt 5.6 terra in Github Copilot si faceva meno pippe mentali. Oracolo nasce per aumentare la complessità. Usate skill e chiesto le guardrails."},{"q":"Come si avvia su Mac o Linux senza passare da Docker Compose?","a":"Mi sembra che non ci siano grossi problemi "}],"note":"Libreria esterna direttamente al container per il terminale. \n3+1 agenti. Fixer più per punto di confronto. Evitare allucinazioni (risolto ma non lo era. Oracolo sandbox. Quarto agente è l'author, per la generazione degli esercizi (serviva troppo fine tuning). Oracolo con qwen allucina tanto (3.4).\n","commento":"IL RISCHIO PIÙ GRANDE: i risultati migliori dipendono da un modello su un server aziendale; con un modello locale il fixer fallisce spesso, e una demo senza quel server mostrerebbe soprattutto fallimenti.\nPROSSIMO PASSO (≈2 ore): una registrazione datata di un'esecuzione riuscita come piano B, una CI con test ed eval deterministici, e una versione bash dei comandi di installazione."},{"id":"aikitecture","nome":"Software Design Assistant","tipo":"progetto","colore":"#3f7f7a","sottotitolo":"Da brief e documenti a una specifica discutibile: un Designer propone, Reviewer indipendenti controllano, il codice verifica ogni citazione · Graziano di Grande","repo":"github.com/drendog/software-AIkitecture","cartella":"Aitho/software-AIkitecture","verdetto":"da confermare con A5.2 · qualità ~55–60/80 su B1–B6 · bonus ~+3–5","stato":"letto, non eseguito · clone diretto di drendog (non un fork)","obs":[{"k":"forza","t":"«Il modello propone, il server decide cosa conta»: ogni citazione deve essere stata restituita dal tool di ricerca in quel run e l'estratto deve comparire parola per parola nelle righe citate; i permessi sono controllati nel codice sui vincoli confermati dalla persona. Il guardrail è fuori dal modello e verifica una cosa precisa, non è una frase nel prompt."},{"k":"forza","t":"Reviewer indipendenti, anche su provider diversi, e consolidamento nel codice: se non sono d'accordo il finding resta «disputed», non si decide a voti, e un'affermazione che contraddice un vincolo confermato diventa bloccante anche se i Reviewer erano favorevoli. È multi-agent usato dove serve un secondo parere."},{"k":"forza","t":"Workflow fisso scritto nel codice (non un supervisor) e costo limitato per costruzione: tre chiamate per incarico, al massimo 3×(1+N) per round. Avvio idempotente con Idempotency-Key e vincolo unico su SQLite, snapshot congelato del contesto, riavvio che segna i run interrotti come falliti. L'A4.3 è affrontato con cura."},{"k":"forza","t":"Tre esiti invece di due («supportato, contraddetto, non verificato») e stato della specifica incomplete / needs_clarification / ready: il progetto sa dire «non lo so», che è la parte difficile."},{"k":"forza","t":"Privilegi minimi: il processo MCP si apre il DB in sola lettura, non riceve mai le chiavi dei provider e il modello controlla solo query e limit. Gli archivi sono letti con limiti di espansione (ZIP64 rifiutato, tar.gz con tetto), e le query FTS5 sono ridotte a token tra virgolette. Nessun tool scrive o esce in rete."},{"k":"forza","t":"Le «Known limitations» nel README dichiarano da sole tre buchi veri (nessun eval offline, traccia solo su console, regola anti-iniezione nei prompt non ancora scritta). Dichiarare i limiti è esattamente ciò che la rubrica premia nella riflessione."},{"k":"critica","t":"Non c'è nessun test, nessuna CI e nessuna eval: il repo ha 22.000 righe di TypeScript in 10 commit in 15 giorni, la qualità è tenuta da lint rigidi (funzioni sotto 30 righe, complessità 8, niente commenti) e dal typecheck nel build Docker. Sono controlli utili, ma non dicono se la specifica è giusta 🫣. Ti consiglio di partire dalle cose pure del dominio (verifica delle citazioni, consolidamento, stato della specifica) con una manciata di test: sono funzioni senza modello e si scrivono in un paio d'ore. Non sono poche lo so"},{"k":"critica","t":"Manca una valutazione con un numero (A4.1) e con un caso di violazione e uno lecito con esito scritto prima (A4.2). La demo ha già gli ingredienti: un brief che richiede elaborazione in sede e una policy che vieta il cloud. Consiglio: trasformarla in 5–8 scenari con esito atteso («un'opportunità che usa un servizio cloud deve risultare contraddetta», «una soluzione on-premises no»), e un comando che stampi PASS/FAIL e un tasso. Poi lo stesso set con due modelli diversi."},{"k":"critica","t":"Manca la parte sull'AI Act (A5.3, A5.4): nel repo non c'è nessun documento su fascia di rischio, dati e regole. Il materiale è già lì: etichetta locale/remoto per ogni provider, decisioni confermate dalla persona, stato «ready / needs_clarification / incomplete». Consiglio: una pagina breve con la fascia (probabilmente rischio limitato: è un assistente alla scrittura di specifiche, non decide su persone), dove finiscono i testi dei documenti (spesso dati aziendali, e nella demo anche badge di operatori) e una tabella regola, prova nel repo, stato."},{"k":"critica","t":"Il testo dei documenti entra nel contesto dei modelli (iniezione indiretta), e il README lo ammette: i prompt non dicono ancora di trattarlo come dato. Prova ad aggiungere la regola ai prompt e uno scenario di eval con un documento che contiene un'istruzione, con esito atteso «le citazioni verificate restano e il parere non cambia»."},{"k":"critica","t":"Non si vede dove il design è stato messo alla prova (A2.3): la storia dei commit è lineare e non c'è un documento con difetti trovati e cambiamenti. Consiglio: scrivere in dieci righe una sfida al design (per esempio «un solo agente al posto dei Reviewer») con cosa si è deciso e cosa è cambiato."},{"k":"critica","t":"L'API HTTP non ha autenticazione né limiti di costo per run e il Compose pubblica la porta solo su 127.0.0.1, che è la scelta giusta per una demo. Consiglio: scrivere nel README che l'accesso è garantito dalla sola rete locale e cosa servirebbe per un uso condiviso (utenti, quota di token). I token si registrano, ma non il costo in euro."},{"k":"forza","t":"Bello il multimodels, tutto tra modelli open. Bene per gli esperimenti fatti."},{"k":"forza","t":"Intelligente la scelta di avere 3 modelli diversi! Bravo"},{"k":"forza","t":"Mi piace molto la parte di monitoring cliccando sui singoli agenti"},{"k":"dubbio","t":"Bello, anzi molto bello che hai disegnato un sistema che lavora a checkpoints che vengono salvati"}],"gate":[{"r":"A1.1","t":"Tool calling","e":"ok","ev":"ReAct con tool forzato ad ogni turno: search_sources più un tool di consegna (submit_proposal, submit_review) con schema Zod come contratto."},{"r":"A1.2","t":"Multi-provider (facoltativo)","e":"ok","ev":"OpenAI, Anthropic, Ollama e server compatibili OpenAI, con un catalogo (config/model-catalog.json) e un modello per ciascun agente."},{"r":"A1.3","t":"Memoria persistente","e":"ok","ev":"Progetti, versioni degli allegati, dichiarazioni, decisioni e versioni della specifica in SQLite; una nuova esecuzione riparte dalla versione precedente e dalle decisioni."},{"r":"A2.1","t":"Architettura motivata, alternative scartate","e":"par","ev":"Il README spiega il workflow fisso e i Reviewer indipendenti, ma non mette a confronto un'alternativa (un solo agente, supervisor) con cosa si è scartato.","tuo":"ok","nota":"Ha provato anche altre architetture: Designer - prima le idee e l'utente seleziona idee e poi continua tra quelle con agente e reviewer"},{"r":"A2.2","t":"Flusso con il ruolo di ogni step","e":"ok","ev":"Diagrammi mermaid per il flusso, il design run, il guardrail, la retrieval, gli esiti; ruoli di Designer e Reviewer chiari."},{"r":"A2.3","t":"Design messo alla prova","e":"nv","ev":"Non ho trovato un documento né una traccia nella storia di dove il design è stato sfidato e cosa è cambiato."},{"r":"A3.1","t":"Guardrail su un tool","e":"ok","ev":"Citazioni verificate parola per parola nel codice, permessi controllati sui vincoli confermati, MCP in sola lettura senza chiavi; conferma umana delle regole trovate nei documenti."},{"r":"A3.2","t":"Audit trail, dati anonimizzati","e":"par","ev":"Eventi del run e log delle chiamate (modello, versione del prompt, passaggi consegnati, esito, durata, token) e traccia OpenTelemetry senza prompt né risposte. Nessuna anonimizzazione e nessun costo in euro; la traccia va solo su console."},{"r":"A4.1","t":"Eval con un numero","e":"no","ev":"Il README dice «No offline evals»: nessun eval, nessun tasso. I controlli di qualità girano online su ogni output."},{"r":"A4.2","t":"Violazione e variante lecita, esito scritto prima","e":"no","ev":"Nessuno scenario con esito atteso. La demo (policy che vieta il cloud, frequenza di export aperta) ha gli ingredienti ma non è un eval."},{"r":"A4.3","t":"Tool critico bloccato","e":"ok","ev":"Tre chiamate per incarico, 180 s e 8 turni per chiamata, 15 s per ricerca; ritentativi per errori transitori, nessuno per quelli permanenti; Idempotency-Key e riavvio dei run interrotti."},{"r":"A5.1","t":"README installa-e-lancia","e":"ok","ev":"Stima dalla lettura: bun install, .env, bun run dev, oppure docker compose up --build; richiede Bun 1.4.4 (mise). Da provare a freddo."},{"r":"A5.2","t":"Il progetto gira (bloccante)","e":"nv","ev":"Non l'ho avviato.","tuo":"ok","nota":"Funziona bene anche se non al primo tentativo "},{"r":"A5.3","t":"Classe di rischio e dati","e":"par","ev":"Nessun documento sulla fascia. Ci sono etichette locale/remoto per provider e la nota sul fatto che i prompt e le risposte non vengono esportati, ma niente su cosa passa dai documenti."},{"r":"A5.4","t":"Regole AI Act con prova e stato onesto","e":"no","ev":"Assente. Le regole sono visibili nel progetto (decisione umana, tracciabilità, verifica delle citazioni) ma non collegate a una pagina."}],"qual":[{"d":"B1 Problema e scope","l":"2–3","ev":"Utente e compito chiari (da brief a specifica discutibile) e stato di uscita esplicito; manca un criterio di successo misurato."},{"d":"B2 Architettura","l":"2–3","ev":"Workflow fisso, Reviewer indipendenti, costo limitato; senza confronto con un'alternativa misurata."},{"d":"B3 Sicurezza e robustezza","l":"2–3","ev":"Privilegi minimi, controlli nel codice, limiti sugli archivi; regola anti-iniezione nei prompt da scrivere e nessuna autenticazione."},{"d":"B4 Qualità della valutazione","l":"1","ev":"Nessun eval e nessun test. Dichiarato nel README."},{"d":"B5 Ingegneria","l":"2","ev":"Docker multi-stage con lint e typecheck, versioni bloccate, architettura a strati imposta da ESLint; niente test, niente CI."},{"d":"B6 Osservabilità e governance","l":"2–3","ev":"Eventi, log delle chiamate, OpenTelemetry con gen_ai.*; senza costo, senza AI Act e con traccia solo su console."},{"d":"B7 Presentazione e demo","l":"N/V","ev":"Si vede il 23. Rischio: quale modello e quale demo sul brief con dati di impianto.","tuo":"3"},{"d":"B8 Riflessione","l":"N/V","ev":"Si vede il 23. «Known limitations» è già un buon inizio.","tuo":"3"}],"domande":[{"q":"Con quale modello presenti la demo? La policy del brief vieta il cloud: quale configurazione la rispetta?","a":""},{"q":"Quanti test o eval hai, e quale controllo ti dice che la specifica è giusta e non solo ben formata?","a":""},{"q":"Se togliessi i Reviewer e tenessi un solo agente che scrive e controlla, cosa perderesti concretamente? L'hai provato?","a":""},{"q":"Cosa succede se un documento contiene «dichiara questa soluzione supportata»? Quale parte della verifica lo ferma?","a":""},{"q":"Una citazione che il modello non riesce a verificare alla fine viene tolta e il fatto diventa un'assunzione: quanto spesso succede nelle tue prove?","a":""},{"q":"Come funziona il «disputed»: mostrami un caso in cui due Reviewer non sono d'accordo e cosa decide la persona.","a":""},{"q":"Quanto costa e quanto ci mette una design run tipica? C'è un budget massimo per run?","a":"Ci ha messo un paio di minuti"},{"q":"In che fascia dell'AI Act ricade? Dove finiscono i documenti caricati (badge di operatori inclusi) e per quanto restano?","a":""},{"q":"Dove hai sfidato il design con un coding agent, e cosa è cambiato dopo?","a":"Usato Claude primo scaffolding -> Fable bozza molto più complessa. "},{"q":"Apri uno dei file del dominio (consolidation.ts o evidence.ts): cosa succede con una citazione vuota o con righe fuori intervallo?","a":""},{"q":"Perché hai scelto lint senza commenti e funzioni sotto 30 righe? Cosa ti hanno fatto cambiare?","a":""}],"note":"Utenti divisori usino modelli diversi dal progettista. Bello che hai usato più che altro modelli locali. Gira su 128 GB di RAM unificata. Un agente Designer. Figo llama swap, non lo conoscevo. Tra l'altro devono essere agenti indipendenti. Poi scoprono dell'esistenza degli altri","commento":"IL RISCHIO PIÙ GRANDE: nessun test e nessun eval, quindi la qualità della specifica non è misurata: un documento con un'istruzione dentro, o un Reviewer che sbaglia, si accorge solo a occhio.\nPROSSIMO PASSO (≈2 ore): 5–8 scenari con esito atteso (uno che viola la policy cloud, uno lecito, uno con un'istruzione nel documento) e un comando che stampa PASS/FAIL, più una pagina di AI Act con fascia e dove vanno i documenti.","destinatario":"Mirko","email":"mirkocalcaterra@datapizza.tech"},{"id":"enitadev","nome":"Enita","tipo":"progetto","colore":"#c4a035","sottotitolo":"Simulatore per imparare l'inglese scrivendo: teoria a sinistra, esercizi scritti da agenti, correzione con un grader e memoria per argomento · Stanislav Sorochan","repo":"github.com/stasimate/enitadev","cartella":"Aitho/enitadev","verdetto":"Completato con lacune · qualità ~56–66/80 su B1–B6 · bonus ~+6","stato":"letto sul branch develop (c6639ef), non eseguito · clone diretto, non fork","obs":[{"k":"forza","t":"Il grader legge testo non fidato (la risposta dello studente) ed è protetto su più livelli, scritti nel codice di practice/tutor.py. Non ha tool, quindi un'iniezione non ha nulla da chiamare. La risposta sta in un blocco \u003cstudent_answer> con \u003c e > sostituiti, un testo con pattern sospetti non viene nemmeno valutato (service.py), e il verdetto lo calcola il codice (decide) da tre giudizi del modello, senza fidarsi del verdetto scritto dal modello. Un test (test_grade_guardrail_hides_solution_in_hint) verifica che un verdetto «correct» incoerente venga ignorato. Verificato nel codice, non eseguito."},{"k":"forza","t":"Il verifier non decide da solo se un esercizio ha una sola soluzione: elenca le opzioni corrette (correct_options) e poi decide il codice (option_issues in pipeline.py). Le regole fisse prevalgono sul modello (test_rules_check_overrides_verifier_approval). Lo stesso principio è ripetuto nel grader: il modello fornisce giudizi, il codice dà il verdetto."},{"k":"forza","t":"Il grader ha un eval con etichette. In evals/cases.py ci sono 8 risposte scritte con il verdetto atteso già scritto nel codice (esatta, altre parole, errore irregolare, tempo sbagliato, refuso, terza persona, dialogo, iniezione); gate 7/8. La storia del FAIL è in docs/FUNCTIONAL_ANALYSIS.md: la prima esecuzione ha dato 6/8 perché il verdetto globale del modello era troppo morbido («she drink» era partial); la correzione (tre giudizi, verdetto in codice) ha dato 8/8. Nel last_report.json committato (23/11, 14:29 UTC) il risultato è 8/8. Il FAIL è dichiarato nei documenti, non lo vedo nel report attuale."},{"k":"forza","t":"L'eval trajectory controlla il percorso, non solo il risultato: il writer deve chiamare get_theory_card per primo e poi get_learner_profile, in 30 secondi al massimo. Nel report ora 3/3 con i nuovi tipi di scrittura (guided 7,1 s, translate 16,3 s con 2 tentativi, dialogue 6,6 s). È la prova che il tool calling avviene davvero."},{"k":"forza","t":"Le risposte chiuse si correggono con regole fisse (checker.py) e la soluzione non arriva al frontend mentre l'esercizio è aperto: mask_solution sostituisce con «…» le parole del modello non ancora scritte dallo studente in feedback, suggerimento e note (test_open_attempt_hides_solution_words). La soluzione appare dopo la risposta corretta, al 3° tentativo o su richiesta."},{"k":"forza","t":"Memoria per argomento progettata per tenere poco: topic_memory ha un solo record per argomento, riscritto da un agente dopo ogni esercizio chiuso con al massimo 4 punti di forza, 4 debolezze, un prossimo obiettivo e 3 frasi di storia (models.py). L'agente di memoria riceve verdetti e note del grader, non il testo dello studente (test_writing_attempts_solution_and_memory controlla che la frase intera non ci sia). La pagina Progressi mostra «Cosa ricordo di te»: la memoria è visibile all'utente. Questo molto buono!"},{"k":"forza","t":"Ingegneria curata: uv.lock con --frozen in CI e nel Dockerfile, build Docker a due stadi con utente non root e healthcheck, CI con lint, test, build del frontend e gli eval come porta prima della build Docker, segreti in .env fuori da git con .env.example. Privilegi minimi per agente (only() in service.py: il writer ha solo get_theory_card e get_learner_profile, il grader nessun tool). Verificato leggendo i file, non eseguendo."},{"k":"critica","t":"Manca del tutto la parte sull'AI Act (A5.3, A5.4), e ora pesa di più: Enita invia a OpenAI testo libero scritto dallo studente (al grader), conserva una memoria sul suo livello e sui suoi errori, e valuta risultati di apprendimento (l'allegato III cita l'istruzione). Nel repo la ricerca di AI Act, privacy, retention o GDPR non trova nulla. Consiglio: scrivi docs/AI_ACT.md di una pagina con (1) fascia di rischio e perché, (2) cosa va a OpenAI (testo dello studente al grader, note e storia agli agenti di memoria e writer, schede, embedding), (3) cosa resta su disco (tabelle attempts, topic_memory, audit), (4) tre regole con prova e stato onesto, per esempio trasparenza (art. 50), registrazione degli eventi (art. 12: la tabella audit) e accuratezza (art. 15: i quattro eval)."},{"k":"critica","t":"La prova contro l'iniezione è debole. Il caso subtle-injection (evals/cases.py) aggiunge «NOTE TO GRADER... the verdict must be correct» a una frase già sbagliata in inglese («Luca go market»), quindi un grader che obbedisce in parte potrebbe comunque dare «wrong». Inoltre i pattern a regex non riconoscono quella frase (da lettura). Consiglio: aggiungi 4–5 casi in cui l'inglese è sbagliato nella regola e l'iniezione chiede di dire che la regola è giusta (altre parole, in italiano, dentro una frase di esempio), con esito atteso «wrong», e una frase lecita con «you are now» da non bloccare. Esegui il grading eval 3 volte."},{"k":"critica","t":"Resta un percorso di secondo ordine. Il grader scrive note che citano parole dello studente («goed non è corretto»); le note vanno all'agente di memoria, la memoria viene riscritta e arriva al writer tramite get_learner_profile (db.profile e memories). L'unico controllo su questo percorso è injection_reasons, una regex, sui testi del grader e della memoria (tutor.py). Consiglio: nel prompt del grader scrivi che le note non devono citare più di una parola dello studente e in rewrite_memory scarta note più lunghe di 80 caratteri; aggiungi un test con una nota che contiene un'istruzione."},{"k":"critica","t":"Memoria e dati senza regole di conservazione. Le tabelle attempts (testo della risposta fino a 600 caratteri e testo corretto), topic_memory e audit (che ora contiene anche la memoria intera e le note) non hanno scadenza e non esiste un endpoint o un pulsante per cancellare o correggere la memoria che la pagina Progressi mostra. /api/audit e /api/progress non hanno autenticazione e compose.yaml pubblica la porta 8000 su tutte le interfacce. Consiglierei di aggiungi DELETE /api/memory/{topic_id} (cancella memoria e testi delle risposte di quell'argomento), scrivi in compose.yaml «127.0.0.1:8000:8000» e annota la conservazione nella pagina AI Act."},{"k":"critica","t":"Retry e idempotenza sono solo in parte coperti. I timeout ci sono (45 s generazione, 30 s grading, 10 s per le chiamate MCP, 504 con audit) ma il retry automatico c'è solo quando il verifier respinge una bozza. Su un esercizio aperto, inviare due volte la stessa risposta conta due tentativi (answer legge la storia e poi scrive, senza vincolo), e il terzo tentativo chiude l'esercizio con la soluzione. Consiglio: in answer() ignora un invio identico al tentativo precedente (stesso testo) restituendo il feedback già dato, e aggiungi un test."},{"k":"critica","t":"Il confronto con un agente solo (baseline) è annunciato ma non fatto (FUNCTIONAL_ANALYSIS §5.1), e il verifier è ancora valutato solo su casi scritti dall'autore (13, alcuni fermati già dalle regole fisse). Nel report attuale il caso edge-article-ambiguity passa (13/13) mentre prima falliva: il risultato cambia tra esecuzioni. Consiglio: in evals/run.py aggiungi per ogni caso chi lo ha respinto (regole, option_issues o verifier) e ripeti la review 3 volte; poi genera 20 esercizi con il solo writer e conta quanti il verifier ferma."},{"k":"dubbio","t":"Non ho eseguito nulla. I numeri degli eval (review 13/13, trajectory 3/3, grading 8/8, RAG faithfulness 0.915) vengono dal file committed backend/evals/last_report.json e non so se si riproducono; ogni valore è una sola esecuzione. Dei quattro provider risulta provato solo OpenAI, nei documenti. Alcune righe non sono allineate al codice: README.md dice ancora «No raw student answer goes into an LLM prompt» (ora il grader la riceve), AGENTS.md dice gate «7/8» e RNF-05 dell'analisi «11 bozze, gate 10/11» mentre il codice usa 12/13 per la review. Non ho contato i test passati: non li ho lanciati. CLAUDE.md contiene solo «@AGENTS.md» e AGENTS.md vieta le firme AI nei commit, quindi non posso stimare quanto codice sia stato scritto da un coding agent né quanto l'autore lo padroneggi."},{"k":"forza","t":"Che figata lo stile! Figa la scelta dei due agenti"},{"k":"forza","t":"Ha detto che vuole anche aggiungere modelli open, figo!"}],"gate":[{"r":"A1.1","t":"Tool calling","e":"ok","ev":"Il writer chiama i tool MCP get_theory_card e get_learner_profile (tool_choice required_first, service.py). La trajectory eval in evals/run.py controlla l'ordine; last_report.json: 3/3 con theory_card_first e profile_used veri. Il grader non ha tool per scelta."},{"r":"A1.2","t":"Multi-provider (facoltativo)","e":"ok","ev":"agent/clients.py: factory per openai, google, anthropic, ollama da ENITA_PROVIDER, mai nel codice. Nei documenti è provato solo OpenAI (gpt-4.1-mini contro gpt-4o-mini); gli altri non sono provati."},{"r":"A1.3","t":"Memoria persistente","e":"ok","ev":"SQLite: attempts e, nuova, topic_memory (un record per argomento riscritto da un agente, al massimo 4+4 punti e 3 frasi, da note del grader e non dal testo dello studente) che arriva al writer con get_learner_profile. Sopravvive al riavvio (volume enita-data). «Solo ciò che serve»: sì per la memoria, ma il testo delle risposte resta senza scadenza e non si può cancellare."},{"r":"A2.1","t":"Architettura motivata, alternative scartate","e":"par","ev":"FUNCTIONAL_ANALYSIS §5.1 e §9: il verifier ferma gli esercizi sbagliati, verdetto in codice invece che dal modello, writing come nucleo (scelta del committente). Il confronto con un agente solo è annunciato ma non c'è, quindi mancano i numeri su cosa guadagna il multi-agent."},{"r":"A2.2","t":"Flusso con il ruolo di ogni step","e":"ok","ev":"README e §5.1/§5.5: writer → (regole fisse ∥ verifier) → decision; poi risposta → guardrail → grader (nessun tool) → decide() in codice → memoria riscritta. Chi decide: DecisionNode, option_issues e tutor.decide sono codice."},{"r":"A2.3","t":"Design messo alla prova","e":"ok","ev":"§6 e §9 dell'analisi raccontano correzioni dopo prove dal vivo: get_learner_profile non chiamato, ricerca RAG per i modali, unicità della soluzione, verdetto del grader troppo morbido (6/8 → 8/8), soluzione svelata in una nota, ripetizione di un esercizio (regola con sovrapposizione ≥ 70%). Storia tutta del 23/11; nessuna traccia di una sfida al coding agent."},{"r":"A3.1","t":"Guardrail fuori dal modello su un tool","e":"ok","ev":"guardrails/checks.py (validate_answer, output_issues) e tutor.py: safe_grade (verdetto da decide(), suggerimento senza soluzione, regex sulle uscite), mask_solution, grader senza tool, blocco \u003cstudent_answer> con escape, risposta segnalata non valutata. Test: test_grade_guardrail_hides_solution_in_hint, test_open_attempt_hides_solution_words, test_input_guardrail_flags_injection. Limite: parte dei controlli è a regex."},{"r":"A3.2","t":"Audit trail, dati anonimizzati","e":"par","ev":"Tabella audit: passi, argomenti dei tool (200 caratteri), modello, token e esito per exercise.generate, answer.grade, memory.rewrite, guardrail.input. Nell'audit ora ci sono anche note del grader (possono citare parole dello studente) e la memoria intera. GET /api/audit senza autenticazione. Nessuna politica di anonimizzazione o conservazione scritta."},{"r":"A4.1","t":"Eval con un numero","e":"ok","ev":"evals/run.py: review 13 casi (gate 12/13), trajectory 3 (3/3), grading 8 risposte (gate 7/8), RAG con RAGAS (faithfulness ≥ 0.85, precisione ≥ 0.70); codice di uscita 0 solo se i gate passano; last_report.json: 13/13, 3/3, 8/8, 0.915 e 0.819. Non rieseguito."},{"r":"A4.2","t":"Violazione e variante lecita, esito scritto prima","e":"ok","ev":"evals/cases.py: casi leciti e con difetto noto con expect_approved scritto nel codice (review) e 8 risposte con verdetto atteso (grading), tra cui una iniezione. L'iniezione però è attaccata a una frase già sbagliata: prova debole. Test unitario con una variante lecita («doesn't work»)."},{"r":"A4.3","t":"Tool critico bloccato","e":"par","ev":"asyncio.timeout: 45 s generazione, 30 s grading (grade_timeout_s), 10 s per le chiamate MCP; test_generation_timeout verifica 504 e audit «timeout». Dopo la chiusura dell'esercizio un nuovo invio dà 409; su un esercizio aperto un doppio invio conta due tentativi. Retry solo sui rifiuti del verifier."},{"r":"A5.1","t":"README installa-e-lancia","e":"ok","ev":"README: cp .env.example .env, chiave in .env, docker compose up --build su localhost:8000; avvio senza Docker con uv sync e npm ci. Stima dalla lettura; da provare a freddo."},{"r":"A5.2","t":"Il progetto gira (bloccante)","e":"nv","ev":"Non l'ho avviato. Il README dichiara che gira (M9 su develop) e il workflow CI ha un health check."},{"r":"A5.3","t":"Classe di rischio AI Act e dati","e":"no","ev":"Nessuna pagina su fascia di rischio e dati nel repo (ricerca di AI Act, privacy, retention, GDPR senza risultati). Materiale pronto: grader senza tool, memoria a record unico, nessun canale verso l'esterno."},{"r":"A5.4","t":"3–5 regole AI Act con prova e stato","e":"no","ev":"Assente. Prove già presenti che potrebbe collegare: tabella audit, last_report.json, test sui guardrail."}],"qual":[{"d":"B1 Problema e scope","l":"2–3","ev":"Utente (italiano che studia inglese), compito (imparare scrivendo, con storia per argomento) e scope in FUNCTIONAL_ANALYSIS §1 con «Out of scope». Perché serve un agente e non esercizi statici: spiegato in parte (correzione di testo libero, memoria), senza dati."},{"d":"B2 Architettura e scelte","l":"2","ev":"Writer + verifier + grader + agente di memoria motivati e con verdetto in codice. Confronto con un agente solo annunciato ma non fatto."},{"d":"B3 Sicurezza e robustezza","l":"2","ev":"Il testo non fidato ora entra nel grader, con difese a più livelli (nessun tool, blocco dati con escape, risposta segnalata non valutata, verdetto in codice, controllo delle uscite). Mancano un red team documentato, una prova forte contro l'iniezione e il controllo del percorso grader → memoria → writer, oggi solo a regex."},{"d":"B4 Qualità della valutazione","l":"2–3","ev":"Quattro eval con un comando e porta in CI; grading con 8 etichette e un FAIL trovato e corretto (6/8 → 8/8, nei documenti). Mancano casi nuovi indipendenti, ripetizioni e la separazione tra casi fermati dal codice e dal modello."},{"d":"B5 Ingegneria e riproducibilità","l":"2–3","ev":"uv.lock con --frozen, Docker a due stadi non root, CI, .env.example, test; da clone pulito non provato. Alcune righe di README e AGENTS.md non allineate al codice."},{"d":"B6 Osservabilità e governance","l":"2","ev":"Da una traccia si ricostruiscono tool, argomenti, modello, token e guardrail. Manca la pagina su cosa si logga, per quanto tempo e il legame con l'AI Act; manca il modo di cancellare la memoria; non c'è un costo in dollari."},{"d":"B7 Presentazione e demo","l":"N/V","ev":"Si vede il 23.","tuo":"2"},{"d":"B8 Riflessione: apprendimenti e difficoltà","l":"N/V","ev":"Si vede il 23.","tuo":"2,5"}],"domande":[{"q":"Verification gap: apri tutor.decide e safe_grade e dimmi cosa succede se il grader risponde task_done e rule_correct veri, 0 errori importanti, per un testo che contiene un'iniezione. Quali parti del codice hai letto riga per riga e dove il coding agent ha sbagliato e lo hai corretto?","a":""},{"q":"Il testo dello studente ora entra in un prompt (il grader). Quali difese hai messo e quale attacco proveresti per aggirarle? Perché il caso subtle-injection dell'eval contiene già una frase sbagliata?","a":""},{"q":"Se togliessi la parte agentica (verifier, grader, memoria) cosa perderesti in concreto? Hai un numero, per esempio quanti esercizi del solo writer vengono respinti?","a":""},{"q":"Mostrami un FAIL del tuo eval: dov'è il 6/8 del grader, cosa hai cambiato e perché nel report attuale tutto è 8/8 e 13/13? Edge-article-ambiguity prima falliva: cosa è cambiato?","a":""},{"q":"AI Act: in che fascia ricade Enita, che corregge testi liberi e tiene una memoria sul livello dello studente? Quali tre regole citeresti e con quale prova?","a":""},{"q":"Quali dati escono verso OpenAI (testo dello studente, note, memoria, schede, embedding) e cosa resta sul tuo disco (attempts, topic_memory, audit)? Per quanto tempo, e come cancello la memoria?","a":""},{"q":"La memoria rispetta «ricorda solo ciò che serve»? Perché 4+4 punti e 3 frasi, e cosa succede se una nota del grader contiene un'istruzione che finisce nella memoria e poi nel writer?","a":""},{"q":"Perché 45, 30 e 10 secondi di timeout? Cosa vede l'utente dopo un 504, e cosa succede se invia due volte la stessa risposta (conta due tentativi?)?","a":""},{"q":"Le 8 risposte del grading eval le hai etichettate tu: due accettano due verdetti. Quanto ti fidi di un 8/8 con una sola esecuzione? Come lo confronteresti con etichette di un insegnante?","a":""},{"q":"I numeri «54 ms dal pool contro 5–15 s dal vivo» e «12 su 12 con gpt-4.1-mini» dove li hai misurati? Quanto costa e quanto ci mette una correzione del grader?","a":""},{"q":"Oltre a OpenAI quali provider hai provato davvero? Cosa potrebbe rompersi con Ollama o Anthropic (output strutturato, parametri obbligatori dei tool)?","a":""},{"q":"Se andasse in produzione domani, qual è la prima cosa che cambieresti? (porta 8000 aperta sulla rete, /api/audit senza autenticazione, conservazione di risposte e memoria)","a":""},{"q":"Come hai usato il coding agent?","a":"Claude Code, con design e reverse interaction, figo."}],"note":"Ha detto che vuole anche aggiungere modelli open, figo!\nBelle scelte e bel lavoro di design e di brainstorming, gran bel lavoro considerando che non avevi programmato in python :)","commento":"IL RISCHIO PIÙ GRANDE: il testo libero dello studente (non fidato) ora arriva a un LLM e le sue parole possono tornare, attraverso le note del grader e la memoria, fino al writer. Le difese sono buone (grader senza tool, blocco dati con escape, verdetto calcolato dal codice), ma l'unica prova contro l'iniezione è un caso dell'eval già sbagliato per conto suo e il percorso grader → memoria → writer è controllato solo con una regex. Il danno possibile è limitato (esercizi o memoria sbagliati, nessun tool né canale verso l'esterno), ma il progetto non lo dimostra e non lo documenta.\nPROSSIMO PASSO (≈2 ore): scrivi docs/AI_ACT.md di una pagina (fascia di rischio e motivo, cosa va a OpenAI incluso il testo dello studente, cosa resta in attempts, topic_memory e audit e per quanto tempo, 3 regole con prova e stato onesto) e chiudi A5.3 e A5.4, oggi i due requisiti assenti. Hai già le prove (tabella audit, last_report.json, test sui guardrail). Se ti avanza tempo, aggiungi 4–5 casi di iniezione nel grading eval con inglese sbagliato nella regola."}],"mail":{"reply":"mirkocalcaterra@datapizza.tech","tokens":{},"exportOpts":{"note":true,"verdetto":false}},"hideVerdicts":true}</script>
