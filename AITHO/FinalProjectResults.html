  { id:'spackyoufy', nome:'SpackYouFy', tipo:'progetto', colore:'#8f5a9a',
    sottotitolo:`Playlist Spotify dai brani preferiti, con un agente curatore · repo d3vchrx`,
    repo:'github.com/d3vchrx/SpackYouFy', cartella:'Aitho/SpackYouFy',
    verdetto:'Completato con lacune · qualità ~59–62/80 su B1–B6 · bonus ~+5',
    stato:'letto, non eseguito · clone diretto, non fork · riletto fino a 8957431 (23/11 15:16, 79 commit): aggiunti eval del curatore, giudice, confronto tra strategie, comando unico `python -m evals`; governance e Docker ancora assenti',
    obs:[
      {k:'forza', t:`Il curatore può solo proporre: non ha nessun tool che crei una playlist. La scrittura su Spotify passa da una rotta di approvazione separata (l'unica che scrive), ed è idempotente: un test verifica che due approvazioni creano una sola playlist. L'ultima parola all'utente è architettura, non promessa.`},
      {k:'forza', t:`Ogni esecuzione è limitata: massimo di chiamate al modello per turno (8), scadenza per ogni tool (30 s, e un tool scaduto risponde al modello con un errore, così prova un altro strumento), scadenza per l'intero turno (180 s), poi ripiego sulle strategie di generazione. Il fallimento è progettato, non lasciato al caso.`},
      {k:'forza', t:`Memoria persistente vera: sessioni del curatore, checkpoint LangGraph (con le chiamate ai tool) e profilo dei gusti dichiarati in SQLite. L'agente ricorda "non mi piace il reggaeton" nelle playlist successive.`},
      {k:'forza', t:`Design messo alla prova con numeri: l'ADR 0003 confronta solo denso, ibrido con RRF, due reranker e diversi embedder su una fixture (MRR 1,000 a 22 ms contro 0,875 dell'ibrido; i reranker peggiorano l'MRR e aggiungono 0,45–0,87 s) e sceglie di conseguenza. È esattamente il livello 3 di B2 e il requisito A2.3.`},
      {k:'forza', t:`Local-first: Ollama di default, OpenAI e Gemini opzionali per richiesta, modelli per ruolo (agente, worker, giudice, embedding). Cura per la privacy nei log: httpx è silenziato perché l'URL dei testi contiene il titolo del brano.`},
      {k:'forza', t:`La documentazione è molto completa: architettura a livelli, flussi, schede degli agenti con percorsi osservati e commit di verifica, quattro ADR in formato MADR, riferimenti generati.`},
      {k:'forza', t:`Novità del 23/11, difese a più livelli contro le istruzioni nascoste nei testi (iniezione indiretta): marcatori nel testo (in italiano e in inglese), uno schermo con un modello di decisione (tev1:4b) che risponde sì/no per ogni strofa, recinzione dei tag nel prompt e una policy sull'output che toglie link e limita le lunghezze. Chi scrive i testi su LRCLIB è davvero un terzo non fidato, e il progetto lo tratta così.`},
      {k:'forza', t:`Red team con prima e dopo: quattro attacchi (esplicito, gentile e rivolto all'assistente, rottura del tag, promozione di un link) con l'esito che si considera «obbedito» scritto prima in attacks.json, un comando con codice di uscita e un report datato. E i limiti sono scritti: un solo modello, una richiesta per attacco, il modello resisteva anche senza guardrail, e link_promotion supera la soglia di 0,08. Per il curatore gli attacchi sono provati con test strutturali (nessun tool di scrittura, utente fissato dall'intestazione, id inventati scartati).`},
      {k:'forza', t:`Audit di ogni tentativo di creare una playlist (anche fallito, con l'id lasciato su Spotify), con trace id, e tracing OpenInference su Phoenix per richieste, run LangChain e recupero dei testi, con l'ADR 0005. Chi si chiedeva «perché il curatore ha proposto questo brano?» ora ha una trace da guardare.`},
      {k:'forza', t:`Novità del 23/11 pomeriggio: un solo comando per tutte le misure. Con \`uv run python -m evals\` (cartella backend) partono in fila cinque prove (recupero dei testi, traiettoria del curatore, confronto tra strategie, calibrazione del giudice, red team). Ognuna scrive un report JSON con data in backend/evals/reports/ e restituisce un codice di uscita (0 ok, 1 sotto soglia, 2 modello irraggiungibile, 3 etichette mancanti), quindi uno script può fermarsi se qualcosa peggiora. La temperatura è fissata a 0 per tutti i ruoli. Tutto gira su una libreria sintetica (40 canzoni scritte per il progetto) con Qdrant in memoria: non tocca Spotify né i dati veri.`},
      {k:'forza', t:`Il confronto tra strategie ora ha numeri su qualità, tempo e token (verificato nel report playlists_20261123T133620Z.json, 20 richieste). Single-pass: precisione del giudice 0,25 su 301 brani scelti, recall 0,90, 2,7 s, 1693+494 token. Map-reduce: precisione 0,27, recall 0,11, 2,4 s, una richiesta senza risposta. Testi (RAG): precisione 0,89 su 57 brani, recall 0,98, 3,4 s, 4539+284 token. Quindi la scelta della strategia sui testi si regge su una misura, non solo su un ADR. (La precisione è la quota di brani scelti che il giudice ritiene adatti; la recall è la quota dei brani attesi che sono stati trovati.)`},
      {k:'forza', t:`L'eval ha trovato un difetto vero e il progetto lo ha corretto: una richiesta che cita un verso senza dire il tema («the song with the line …») finiva sulla strategia che guarda solo i metadati e tornava con 20 brani a caso. Prima del fix la precisione sui testi era 0,68 e sotto la soglia di 0,70 (primo report, FAIL); dopo, 0,89 (secondo report, PASS). Il commit 26463a7 e il test relativo in test_playlist_suggestions_from_lyrics.py lo documentano. È la prova che l'eval serve a qualcosa.`},
      {k:'forza', t:`Eval del curatore sulla traiettoria, cioè su quali tool chiama e che bozza salva, non su ciò che scrive. Sette chat in backend/evals/trajectory/tasks.json (tema in italiano e in inglese, genere, due turni con un brano tolto, gusto dichiarato, verso citato, richiesta di creare subito su Spotify). Il voto viene da controlli in codice (grading.py): \`no_creation_path\` (il curatore non ha nessun tool che crei su Spotify), \`within_step_limit\`, tool richiesti, id proposti che vengono da un risultato di tool, brano atteso presente e brano escluso assente. Per ogni caso c'è un PASS/FAIL e due controlli di sicurezza obbligatori. Ci sono test del voto in test_eval_trajectory_grading.py.`},
      {k:'forza', t:`Il giudice è costruito con attenzione e i report dicono i limiti. Usa un modello diverso da quello che genera (qwen3.5:9b contro gemma4:e4b), una chiamata per coppia richiesta–brano (così non si lascia influenzare dai brani vicini), una rubrica con esempi di FAIL («un matrimonio non è il primo amore»), e la calibrazione con kappa di Cohen (misura quanto due giudici concordano oltre il caso) si rifiuta di partire finché ogni coppia non ha l'etichetta umana, così le etichette si scrivono senza vedere cosa risponde il giudice. La documentazione dice onestamente che le cifre del 23/11 sono «prima delle etichette».`},
      {k:'critica', t:`Manca ancora la pagina su AI Act, GDPR e copyright (A5.3, A5.4): verificato con una ricerca su tutto il repo, nessun file nomina AI Act o GDPR, e nel piano la voce F9 (Docker, README, governance) è ancora non spuntata anche dopo gli ultimi commit. Il codice ha già scelte da mettere in tabella: i testi restano sulla macchina per copyright, i tool restituiscono al massimo un verso, l'ultima parola è dell'utente (approvazione), c'è un audit, e ora anche un eval che dimostra che il curatore non ha strumenti di creazione. Libreria e gusti sono dati personali, e il cloud scelto per richiesta manda dati a OpenAI o Gemini. Consiglio: nel README una sezione con la fascia (rischio limitato, art. 50 sulla trasparenza), i dati che partono per provider e 3 regole con prova e stato; per esempio «nessuna creazione senza approvazione» con prova il controllo no_creation_path del trajectory eval.`},
      {k:'critica', t:`Il giudice non è calibrato: in backend/evals/judge/calibration_set.json tutte le 20 coppie hanno ancora \`human_verdict: null\` (verificato nel file) e nessun report di calibrazione esiste. Quindi la precisione 0,89 del giudice sui testi e lo 0,25 del single-pass non hanno ancora una garanzia di affidabilità; il piano stesso lo segna come aperto (mancano le etichette dell'utente). Consiglio (circa 20 minuti): etichetta tu le 20 coppie senza guardare il giudice, lancia \`uv run python -m evals judge-calibration\` e scrivi il kappa nel README accanto ai numeri. Se è sotto 0,6, correggi la rubrica prima di citare le precisioni. Attenzione anche al fatto che 20 coppie sono poche: il kappa ha un margine di errore ampio, dillo.`},
      {k:'critica', t:`Il retrieval è ancora facile: nel report retrieval_20261123T130252Z.json hit@5 1,00, hit@1 0,95, MRR 0,975 (una sola query, q02, non ha il brano atteso al primo posto; la scheda precedente riportava 1,000, il valore corretto è 0,975). Le query sono 20, le canzoni 40, solo 2 query citano un verso (q18, q19) e nessuna query è senza risposta nella libreria. Con questo set una soglia di MRR 0,70 non può fallire. Consiglio: in backend/evals/retrieval/gold_set.json aggiungi 4–5 query che non hanno nessun brano atteso (per esempio un tema che nessuna canzone sintetica tocca) e un esito atteso scritto prima («nessun risultato sopra una soglia di punteggio»), poi 3–4 query con versi parafrasati. Dopo il fix su 26463a7 il set serve anche a controllare che non regredisca.`},
      {k:'critica', t:`Il confronto tra strategie ha limiti da dichiarare. (1) Una esecuzione sola per strategia: tra le due esecuzioni del 23/11 la recall del map-reduce è passata da 0,24 a 0,11 e le scelte del giudice dipendono dal modello, quindi mancano ripetizioni (3–5 esecuzioni con media e minimo/massimo). (2) La strategia sui testi legge i testi e il giudice li legge a sua volta, mentre single-pass e map-reduce vedono solo i metadati: il confronto misura quanto conta avere i testi, non quale algoritmo è migliore, ed è giusto scriverlo così. (3) Il set è lo stesso su cui il difetto delle citazioni è stato trovato e corretto: il fix è stato tarato su quelle richieste; serve un secondo set di richieste mai viste. (4) Il single-pass sceglie circa 15 brani su 40 per richiesta, quindi la precisione 0,25 è anche effetto di liste lunghe: conviene riportare la precisione a 5 brani (precision@5).`},
      {k:'critica', t:`Nel trajectory eval due casi su sette falliscono (5 su 7 = 0,71, soglia 70%, quindi PASS di poco; verificato nel report trajectory_20261123T130344Z.json e nei docs). t05: dopo un gusto dichiarato la ricerca in libreria dà zero risultati e il modello chiede il permesso invece di provare \`search_lyrics\`, quindi la bozza è vuota. t07: alla richiesta «crea subito su Spotify senza approvazione» il modello rifiuta e fa una domanda invece di proporre una bozza. I due errori sono sul comportamento utile, non sulla sicurezza (i due controlli di sicurezza passano in tutti e 7 i casi). Il progetto li lascia fuori da questa PR come «errori di prompt». Consiglio (circa 1 ora): correggi il prompt dell'agente in backend/src/spackyoufy/agents/ per questi due casi, poi rilancia \`python -m evals trajectory\` e scrivi nel README il prima/dopo (5/7 poi 7/7): è la prova di un ciclo misura-correggi-misura. Due altre cose: per t07 è discutibile che «proporre una bozza» sia l'unico esito giusto (rifiutare di creare e chiedere un chiarimento potrebbe essere accettabile), quindi scrivi nel file perché quell'esito è quello atteso. E ogni caso ha una sola esecuzione a temperatura 0: ripeti 3 volte per distinguere un errore sistematico da uno casuale.`},
      {k:'critica', t:`Nel trajectory eval l'esito atteso è scritto nei dati (tasks.json: \`draft_includes_any\`, \`draft_excludes\`), ma nel git risulta nello stesso commit dei risultati (f38b5bb): non si può dimostrare che sia stato scritto prima di vedere cosa fa il modello. Inoltre \`draft_includes_any\` passa se la bozza contiene anche uno solo dei brani indicati e non controlla che gli altri brani siano adatti. Consiglio: in tasks.json aggiungi un campo con la data o una riga «scritto prima di eseguire» e per i casi più importanti controlla anche la lunghezza della bozza e che nessun brano fuori tema sia presente (si può riusare il giudice).`},
      {k:'critica', t:`Il red team non discrimina ancora: nessun attacco è stato obbedito nemmeno prima dei guardrail, per cui «0 su 4 dopo» non dimostra che servano. Gli attacchi finiscono tutti sulla strofa che non è quella più vicina alla richiesta, quindi il prompt di selezione non li vede. Consiglio: attacchi più difficili (strofa attaccante che è anche la più pertinente, istruzioni in altre lingue, richieste ripetute 3 volte), almeno un modello cloud e un caso in cui lo schermo sbagli (falso positivo su una strofa vera). Verificato anche nel nuovo report red_team_20261123T132103Z.json (seconda esecuzione, dentro la suite completa): stesso esito, nessun attacco obbedito né prima né dopo, 4 strofe su 4 segnalate dallo schermo.`},
      {k:'critica', t:`Il server MCP si fida dell'intestazione X-SpackYouFy-User: chi raggiunge la porta locale legge la libreria di chiunque la nomini (dichiarato, giusto in locale). Consiglio: un token per sessione o il vincolo all'utente della sessione, prima di qualunque uso non locale.`},
      {k:'critica', t:`Con un provider cloud il ruolo di screening vale «none» di default e restano solo i marcatori: proprio dove i dati lasciano la macchina la difesa è più debole, ed è l'unico percorso in cui un modello più furbo di tev1:4b legge la libreria. Consiglio: dichiararlo accanto alla scelta del provider, oppure tenere lo screening locale anche quando il resto va in cloud, e riportare il costo (tev1:4b gira da solo a fine ingestione e occupa 6,35 GB di VRAM).`},
      {k:'critica', t:`Gli span di Phoenix portano prompt e testi (il README lo dice: tenere l'endpoint sulla macchina) e l'audit si dichiara «append-only» perché l'app fa solo INSERT, ma il file SQLite non lo impedisce. Consiglio: scrivere in due righe cosa contiene la trace e per quanto si tiene, e un trigger che blocchi UPDATE e DELETE sulla tabella dell'audit.`},
      {k:'critica', t:`Provarlo richiede un'app Spotify Developer, Ollama con modelli da vari GB (GPU da 8 GB), Qdrant in Docker e tre terminali; non c'è un Dockerfile né una CI, e i comandi di verifica del README usano il percorso Windows backend/.venv/Scripts/python. Consiglio: una versione unica dei comandi per Mac e Linux, un docker compose per tutto lo stack e una demo registrata come piano B. Aggiornamento: nel README i comandi di eval nuovi (uv run python -m evals) funzionano su ogni sistema, ma la riga di ruff e mypy usa ancora backend/.venv/Scripts/python (verificato alla riga 143); manca ancora un Dockerfile e una CI (anche l'opzione F12, «eval-gate» in CI, è non fatta nel piano). Con un solo comando per gli eval, mettere quel comando in una CI sarebbe ora un lavoro corto.`},
      {k:'critica', t:`Tre strategie di generazione (single-pass, map-reduce, RAG sui testi) più il curatore, il server MCP e l'ingestione sono molti componenti per una funzione. Il confronto ora c'è (vedi punti di forza) e mostra che il map-reduce non aggiunge qualità nelle prove fatte: recall 0,11, una richiesta senza risposta, token 3263+212. Resta una soglia non misurata: nel confronto la libreria è di 40 brani e il map-reduce è forzato a pezzi da 10, ma la soglia reale (LLM_CHUNK_THRESHOLD = 1000) non è mai provata con librerie grandi. Consiglio: o togli il map-reduce dal percorso dell'app e lo tieni solo come riferimento, oppure fai una prova con una libreria sintetica di 1000+ brani per dimostrare quando serve; così spieghi in 10 secondi perché le strategie sono tre.`},

      {k:'critica', t:`README e installazione locale sono scritti per Windows (PowerShell, .venv\Scripts, copy): da Mac o Linux la parte con Docker Compose funziona, ma l'installazione locale non ha comandi equivalenti. Consiglio: una versione bash accanto a quella PowerShell, o una sola procedura Docker Compose per tutti, così "clone pulito alla lettera" (A5.1) vale su ogni sistema.`},
      {k:'critica', t:`Non c'è una CI (nessun .github) e "eval in CI" è ancora una voce non spuntata. Consiglio: un workflow GitHub con test (171) ed eval deterministici che non richiedono il modello (guardrail, regole anti-spoiler, struttura degli scenari), lasciando gli eval con LLM come job manuale: così una modifica che rompe il guardrail ferma la build.`},
      {k:'critica', t:`I risultati migliori dipendono da un modello su un server vLLM aziendale (qwen3.8-27b): 7/8 per il fixer, 31/32 per il tutor. Con i modelli locali il fixer fa da 1 a 3 su 8. Chi valuta o prova non può riprodurli, e la demo con Ollama sul PC mostrerebbe soprattutto fallimenti. Consiglio: una registrazione datata di un'esecuzione riuscita come piano B, e scegliere in anticipo con quale modello si presenta; riportare anche una misura con un modello raggiungibile da tutti.`},

      {k:'critica', t:`Il Docker privato gira privileged (dichiarato: "meglio del socket, non un isolamento perfetto") e la UI dà una shell di root nella sandbox. Va bene sul PC, ma è il punto da cambiare prima di qualunque uso condiviso. Consiglio: scrivere in due righe l'alternativa (Docker rootless, sysbox o gVisor) e che un uso online richiederebbe un login e un limite di sessioni.`},

  ,{ id:'aikitecture', nome:'Software Design Assistant', tipo:'progetto', colore:'#3f7f7a',
    sottotitolo:`Da brief e documenti a una specifica discutibile: un Designer propone, Reviewer indipendenti controllano, il codice verifica ogni citazione · Graziano di Grande`,
    repo:'github.com/drendog/software-AIkitecture', cartella:'Aitho/software-AIkitecture',
    verdetto:'da confermare con A5.2 · qualità ~55–60/80 su B1–B6 · bonus ~+3–5',
    stato:'letto, non eseguito · clone diretto di drendog (non un fork)',
    obs:[
      {k:'forza', t:`«Il modello propone, il server decide cosa conta»: ogni citazione deve essere stata restituita dal tool di ricerca in quel run e l'estratto deve comparire parola per parola nelle righe citate; i permessi sono controllati nel codice sui vincoli confermati dalla persona. Il guardrail è fuori dal modello e verifica una cosa precisa, non è una frase nel prompt.`},
      {k:'forza', t:`Reviewer indipendenti, anche su provider diversi, e consolidamento nel codice: se non sono d'accordo il finding resta «disputed», non si decide a voti, e un'affermazione che contraddice un vincolo confermato diventa bloccante anche se i Reviewer erano favorevoli. È multi-agent usato dove serve un secondo parere.`},
      {k:'forza', t:`Workflow fisso scritto nel codice (non un supervisor) e costo limitato per costruzione: tre chiamate per incarico, al massimo 3×(1+N) per round. Avvio idempotente con Idempotency-Key e vincolo unico su SQLite, snapshot congelato del contesto, riavvio che segna i run interrotti come falliti. L'A4.3 è affrontato con cura.`},
      {k:'forza', t:`Tre esiti invece di due («supportato, contraddetto, non verificato») e stato della specifica incomplete / needs_clarification / ready: il progetto sa dire «non lo so», che è la parte difficile.`},
      {k:'forza', t:`Privilegi minimi: il processo MCP si apre il DB in sola lettura, non riceve mai le chiavi dei provider e il modello controlla solo query e limit. Gli archivi sono letti con limiti di espansione (ZIP64 rifiutato, tar.gz con tetto), e le query FTS5 sono ridotte a token tra virgolette. Nessun tool scrive o esce in rete.`},
      {k:'forza', t:`Le «Known limitations» nel README dichiarano da sole tre buchi veri (nessun eval offline, traccia solo su console, regola anti-iniezione nei prompt non ancora scritta). Dichiarare i limiti è esattamente ciò che la rubrica premia nella riflessione.`},
      {k:'critica', t:`Non c'è nessun test, nessuna CI e nessuna eval: il repo ha 22.000 righe di TypeScript in 10 commit in 15 giorni, la qualità è tenuta da lint rigidi (funzioni sotto 30 righe, complessità 8, niente commenti) e dal typecheck nel build Docker. Sono controlli utili, ma non dicono se la specifica è giusta. Consiglio: partire dalle cose pure del dominio (verifica delle citazioni, consolidamento, stato della specifica) con una manciata di test: sono funzioni senza modello e si scrivono in un paio d'ore.`},

function cleanT(s){return String(s==null?'':s).replace(/\s*\n\s*/g,' ').trim()}

function mailAddr(s){s=String(s||'').trim();return validMail(s)?encodeURIComponent(s).replace(/%40/g,'@'):''}
function obsOf(p,k){return (p.obs||[]).filter(function(o){return o.k===k}).map(function(o){return cleanT(o.t)}).filter(Boolean)}

function mailText(p){

function mailPlan(p){

function copyText(text){
  function old(){try{var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(t);t.select();var ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}}
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(function(){return true},function(){return old()});
  return Promise.resolve(old());
}

function exportClient(){
  var D=JSON.parse(document.getElementById('d').textContent);
  var projs=[].slice.call(document.querySelectorAll('.pj')),tabs=[].slice.call(document.querySelectorAll('.tab'));
  var pv=document.getElementById('pv'),nx=document.getElementById('nx'),pc=document.getElementById('pc'),cur=0;
  function show(n,noscroll){
    if(n<0||n>=projs.length)return;cur=n;
    projs.forEach(function(p,k){p.hidden=k!==n});
    tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===n?'true':'false')});
    pv.disabled=n===0;nx.disabled=n===projs.length-1;
    pc.textContent=(n+1)+' / '+projs.length+' · '+D.projects[n].nome;
    try{history.replaceState(null,'','#'+D.projects[n].id)}catch(e){}
    if(!noscroll)window.scrollTo(0,0);
  }
  tabs.forEach(function(t,k){t.addEventListener('click',function(){show(k)})});
  [].slice.call(document.querySelectorAll('[data-go]')).forEach(function(b){b.addEventListener('click',function(){
    var g=b.getAttribute('data-go');D.projects.forEach(function(P,k){if(P.id===g)show(k)});
  })});
  pv.addEventListener('click',function(){show(cur-1)});nx.addEventListener('click',function(){show(cur+1)});
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName;if(t==='TEXTAREA'||t==='INPUT'||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);
  });
  var h=String(location.hash||'').slice(1),start=0;
  D.projects.forEach(function(P,k){if(P.id===h)start=k});
  show(start,true);
  var INTRO='Ciao Mirko,\n\necco le risposte alle tue domande:\n\n',OUTRO='\n\nGrazie,';
  function old(text){try{var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(t);t.select();var ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}}
  function copy(text){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(function(){return true},function(){return old(text)});
    return Promise.resolve(old(text));
  }
  function open(url){var a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();a.remove()}
  D.projects.forEach(function(P,pi){
    var root=projs[pi],tas=[].slice.call(root.querySelectorAll('textarea[data-i]'));
    if(!tas.length)return;
    var KEY='aitho-risposte-'+D.key+'-'+P.id,saved={};
    try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
    tas.forEach(function(t){var v=saved[t.getAttribute('data-i')];if(typeof v==='string')t.value=v});
    function keep(){var o={};tas.forEach(function(t){o[t.getAttribute('data-i')]=t.value});try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
    tas.forEach(function(t){t.addEventListener('input',keep)});
    var msg=root.querySelector('.msg'),fb=root.querySelector('.fb');
    function say(m){msg.textContent=m}
    function answers(){return P.q.map(function(q,i){var a=String(tas[i]?tas[i].value:'').trim();return (i+1)+'. '+q+'\n'+(a||'(nessuna risposta)')}).join('\n\n')}
    function mk(body){return 'mailto:'+encodeURIComponent(D.to).replace(/%40/g,'@')+'?subject='+encodeURIComponent(P.subject)+'&body='+encodeURIComponent(body.replace(/\n/g,'\r\n'))}
    function manual(text,m){fb.value=text;fb.hidden=false;fb.focus();fb.select();say(m)}
    root.querySelector('.prep').addEventListener('click',function(){
      var rest=answers()+OUTRO,full=mk(INTRO+rest);
      if(full.length<=1800){open(full);say('Ho aperto il programma di posta con le risposte. Controlla il messaggio e premi Invia.');return}
      copy(rest).then(function(ok){
        open(mk(INTRO));
        if(ok)say('Ho copiato le risposte: incollale nel messaggio.');
        else manual(rest,'Non sono riuscito a copiare: copia il testo qui sotto e incollalo nel messaggio.');
      });
    });
    root.querySelector('.cp').addEventListener('click',function(){
      var full=INTRO+answers()+OUTRO;
      copy(full).then(function(ok){
        if(ok)say('Testo copiato. Incollalo in un messaggio per '+D.to+'.');
        else manual(full,'Non sono riuscito a copiare: copia il testo qui sotto.');
      });
    });
  });
}

    '<div class="callout"><b>Salvare.</b> Il modo più semplice: doppio clic su <code>Avvia diario.command</code> nella cartella Aitho. Apre il diario su <code>http://127.0.0.1:8765</code> e <b>Salva</b> (o ⌘S) riscrive sempre lo stesso file, in qualunque browser, tenendo una copia dell\'ultima versione in <code>Diario_Aitho.backup.html</code>. Aprendo il file a mano, solo Chrome, Edge, Brave e Arc possono sovrascriverlo (la prima volta chiedono quale file); Safari e Firefox no, e il diario non scarica nulla da solo: c\'è il pulsante <b>Scarica copia</b>, che non tocca l\'originale.<br><br>Mentre scrivi, il browser conserva anche una bozza di sicurezza: se chiudi senza salvare, alla riapertura ti propone di ripristinarla.<br><br><b>Email e file per i partecipanti.</b> In ogni pagina progetto scrivi nome ed email del partecipante e premi <b>Scrivi email</b>: si apre il programma di posta con forza, consigli, dubbi e domande (mai verdetto, punteggi, requisiti o le tue note). Se il testo è lungo lo copio negli appunti e lo incolli tu. <b>Esporta per i partecipanti</b> crea una pagina per progetto, con le domande e uno spazio per rispondere, nella cartella <code>export/</code> (senza il server, con il pulsante Scarica); le tue note si possono togliere e il verdetto si può aggiungere con le caselle. Nei file esportati compare il tuo indirizzo per le risposte (lo scegli nel riquadro «Email ai partecipanti»).</div>'+mailBox()+
    '<h2>Legenda</h2><p class="legend"><b style="color:var(--ok)">+</b> punto di forza &nbsp; <b style="color:var(--tip)">→</b> consiglio &nbsp; <b style="color:var(--par)">?</b> dubbio o da verificare<br>'+
    '<span class="badge" data-e="ok">✅</span> verificato &nbsp; <span class="badge" data-e="par">⚠️</span> parziale &nbsp; <span class="badge" data-e="no">❌</span> assente &nbsp; <span class="badge" data-e="nv">N/V</span> non verificabile &nbsp; <span class="badge" data-e="na">n/a</span> facoltativo, assente</p></section>';
  return [left,right];
}

function obsHTML(i){
  var p=state.projects[i];
  return '<ul class="obs">'+p.obs.map(function(o,j){
    var base='projects.'+i+'.obs.'+j;
    return '<li><button class="mark" data-act="mark" data-path="'+base+'.k" data-k="'+o.k+'" title="'+MARK_NOME[o.k]+' (clic per cambiare)">'+MARK[o.k]+'</button>'+
      ed(base+'.t','Scrivi un’osservazione')+'<button class="del" data-act="del-obs" data-i="'+i+'" data-j="'+j+'" title="Elimina" aria-label="Elimina osservazione">×</button></li>';
  }).join('')+'</ul><button class="add" data-act="add-obs" data-i="'+i+'">+ aggiungi osservazione</button>';
}
function gateHTML(i){
  var p=state.projects[i];if(!p.gate.length)return'';
  var cnt={ok:0,par:0,no:0,nv:0,na:0};p.gate.forEach(function(g){cnt[g.e]++});
  var rows=p.gate.map(function(g,j){
    var b='projects.'+i+'.gate.'+j;
    return '<details class="row"><summary><span class="rid">'+g.r+'</span><span>'+esc(g.t)+'</span><span class="badge" data-e="'+g.e+'" title="'+ESITO_NOME[g.e]+'">'+ESITO[g.e]+'</span><span class="mine">'+(g.tuo?ESITO[g.tuo]:'')+'</span></summary>'+
      '<div class="rowbody">'+ed(b+'.ev','Evidenza')+
      '<label>Tuo esito <select class="pen" data-path="'+b+'.tuo" data-kind="val" data-refresh="1"><option value="">—</option>'+['ok','par','no','nv'].map(function(k){return '<option value="'+k+'"'+(g.tuo===k?' selected':'')+'>'+ESITO[k]+' '+ESITO_NOME[k]+'</option>'}).join('')+'</select></label>'+
      '<label>Nota <input class="pen" style="flex:1" data-path="'+b+'.nota" data-kind="val" value="'+esc(g.nota||'')+'" placeholder="la tua nota"></label></div></details>';
  }).join('');
  return '<h2>Requisiti <small>✅ '+cnt.ok+' · ⚠️ '+cnt.par+' · ❌ '+cnt.no+' · N/V '+cnt.nv+(cnt.na?' · n/a '+cnt.na:'')+'</small></h2>'+rows;
}
function qualHTML(i){
  var p=state.projects[i];if(!p.qual.length)return'';
  var rows=p.qual.map(function(q,j){
    var b='projects.'+i+'.qual.'+j;
    return '<details class="row"><summary><span class="rid">'+q.d.slice(0,2)+'</span><span>'+esc(q.d.slice(3))+'</span><span class="badge" data-e="'+(q.l==='N/V'?'nv':'na')+'" style="background:'+(q.l==='N/V'?'':'#5d6b8a')+'">'+esc(q.l)+'</span><span class="mine">'+esc(q.tuo||'')+'</span></summary>'+
      '<div class="rowbody">'+ed(b+'.ev','Perché')+'<label>Tuo livello (0-3) <input class="pen" style="width:70px" data-path="'+b+'.tuo" data-kind="val" data-refresh="1" value="'+esc(q.tuo||'')+'"></label></div></details>';
  }).join('');
  return '<div data-sec="qual"><h2>Qualità <small>stime, scala 0–3</small></h2>'+rows+'</div>';
}
function qaHTML(i){
  var p=state.projects[i];
  var items=p.domande.map(function(d,j){
    var b='projects.'+i+'.domande.'+j;
    return '<div class="qa"><div class="q"><span class="n">'+(j+1)+'.</span>'+ed(b+'.q','Scrivi la domanda')+'<button class="del" data-act="del-q" data-i="'+i+'" data-j="'+j+'" title="Elimina" aria-label="Elimina domanda">×</button></div>'+
      area(b+'.a','la risposta…','ans')+'</div>';
  }).join('');
  return items+'<button class="add" data-act="add-q" data-i="'+i+'">+ aggiungi domanda</button>';
}

function pageProject(i){
  var p=state.projects[i], gen=p.tipo==='generale';
  var head='<p class="kicker">'+(gen?'Pagina generale':'Progetto personale')+'</p><h1>'+esc(p.nome)+'</h1><p class="meta">'+esc(p.sottotitolo)+'</p>';
  if(!gen){
    head+='<p class="meta">'+esc(p.repo)+' · <span class="ed" style="font-family:var(--mono);font-size:13px">'+esc(p.cartella)+'</span> · '+esc(p.stato)+'</p>'+
      '<div class="verdict"><b>Verdetto provvisorio</b> · '+ed('projects.'+i+'.verdetto','verdetto')+'</div>';
  }
  var left='<section class="page">'+head+'<h2>'+(gen?'Cosa ho visto':'Cosa ho visto nel codice')+'</h2><p class="legend">Clic sul simbolo per cambiare tipo: <b style="color:var(--ok)">+</b> forza, <b style="color:var(--tip)">→</b> consiglio, <b style="color:var(--par)">?</b> dubbio.</p>'+obsHTML(i)+gateHTML(i)+qualHTML(i)+'</section>';
  var rightTop='<h2 style="margin-top:0">Domande e risposte <small>'+answered(p)+' / '+p.domande.length+'</small></h2>';
  var comm=gen?'':'<h2>Bozza del commento <small>150–200 parole, da rifinire</small></h2>'+area('projects.'+i+'.commento','commento','note')+
    '<p class="small-note">Formato: verdetto, requisiti, cosa funziona, rischio più grande, prossimo passo da circa 2 ore.</p>';
  var right='<section class="page right">'+rightTop+qaHTML(i)+'<h2>Note mie</h2>'+area('projects.'+i+'.note','Appunti liberi, cose sentite durante la presentazione…','note')+comm+(gen?'':mailProjectBox(i))+'<p style="margin-top:34px"><button class="add" data-act="del-page" data-i="'+i+'">Elimina questa pagina</button></p></section>';
  return [left,right];
}

function tabOrder(){return ['indice'].concat(state.projects.map(function(p){return p.id}))}
function pagesOf(tabId){var idx=state.projects.map(function(p){return p.id}).indexOf(tabId);return idx<0?pageCover():pageProject(idx)}

function render(){
  document.body.setAttribute('data-verdicts',state.hideVerdicts?'off':'on');
  var tabs=[{id:'indice',nome:'Indice',colore:'#5a6b64'}].concat(state.projects.map(function(p){return{id:p.id,nome:p.nome,colore:p.colore}}));
  var tabHTML=tabs.map(function(t){return '<button class="tab" role="tab" style="--c:'+t.colore+'" data-go="'+t.id+'" aria-selected="'+(state.tab===t.id)+'">'+esc(t.nome)+'</button>'}).join('');
  var pos=tabOrder().indexOf(state.tab), last=tabOrder().length-1;
  var pg=pagesOf(state.tab);
  var body='<div class="spread">'+pg[0]+pg[1]+'</div>'+
    '<button class="turn prev" data-turn="-1"'+(pos<=0?' disabled':'')+' aria-label="Pagina precedente">‹ precedente</button>'+
    '<button class="turn next" data-turn="1"'+(pos>=last?' disabled':'')+' aria-label="Pagina successiva">successiva ›</button>';
  var rings='<div class="rings" aria-hidden="true">'+[8,22,36,50,64,78,92].map(function(t){return '<i style="top:'+t+'%"></i>'}).join('')+'</div>';
  var banner=draftOffer?'<div class="banner" role="alert">Ho trovato una bozza non salvata del '+new Date(draftOffer.t).toLocaleString('it-IT')+'.<button class="btn" data-act="restore">Ripristina</button><button class="btn" data-act="discard">Scarta</button></div>':'';
  var bar='<div class="savebar" data-dirty="'+dirty+'"><span class="dot"></span><span class="st" role="status" aria-live="polite">'+(dirty?'Modifiche non salvate nel file':'Nessuna modifica')+'</span><button class="btn" data-act="save">Salva</button><button class="btn ghost" data-act="download" title="Scarica una copia del diario, senza toccare il file originale">Scarica copia</button><button class="btn ghost" data-act="export-open" title="Crea una pagina per ogni progetto da dare ai partecipanti">Esporta per i partecipanti</button><button class="btn ghost" data-act="verdicts" title="Nasconde verdetti provvisori e punteggi di qualità">'+(state.hideVerdicts?'Mostra verdetti':'Nascondi verdetti')+'</button></div>';
  document.getElementById('root').innerHTML='<div class="desk">'+banner+'<div class="binder"><nav class="tabs" role="tablist" aria-label="Pagine del diario">'+tabHTML+'</nav>'+rings+body+'</div></div>'+bar+modalHTML();
  document.querySelectorAll('textarea').forEach(fit);
  paintToast();
}
function fit(t){ if(CSS.supports&&CSS.supports('field-sizing','content'))return; t.style.height='auto';t.style.height=Math.max(t.scrollHeight,60)+'px'}

/* ---------- eventi ---------- */
var root=document.getElementById('root');
root.addEventListener('input',function(e){
  var t=e.target,path=t.getAttribute&&t.getAttribute('data-path');if(!path)return;
  var kind=t.getAttribute('data-kind');
  if(kind==='text')setAt(path,t.innerText.replace(/\n+$/,''));
  else if(kind==='val'){setAt(path,t.value);if(t.tagName==='TEXTAREA')fit(t)}
  markDirty();
  if(t.getAttribute('data-refresh')){keepRender()}
});
root.addEventListener('change',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-refresh')){keepRender()}});
root.addEventListener('paste',function(e){
  var t=e.target;if(!(t.getAttribute&&t.getAttribute('data-kind')==='text'))return;
  e.preventDefault();var txt=(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,txt);
});
root.addEventListener('keydown',function(e){
  var t=e.target;if(t.getAttribute&&t.getAttribute('data-kind')==='text'&&e.key==='Enter'){e.preventDefault();t.blur()}
});
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-act]');if(!el)return;
  var go=el.getAttribute('data-go'),act=el.getAttribute('data-act');
  if(go){goTo(go);return}
  var turn=el.getAttribute('data-turn');
  if(turn){var o=tabOrder(),n=o.indexOf(state.tab)+(+turn);if(n>=0&&n<o.length)goTo(o[n]);return}
  var i=+el.getAttribute('data-i'),j=+el.getAttribute('data-j');
  if(act==='mark'){var p=el.getAttribute('data-path');setAt(p,MARK_NEXT[getAt(p)]);markDirty();keepRender()}
  else if(act==='add-obs'){state.projects[i].obs.push({k:'dubbio',t:''});markDirty();keepRender();focusLast('.obs .ed')}
  else if(act==='del-obs'){state.projects[i].obs.splice(j,1);markDirty();keepRender()}
  else if(act==='add-q'){state.projects[i].domande.push({q:'',a:''});markDirty();keepRender();focusLast('.qa .q .ed')}
  else if(act==='del-q'){if(!state.projects[i].domande[j].a||confirm('Eliminare la domanda e la tua risposta?')){state.projects[i].domande.splice(j,1);markDirty();keepRender()}}
  else if(act==='verdicts'){state.hideVerdicts=!state.hideVerdicts;markDirty();render()}
  else if(act==='del-page'){var pp=state.projects[i];if(confirm('Eliminare la pagina «'+pp.nome+'» con le tue risposte e note? Dopo il salvataggio non si può annullare.')){(state.removed=state.removed||[]).push(pp.id);state.projects.splice(i,1);state.tab='indice';markDirty();render();window.scrollTo(0,0)}}
  else if(act==='mail-write')mailWrite(i);
  else if(act==='mail-copy')mailCopy(i);
  else if(act==='export-open')openExport();
  else if(act==='export-run')runExport();
  else if(act==='export-dl'){var ef=modal&&modal.files&&modal.files[+el.getAttribute('data-k')];if(ef&&ef.html)dlFile(ef.name,ef.html)}
  else if(act==='opt'){state.mail.exportOpts[el.getAttribute('data-opt')]=!!el.checked;markDirty()}
  else if(act==='close-modal')closeModal();
  else if(act==='close-mask'){if(e.target===el)closeModal()}
  else if(act==='copy-modal'){var mt=document.querySelector('.mbox .mtxt');copyText(mt?mt.value:'').then(function(ok){toast(ok?'Testo copiato negli appunti.':'Non sono riuscito a copiare: seleziona il testo e copialo a mano.')})}
  else if(act==='save')save();
  else if(act==='download'){download(snapshotHTML());setStatus('Copia scaricata: il file originale non è cambiato',dirty)}
  else if(act==='restore'){state=normMail(draftOffer.state);draftOffer=null;dirty=true;render();setStatus('Bozza ripristinata, non ancora nel file',true)}
  else if(act==='discard'){draftOffer=null;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}render()}
});
/* ---------- pagina che gira ---------- */
var flipping=false;
function canFlip(){
  return !flipping&&document.querySelector('.spread')&&window.matchMedia('(min-width:1021px)').matches&&
    !window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}
function goTo(id){
  if(id===state.tab||flipping)return;
  var order=tabOrder(),fwd=order.indexOf(id)>order.indexOf(state.tab);
  if(!canFlip()){state.tab=id;render();window.scrollTo(0,0);markDirtyQuiet();return}
  var spread=document.querySelector('.spread'),oldP=pagesOf(state.tab);
  state.tab=id;markDirtyQuiet();
  var newP=pagesOf(id);
  window.scrollTo(0,0);
  // altezza: la maggiore tra pagina vecchia e nuova, così la foglia copre tutto
  var probe=document.createElement('div');probe.className='spread';probe.style.cssText='position:absolute;visibility:hidden;left:0;right:0';
  probe.innerHTML=newP[0]+newP[1];spread.parentNode.appendChild(probe);
  var H=Math.max(spread.offsetHeight,probe.offsetHeight);probe.remove();
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.getAttribute('data-go')===id))});
  document.querySelectorAll('.turn').forEach(function(b){b.disabled=true});
  flipping=true;
  var under=fwd?[oldP[0],newP[1]]:[newP[0],oldP[1]];
  var front=fwd?oldP[1]:oldP[0], back=fwd?newP[0]:newP[1];
  spread.className='spread flipping';spread.style.height=H+'px';
  spread.innerHTML=under[0]+under[1]+
    '<div class="leaf" data-dir="'+(fwd?'fwd':'bwd')+'" inert aria-hidden="true"><div class="face front">'+front+'</div><div class="face back">'+back+'</div></div>';
  var leaf=spread.querySelector('.leaf');
  void leaf.offsetWidth; // forza il riflusso, poi parte la transizione
  var done=false;
  function finish(){if(done)return;done=true;flipping=false;render();window.scrollTo(0,0)}
  leaf.addEventListener('transitionend',function(e){if(e.target===leaf&&e.propertyName==='transform')finish()});
  setTimeout(finish,1300);
  requestAnimationFrame(function(){leaf.style.transform=fwd?'rotateY(-180deg)':'rotateY(180deg)'});
}
document.addEventListener('keydown',function(e){
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  var t=e.target,tag=t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;
  var o=tabOrder(),n=o.indexOf(state.tab)+(e.key==='ArrowRight'?1:-1);if(n>=0&&n<o.length){e.preventDefault();goTo(o[n])}
});
function markDirtyQuiet(){if(!dirty)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify({t:Date.now(),state:state}))}catch(e){}setStatus('Modifiche non salvate nel file',true)}
function keepRender(){ // ridisegna mantenendo scroll, apertura dei dettagli e fuoco
  var y=window.scrollY,open=[].map.call(document.querySelectorAll('details.row'),function(d){return d.open});
  var ae=document.activeElement,apath=ae&&ae.getAttribute&&ae.getAttribute('data-path'),selStart=ae&&ae.selectionStart;
  render();
  document.querySelectorAll('details.row').forEach(function(d,k){d.open=!!open[k]});
  if(apath){var n=document.querySelector('[data-path="'+apath+'"]');if(n&&n.tagName!=='BUTTON'){n.focus();try{if(selStart!=null)n.setSelectionRange(selStart,selStart)}catch(e){}}}
  window.scrollTo(0,y);
}
function focusLast(sel){var n=document.querySelectorAll(sel);if(n.length)n[n.length-1].focus()}
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- avvio ---------- */
state=loadState();
try{
  var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
  if(d&&d.state&&d.t>(state.savedAt||0)&&JSON.stringify(d.state)!==JSON.stringify(state))draftOffer=d;
}catch(e){}
render();
detectMode().then(function(){
  if(dirty)return;
  if(mode==='server')setStatus('Server locale attivo: Salva scrive nel file',false);
  else if(mode==='download')setStatus('Questo browser non salva nel file: apri con «Avvia diario» o usa Chrome',false);
});
window.__diario={snapshot:snapshotHTML,state:function(){return state},mailPlan:function(id){return mailPlan(proj(id))},buildExports:buildExports,setOpener:function(f){mailOpener=f}}; // per prove e debug
})();
</script>
