    const RANK_PROMPT = "# Prompt per Agent: Scraping di ranking non-tabellari (IMD & INRIX)\\n\\n**Ruolo e obiettivo**\\nSei un agente tecnico autonomo. Il tuo obiettivo è:\\n1. Raccogliere tutte le informazioni tabellari e semi-strutturate disponibili pubblicamente su ranking/list di città da:\\n   - https://www.imd.org/smart-city-observatory/home/rankings/\\n   - https://inrix.com/scorecard/\\n2. Esportare un file Excel con **1 foglio per sorgente** (nomi fogli a tua scelta), **senza fissare le colonne**: includi **tutti** i campi che trovi, preservando i nomi originali dove possibile.\\n3. Garantire **accuratezza ≥99%** tramite controlli qualità, logging e riconciliazioni.\\n4. Rispettare i ToS (Termini di Servizio) dei siti, limitare il ritmo richieste, e salvare **provenienza** per ogni record.\\n\\n---\\n\\n## Vincoli e principi\\n- Nessun hard-coding dello schema: fai **schema-on-ingest** e **schema-on-export** (tutte le colonne che emergono).\\n- Preferisci **fonti ufficiali scaricabili** (es. media pack, report, CSV/XLSX) rispetto al parsing del DOM.\\n- Se una vista web è popolata via richieste XHR/JSON, **intercetta gli endpoint** e usa i payload originali.\\n- Esegui **retry** (backoff esponenziale) su errori temporanei; rispetta **rate-limit** (≈1–2 req/s).\\n- Normalizza solo dove inevitabile (es. rimozione simboli valuta, parsing numeri); **non rinominare** i campi originali se non serve.\\n- Aggiungi **minime colonne di servizio**: `source_name`, `source_url`, `extracted_at`, e un `record_id` stabile (hash dei campi chiave).\\n- Tutto il codice/attività deve poter essere rilanciato in modo idempotente.\\n\\n---\\n\\n## Playbook per IMD Smart City Index\\n1. Naviga alla pagina e cerca link a **media pack** o file strutturati (ZIP/XLSX/CSV).\\n2. Se trovi file ufficiali: scaricali, estrai e leggi tutte le tabelle.\\n3. Se non esistono file: analizza il DOM e cattura le liste/ranking presenti.\\n4. Unisci tutte le tabelle in un DataFrame dinamico (merge outer).\\n5. Aggiungi colonne di servizio.\\n6. **Quality check:**\\n   - conteggio città ≈ valore indicato dall'edizione ufficiale\\n   - continuità del `rank`\\n   - campionamento casuale 20 righe confrontato con la fonte. Controlla così che il lavoro sia coerente con quanto richiesto.\\n7. Salva in un foglio Excel dedicato.\\n\\n---\\n\\n## Playbook per INRIX Scorecard\\n1. Naviga alla pagina, accetta cookie funzionali, raggiungi la **City Ranking List**.\\n2. Avvia cattura di rete per individuare endpoint JSON/XHR; scarica e salva tutti i payload.\\n3. Se non c'è endpoint: fai parsing del DOM con scroll fino a completamento.\\n4. Se necessario, scarica il report PDF tramite form ed estrai le tabelle.\\n5. Unisci tutti i blocchi in un DataFrame dinamico (merge outer).\\n6. Aggiungi colonne di servizio.\\n7. **Quality check:**\\n   - numero città ≈ dichiarato (900+ in 37 paesi)\\n   - coerenza `rank` e plausibilità dei valori numerici\\n   - campione casuale 20 righe verificato con la fonte. Controlla così che il lavoro sia coerente con quanto richiesto.\\n8. Salva in un foglio Excel dedicato.\\n\\n---\\n\\n## Esportazione e logging\\n- Crea cartella `artifacts/` con:\\n  - `raw/` (file scaricati, JSON/XHR, PDF, HTML)\\n  - `qa/` (report di qualità)\\n  - `logs/` (log esecuzione)\\n- Genera `artifacts/output.xlsx` con due fogli, uno per ciascuna fonte.\\n- Mantieni i nomi originali dei campi.\\n- Stampa a video un résumé con conteggi record, elenco colonne, % di nulli e risultato QA.\\n\\n---\\n\\n## Strategie per arrivare al 99%\\n- Usa sempre i payload originali se disponibili (ZIP, JSON, XLSX).\\n- In caso di fonti multiple, definisci priorità: JSON > CSV/XLSX > HTML > PDF OCR.\\n- Deduplica record su (città, anno, rank).\\n- Confronta copertura con i numeri attesi dall'edizione ufficiale.\\n- Logga ogni trasformazione e conserva i file raw.\\n\\n---\\n\\n## Criteri di \"done\"\\n- File `output.xlsx` con due fogli completi.\\n- QA report con mismatch ≤1%.\\n- Tutti i payload originali salvati in `raw/`.";

    const AZIENDE_PROMPT = "# Agent: Batch \\\"numero dipendenti\\\" da elenco aziende (senza API)\\n\\n## Obiettivo\\nDato un file Excel/CSV a **una colonna** con i nomi delle aziende (es. colonna \\\"Nome azienda\\\"), recupera in modo automatizzato il **numero di dipendenti/addetti** dalle pagine pubbliche di *ufficiocamerale.it* (o fonti camerali equivalenti quando disponibili), producendo un output cumulativo con tracciabilità e qualità controllata.\\n\\n## Vincoli e principi\\n- Nessun accesso API; usa solo contenuti pubblici e rispetta ToS/robots.\\n- Architettura **Controller + Workers** con **stato persistente** e **resume**.\\n- **Rate limit adattivo** (≈1–2 richieste/sec a dominio) + backoff esponenziale su 429/5xx.\\n- **Idempotenza**: niente duplicati, checkpoint frequenti, chiave per record stabile.\\n- **Qualità**: per ogni risultato salva `source_url`, `extracted_at`, e un `confidence_score` (0–1).\\n- **Etica**: non superare protezioni, non aggirare CAPTCHA: marca `needs_manual`. Piuttosto fermati e chiedi all'utente di continuare in quel caso\\n\\n## Input\\n- `input.xlsx` o `input.csv` contenente una sola colonna con i nomi (accetta intestazioni: \\\"Nome\\\", \\\"Nome azienda\\\", \\\"ragione sociale\\\").\\n- Parametri di run (con default):\\n  - `shard_size=100`, `max_workers=6`, `retries=3`, `rps_target=1.5`.\\n\\nLo `shard_size` rappresenta la dimensione del blocco di aziende che l'Agent prende in carico in un singolo lotto di lavoro.\\n## Normalizzazione nomi\\n- Uppercase/trim; rimuovi doppi spazi; normalizza forme giuridiche (S.R.L., SRL, SOCIETA' A R.L. → \\\"SRL\\\"; S.P.A. → \\\"SPA\\\"; ecc.).\\n- Genera varianti di query: con/ senza punteggiatura, con/ senza forma giuridica, con virgolette.\\n- Se disponibile, aggiungi il comune/provincia dal nome (tra parentesi) per restringere.\\n\\n## Ricerca & matching\\n- Strategia primaria: query mirata sul motore interno/scheda pubblica di *ufficiocamerale.it*. In alternativa, usa un motore generale con `site:ufficiocamerale.it \\\"ragione sociale\\\"` e apri il primo risultato coerente.\\n- Su elenco risultati: calcola **fuzzy score** (Levenshtein/Jaro-Winkler) tra input normalizzato e denominazione trovata; seleziona il top match se `score ≥ 0.90`. Se 0.80–0.89, marca `low_confidence` e prosegui; <0.80 → `no_match`.\\n- Apri la scheda azienda più promettente.\\n\\n## Estrazione campi\\n- Cerca pattern testuali/DOM relativi a: **\\\"Addetti\\\", \\\"Numero addetti\\\", \\\"Dipendenti\\\", \\\"Unità locali\\\"** e, se presente, l'anno di riferimento (es. 2023/2024).\\n- Preferisci valori **puntuali**; se solo **range** (es. \\\"1–5\\\"), estrai range e calcola un valore centrale ausiliario (solo per metriche): mantieni comunque il **testo originale**.\\n- Estrai eventuali metadati utili: **partita IVA/codice fiscale**, **comune/provincia**, **ATECO**, **stato impresa**.\\n- Salva snapshot raw (HTML/JSON) minimale della sezione da cui proviene il numero.\\n\\n## Persistenza & stato\\n- File di stato `state.jsonl` per ogni azienda: `{id, name_raw, status: pending|in_progress|done|failed|needs_manual, attempts, last_error, last_update}`.\\n- Checkpoint risultati ogni 20 record in `results.parquet` (append idempotente).\\n- Alla ripartenza, processa solo `pending` e `in_progress` scaduti.\\n\\n## Gestione errori\\n- Classifica errori: `transient` (timeout, 5xx), `permanent` (404, pagina incompatibile), `gated` (CAPTCHA/login).\\n- Retry automatico fino a 3 su `transient` con backoff; `gated` → `needs_manual`.\\n\\n## Output\\n- `artifacts/output.xlsx` e `results.parquet` con schema **dinamico**; includi almeno:\\n  - `input_name`, `matched_name`, `employees_value` (numero o `null`), `employees_text` (originale), `year_ref` (se trovato),\\n  - `confidence_score`, `status`, `notes`,\\n  - `source_url`, `extracted_at`, `record_id` (hash stabile di [input_name_normalized, matched_name, source_url]).\\n- `needs_manual.csv` con righe non risolte o a bassa confidenza.\\n- `run_metrics.json` con: copertura %, errori per tipo, median/95p latenza, retry medi.\\n- `logs/session.log` e `raw/` con i frammenti HTML salvati.\\n\\n## Criteri di qualità\\n- **Target**: ≥95% aziende con un valore (`employees_value` o `employees_text`), di cui ≥85% con `confidence_score ≥ 0.90`.\\n- Coerenza: se sulla stessa scheda appaiono più valori/anni, scegli il **più recente**; conserva gli altri in colonne \\\"_alt\\\".\\n- Campionamento: verifica manuale a campione (50 righe) confrontando valore e anno.\\n\\n## Passi operativi (Controller/Workers)\\n1. Carica `input.xlsx/csv`, normalizza nomi, genera `queue.jsonl`.\\n2. Suddividi in shard da `shard_size`, avvia fino a `max_workers` con `rps_target`.\\n3. Per ogni azienda:\\n   - Cerca → seleziona match → apri scheda → estrai campi → salva risultato → aggiorna stato.\\n4. Adatta dinamicamente il rate limit su HTTP 429/5xx; se l'errore rate > X%, riduci concurrency e attendi 60–120s.\\n5. Al termine: merge risultati, export Excel, report metriche, elenco `needs_manual`.\\n6. Stampa un **résumé**: record totali, % copertura, % alta confidenza, top 10 errori, tempo totale.\\n\\n## Done\\nProduci `artifacts/output.xlsx`, `needs_manual.csv`, `run_metrics.json`, `state.jsonl`, `logs/`, `raw/`. Fine.";

    const STARTUP_PROMPT = "# Agent: Dataset \\\"startup → tag → regione\\\" (UI paginata o infinite scroll)\\n\\n## Obiettivo\\nCostruisci un dataset completo di startup con campi almeno: `name`, `tags` (lista), `region`, `source_url`. Non fissare lo schema: cattura tutti i campi disponibili e aggiungi `extracted_at` e `record_id`.\\n\\n## Regole\\n- Rispetta ToS/robots. Non aggirare protezioni o paywall.\\n- Preferisci dati **JSON/API** alla UI: intercetta le richieste di rete della pagina (XHR/GraphQL/REST). Se trovi endpoint paginati, usa quelli.\\n- Se non esiste API: gestisci **infinite scroll** con loop di scroll + attesa rete e **sentinella** (stop quando il numero di card non cresce per N cicli). Se c'è paginazione, segui \\\"Next\\\"/`?page=N`.\\n- Usa **rate limit adattivo**: aumenta/riduci la concorrenza in base alla latenza/429.\\n- Salva sempre i **payload raw** (JSON o HTML della sezione) per audit.\\n\\n## Workflow\\n1) **Discovery**\\n   - Apri la pagina lista e avvia la cattura rete.\\n   - Se vedi endpoint XHR/GraphQL: identifica parametri (page/size/filter). Se GraphQL e consentito, usa introspection per conoscere campi/typenames.\\n   - In parallelo, prova a individuare **Sitemap** o URL con pattern di paginazione.\\n\\n2) **Estrazione**\\n   - **Percorso A (API/XHR)**: itera le pagine finché la risposta è vuota; salva i payload; costruisci record `name/tags/region/source_url`.\\n   - **Percorso B (Infinite scroll)**: esegui scroll progressivo, dopo ogni scroll attendi caricamenti; confronta il numero di elementi; quando stabile per N cicli, estrai tutte le card.\\n   - **Percorso C (Paginazione)**: clicca \\\"Next\\\" o incrementa `page=N` finché non trovi più risultati.\\n\\n3) **Parsing dinamico**\\n   - Mappa solo alla fine su `name`, `tags[]`, `region`, mantenendo **tutti** i campi extra.\\n   - Pulisci `tags` (split su virgole/chips); normalizza `region` se presente; se mancante, prova a inferirla da breadcrumb/URL.\\n\\n4) **Dedup & Qualità**\\n   - Deduplica per `(name_normalized, region)`; unisci i `tags` in un'unica lista.\\n   - Campiona 30 righe: apri `source_url` e verifica i valori.\\n   - Esporta `output.xlsx` (1 foglio) + `raw/` (payload) + `qa_report.json` (copertura, errori, esempi).\\n\\n## Done\\n- `output.xlsx` con tutte le righe; zero duplicati chiave; audit trail disponibile.";

    const BEST_PRACTICES_MD_TEXT = "# Best Practices per lo Scraping con Infinite Scroll e Paginazione\\n\\n## 1. Principi generali\\n- **Rispetta i ToS e robots.txt**: accedi solo a contenuti consentiti, senza aggirare protezioni o paywall.\\n- **Preferisci sempre i dati strutturati**: JSON, API REST, GraphQL o CSV/XLSX ufficiali sono più affidabili dell'HTML.\\n- **Salva i payload raw**: conserva gli oggetti JSON, le risposte HTML o i file originali per audit e verifica successiva.\\n- **Schema dinamico**: non fissare le colonne a priori; estrai tutto e normalizza in una fase finale.\\n\\n---\\n\\n## 2. Infinite Scroll\\n- **Cattura le richieste di rete**: spesso i dati arrivano da chiamate XHR/JSON mentre scorri.  \\n  - Se individui un endpoint paginato, usa direttamente quello.\\n- **Scrolling simulato**: se non c'è endpoint visibile:\\n  - esegui scroll incrementali fino in fondo,\\n  - attendi caricamenti (`networkidle` o `waitForResponse`),\\n  - confronta il numero di elementi caricati.\\n- **Sentinella di fine**: interrompi quando il numero di elementi rimane invariato per N cicli consecutivi.\\n\\n---\\n\\n## 3. Paginazione classica\\n- **Pattern comuni**:  \\n  - URL con `?page=N` o `&offset=`  \\n  - link \\\"Next/Previous\\\" nel DOM  \\n  - pulsanti \\\"Load More\\\" che richiamano endpoint.\\n- **Strategia**: \\n  - incrementa l'indice fino a quando la pagina restituisce 0 risultati,\\n  - cattura e unisci i dataset pagina per pagina.\\n- **Fallback**: cerca eventuali sitemap XML che elencano direttamente tutte le pagine.\\n\\n---\\n\\n## 4. Gestione delle performance\\n- **Sharding**: suddividi la lista di URL/record in blocchi (`shard_size`) per avere checkpoint frequenti e ripresa in caso di errore.\\n- **Rate limiting adattivo**: inizia con 1–2 richieste/secondo, riduci se ricevi 429/timeout.  \\n- **Backoff esponenziale**: attendi 2s → 5s → 15s in caso di errori temporanei.\\n- **Concorrenza controllata**: usa più worker solo se il sito regge; meglio 2–4 che 20.\\n\\n---\\n\\n## 5. Normalizzazione e deduplica\\n- **Deduplica** sui campi chiave (es. nome + regione).\\n- **Unisci i tag** se un'entità appare più volte con metadati diversi.\\n- **Conserva sia il campo \\\"pulito\\\" che il testo originale** (es. range \\\"1–5 addetti\\\" + numero centrale calcolato).\\n\\n---\\n\\n## 6. Qualità e validazione\\n- **Campionamento manuale**: apri un set casuale di record e verifica che i dati corrispondano.\\n- **Confronto con valori attesi**: controlla il numero totale di record o la continuità dei rank.\\n- **Log e report**: genera file `qa_report.json` con conteggi, percentuali di nulli e errori.\\n\\n---\\n\\n## 7. Audit e trasparenza\\n- Ogni record deve avere:\\n  - `source_url`\\n  - `extracted_at` (timestamp)\\n  - `record_id` (hash stabile)\\n- Conserva i file raw per eventuali controlli o rielaborazioni.\\n- Documenta eventuali limiti (es. campi mancanti, pagine bloccate).\\n\\n---\\n\\n## 8. Checklist rapida\\n- [ ] Identificare se esiste un **endpoint strutturato**.  \\n- [ ] Definire la strategia: **API/XHR**, **scroll**, o **paginazione classica**.  \\n- [ ] Impostare rate limit e retry.  \\n- [ ] Estrarre e salvare i payload raw.  \\n- [ ] Deduplicare e unire i dati.  \\n- [ ] Validare con campionamento e controlli numerici.  \\n- [ ] Esportare in Excel/CSV con audit trail.\\n\\n---";

    const TABS = [
      {
        id: 'rank',
        short: 'Ranking',
        title: 'Scraping di ranking non‑tabellari',
        blurb: 'IMD Smart City Index e INRIX Scorecard con schema dinamico, QA ≥99% e log completo.',
        advice: [
          'Schema-on-ingest: includi tutte le colonne e `source_name/source_url/extracted_at/record_id`.',
          'Scarica media pack o payload XHR/JSON ufficiali prima di toccare il DOM.',
          'IMD: unisci le tabelle, controlla continuità del rank e campiona 20 righe.',
          'INRIX: intercetta endpoint (o PDF) e verifica copertura (900+ città, 37 paesi).',
        ],
        filename: '01_ranking.md',
        prompt: RANK_PROMPT,
      },
      {
        id: 'brief', short: 'Rassegna', title: 'Rassegna stampa automatizzata (quotidiana)',
        blurb: "Briefing alle 09:00 nel chatbot, in italiano, con citazione della fonte per ogni notizia e sezione 'Fonti consultate'.",
        advice: [
          "Copri fonti must‑have + affini; ordina per rilevanza per l'industria italiana.",
          'Formato: bullet concise (1–2 righe) + link; opzionale Top 3 del giorno.',
          'Trasparenza: chiudi con elenco completo delle fonti consultate.',
        ],
        filename: '02_rassegna.md',
        prompt: `Search for the latest economic, industrial, and business news and official data releases from Italian and international authoritative sources (e.g., Istat, Ocse/OECD, IMF, European Commission, Banca d'Italia, Il Sole 24 Ore, Ambrosetti, Financial Times, The Economist, La Voce, and other relevant sources). Write the briefing in Italian. Cite every individual story with its source and link. Add a final section "Fonti consultate" listing all sources you checked (even those not used). Prioritize items relevant to Italian industry and policy, and include global developments with impact on Italy. Present concise bullets with 1–2 lines of context/insight for each item.`,
      },
      {
        id: 'batch', short: 'Aziende', title: 'Batch aziende camerali (~2000)',
        blurb: 'Automatizza il dato “numero addetti” da ufficiocamerale.it con controller/workers resilienti.',
        advice: [
          'Controller + workers con state.jsonl, shard da 100 e resume sicuro.',
          'Rate limit adattivo (≈1–2 req/s) con backoff su 429/5xx; concurrency 3–6.',
          'Normalizza ragione sociale, fuzzy score ≥0.90, salva confidence_score e source_url.',
          'Export completo: output.xlsx, results.parquet, needs_manual.csv, run_metrics.json, logs/, raw/.',
        ],
        filename: '03_aziende_camerali.md',
        prompt: AZIENDE_PROMPT,
      },
      {
        id: 'startup', short: 'Startup', title: 'Startup → tag → regione (scroll/paginazione)',
        blurb: 'Lista startup completa con tag e regione gestendo API, infinite scroll o paginazione.',
        advice: [
          'Fase discovery: intercetta XHR/GraphQL o sitemap prima di analizzare il DOM.',
          'Scroll infinito: loop di scroll + attesa rete con sentinella quando gli elementi si fermano.',
          'Paginazione: Next oppure `?page=N` finché le risposte sono vuote, salvando tutti i payload raw.',
          'Dedup `(name_normalized, region)`, unisci i tag e valida 30 righe aprendo la source URL.',
        ],
        filename: '04_startup_scroll_paginazione.md',
        prompt: STARTUP_PROMPT,
      },
      {
        id: 'best', short: 'Best', title: 'Best Practices (riassunto)',
        blurb: 'Linee guida trasversali per scroll, paginazione, qualità, dedup, audit e rispetto dei ToS.',
        advice: [
          'Endpoint prima del DOM: JSON/API batte HTML.',
          'Sharding + checkpoint per resilienza e resume.',
          'Rate‑limit adattivo, backoff e concorrenza prudente.',
          'Ogni record deve avere source_url, extracted_at, record_id.',
        ],
        filename: '00_best_practices.md',
        prompt: BEST_PRACTICES_MD_TEXT,
      },
    ];

    // ---- UI state ----------------------------------------------------------
    const tabsEl = document.getElementById('tabs');
    const titleEl = document.getElementById('tabTitle');
    const blurbEl = document.getElementById('tabBlurb');
    const adviceEl = document.getElementById('adviceList');
    const promptEl = document.getElementById('promptArea');
    const copyBtn = document.getElementById('copyBtn');
    const dlBtn = document.getElementById('downloadBtn');
    const dlAllBtn = document.getElementById('downloadAll');
    const toggleDark = document.getElementById('toggleDark');
    const root = document.documentElement;

    let activeId = TABS[0].id;

    function renderTabs() {
      tabsEl.innerHTML = '';
      TABS.forEach(t => {
        const btn = document.createElement('button');
        btn.textContent = t.short;
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', activeId === t.id ? 'true' : 'false');
        btn.tabIndex = activeId === t.id ? 0 : -1;
        btn.type = 'button';
        btn.className = `tab-button${activeId === t.id ? ' is-active' : ''}`;
        btn.addEventListener('click', () => { activeId = t.id; render(); });
        tabsEl.appendChild(btn);
      });
    }

    function renderContent() {
      const t = TABS.find(x => x.id === activeId);
      titleEl.textContent = t.title;
      blurbEl.textContent = t.blurb;
      adviceEl.innerHTML = '';
      t.advice.forEach(a => {
        const li = document.createElement('li');
        li.textContent = a;
        adviceEl.appendChild(li);
      });
      promptEl.value = t.prompt.replace(/\\n/g, '\n');
      dlBtn.onclick = () => downloadText(t.prompt.replace(/\\n/g, '\n'), t.filename || `${t.id}.md`);
      copyBtn.onclick = async () => {
        try { await navigator.clipboard.writeText(t.prompt.replace(/\\n/g, '\n')); copyBtn.textContent = 'Copiato ✓'; setTimeout(() => copyBtn.textContent = 'Copia prompt', 1500); } catch {}
      };
    }

    function render() {
      renderTabs();
      renderContent();
    }

    function downloadText(text, filename) {
      const blob = new Blob([text.replace(/\\n/g, '\n')], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    // ---- ZIP (store only) --------------------------------------------------
    function crc32Buf(buf) {
      let c = ~0;
      for (let i = 0; i < buf.length; i++) { c ^= buf[i]; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1)); }
      return ~c >>> 0;
    }
    function strToUint8(s) { return new TextEncoder().encode(s); }
    function fileTimeDate(d = new Date()) {
      const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2));
      const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      return { time, date };
    }
    function makeZip(files) {
      const localParts = [], centralParts = []; let offset = 0;
      const { time, date } = fileTimeDate();
      files.forEach(({ name, data }) => {
        const crc = crc32Buf(data), size = data.length, nameBytes = strToUint8(name);
        const local = new Uint8Array(30 + nameBytes.length + size);
        const dv = new DataView(local.buffer);
        dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
        dv.setUint16(10, time, true); dv.setUint16(12, date, true);
        dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
        dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
        local.set(nameBytes, 30); local.set(data, 30 + nameBytes.length); localParts.push(local);
        const central = new Uint8Array(46 + nameBytes.length); const cv = new DataView(central.buffer);
        cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
        cv.setUint16(12, time, true); cv.setUint16(14, date, true); cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
        cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true); cv.setUint32(42, offset, true); central.set(nameBytes, 46); centralParts.push(central);
        offset += local.length;
      });
      const centralSize = centralParts.reduce((n, p) => n + p.length, 0); const centralOffset = offset; const end = new Uint8Array(22); const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true); ev.setUint16(8, TABS.length, true); ev.setUint16(10, TABS.length, true);
      ev.setUint32(12, centralSize, true); ev.setUint32(16, centralOffset, true); ev.setUint16(20, 0, true);
      return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
    }

    dlAllBtn.addEventListener('click', () => {
      const files = TABS.map(t => ({ name: t.filename || `${t.id}.md`, data: strToUint8(t.prompt.replace(/\\n/g, '\n')) }));
      const blob = makeZip(files);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'prompts_bundle.zip';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // Dark mode toggle
    const DARK_KEY = 'assolombarda_dark';
    function setDark(on, { persist = true } = {}) {
      const enabled = !!on;
      root.classList.toggle('dark', enabled);
      toggleDark.textContent = enabled ? 'Light mode' : 'Dark mode';
      toggleDark.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      if (persist) {
        try { localStorage.setItem(DARK_KEY, enabled ? '1' : '0'); } catch {}
      }
    }

    function readStoredTheme() {
      try { return localStorage.getItem(DARK_KEY); } catch { return null; }
    }

    toggleDark.addEventListener('click', () => {
      const next = !root.classList.contains('dark');
      setDark(next);
    });

    const storedDark = readStoredTheme();
    if (storedDark === '1') {
      setDark(true, { persist: false });
    } else if (storedDark === '0') {
      setDark(false, { persist: false });
    } else {
      setDark(true, { persist: false });
    }

    // Initial render
    render();
  </script>
</body>
</html>
