<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linea 1B Autoguidovie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: segnaletica di trasporto pubblico. Home = tabellone partenze + mappa della linea; ogni esercizio = una fermata con le sue tappe. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#0B2A52; --text:#1B2B3F; --muted:#5A6B82; --rule:#D5DEEA;
  --route:#1A8A4C; --route-soft:#E2F4EA; --route-fill:#17804A; --sign:#FFCB05; --sign-ink:#1A1A1A; --marker:#D23A2A;
  --hl:rgba(255,203,5,.38); --prompt-bg:#0E2340; --prompt-fg:#E8EEF7; --prompt-dim:#93A7C4;
  --board:#0A1624; --board-row:#0F1F33; --board-led:#FFC23D; --board-dim:#7D8BA0; --board-go:#3DDC84; --board-red:#FF6B5B;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --r:10px; --bar:#0B2A52;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#0F1C2E; --ink:#DCE7F7; --text:#C9D5E6; --muted:#8798B0; --rule:#22344D;
  --route:#35C277; --route-soft:#103426; --hl:rgba(255,203,5,.22); --prompt-bg:#050C16; --prompt-fg:#E8EEF7; --prompt-dim:#7F93B0; --marker:#FF6E5E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#0F1C2E; --ink:#DCE7F7; --text:#C9D5E6; --muted:#8798B0; --rule:#22344D;
  --route:#35C277; --route-soft:#103426; --hl:rgba(255,203,5,.22); --prompt-bg:#050C16; --prompt-fg:#E8EEF7; --prompt-dim:#7F93B0; --marker:#FF6E5E;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);text-wrap:balance;margin:0;line-height:1.05}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.tab{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bar)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logos{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:6px 12px}
.logos img{display:block;height:30px;width:auto}
.logos .lg-dp{height:18px}
.logos .x{color:#5A6B82;font-weight:600}
@media (max-width:900px){.brand .t{display:none}}
@media (max-width:560px){.brand .badge{display:none}.logos img{height:24px}.logos .lg-dp{height:14px}}
.brand .badge{background:var(--route-fill);color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px;padding:2px 10px;border-radius:6px;letter-spacing:.02em}
.brand .t{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.brand .t small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.06em;color:#A9BCD6}
.spacer{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#C8D6EA;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
.clock{font-family:var(--f-mono);color:var(--board-led);font-size:15px;font-weight:600}

/* hero */
.hero{padding-block:40px 28px}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--route)}
.hero h1{font-size:clamp(40px,7vw,78px);font-weight:800;letter-spacing:-.01em;margin-top:8px;text-transform:uppercase}
.hero h1 .arrow{color:var(--route)}
.hero p.lede{max-width:62ch;font-size:18px;color:var(--muted);margin:14px 0 0}

/* departure board */
.board{background:var(--board);border-radius:14px;padding:18px 18px 10px;color:var(--board-led);box-shadow:0 18px 40px -24px rgba(5,20,40,.6);overflow-x:auto}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.board-head .lbl{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;font-size:15px}
.board-head .lbl span{color:var(--board-dim);font-weight:600;margin-left:8px;letter-spacing:.08em}
.board table{width:100%;border-collapse:separate;border-spacing:0 4px;font-family:var(--f-mono);font-size:15px;min-width:640px}
.board th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim);text-align:left;padding:0 12px 4px}
.board td{background:var(--board-row);padding:10px 12px;white-space:nowrap}
.board td:first-child{border-radius:6px 0 0 6px}
.board td:last-child{border-radius:0 6px 6px 0}
.board tr.ex td{cursor:pointer}
.board tr.ex:hover td{background:#14294A}
.board .dest{color:#fff;white-space:normal}
.board .dest small{display:block;color:var(--board-dim);font-size:12px}
.board .st{font-weight:700}
.st.go{color:var(--board-go)} .st.now{color:var(--board-led);animation:blink 1.2s steps(2) infinite} .st.past{color:var(--board-dim)}
@keyframes blink{50%{opacity:.35}}
.board .plat{display:inline-block;min-width:30px;text-align:center;background:var(--route-fill);color:#fff;border-radius:4px;padding:3px 8px;font-weight:700}
.board .plat.p{background:#3A4A60}
.board-foot{font-family:var(--f-mono);font-size:12px;color:var(--board-dim);padding:8px 2px 4px;overflow:hidden;white-space:nowrap}
.ticker{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* line map */
section{padding-block:28px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:clamp(28px,4vw,40px);font-weight:800;text-transform:uppercase}
.sec-h p{margin:0;color:var(--muted)}
.linemap{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:28px 18px 22px;overflow-x:auto}
.stops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));position:relative;min-width:860px}
.stops::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:21px;height:8px;background:var(--route);border-radius:4px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px}
.stop .dot{position:relative;z-index:1;width:50px;height:50px;border-radius:50%;background:var(--surface);border:7px solid var(--route);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink)}
.stop.term .dot{border-radius:10px;background:var(--ink);border-color:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.06em}
.stop.pause .dot{width:30px;height:30px;border-width:5px;margin-top:10px;margin-bottom:10px}
.stop .time{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stop .name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;color:var(--ink)}
.stop .sub{font-size:13px;color:var(--muted);line-height:1.35}
.stop a.go{position:absolute;inset:-8px 0 -8px;border-radius:12px;text-decoration:none}
.stop a.go:hover{background:var(--route-soft)}
.stop a.go:hover ~ .dot{transform:scale(1.06)}
.stop .dot,.stop .time,.stop .name,.stop .sub,.stop .prog{position:relative;pointer-events:none}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--route);font-weight:600}
.stop.done .dot{background:var(--route-fill);border-color:var(--route-fill);color:#fff}
.stop.now .dot{box-shadow:0 0 0 6px var(--hl)}

/* rules plate */
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px}
.rule .k{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--route);line-height:1}
.rule h3{font-size:20px;font-weight:700}
.rule p{margin:0;color:var(--muted);font-size:15px}
.rule.warn{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.rule.warn h3,.rule.warn .k,.rule.warn p{color:var(--sign-ink)}
@media (max-width:900px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.rules{grid-template-columns:1fr}}

footer{padding-block:30px 50px;color:var(--muted);font-size:14px;border-top:1px solid var(--rule);margin-top:20px}

/* ===== exercise view ===== */
.crumb{display:flex;gap:10px;align-items:center;padding-block:18px 0;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumb a{font-weight:600;color:var(--ink)}
.pole{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-block:22px 10px}
.sign{width:110px;height:110px;border-radius:50%;background:var(--sign);display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 6px #fff,0 0 0 2px var(--sign)}
.sign b{display:block;font-family:var(--f-display);font-weight:800;font-size:52px;line-height:.9;color:var(--sign-ink)}
.sign span{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--sign-ink)}
.pole h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
.chip.lv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:560px){.pole{grid-template-columns:1fr}.sign{width:84px;height:84px}.sign b{font-size:40px}}

.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start;padding-bottom:40px}
@media (max-width:960px){.ex-grid{grid-template-columns:1fr}}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.aside{position:static}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.card h3{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}

.case{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--route-soft);color:var(--route);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.case .who{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);line-height:1.1}
.case .role{font-size:14px;color:var(--muted)}
.case p{margin:8px 0 0;max-width:68ch}
.goals{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.goals li{padding-left:24px;position:relative}
.goals li::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;border-radius:50%;border:3px solid var(--route)}

/* steps = tappe */
.route{list-style:none;margin:26px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:23px;top:12px;bottom:12px;width:6px;background:var(--route);border-radius:3px}
.tappa{position:relative;padding-left:70px;padding-bottom:26px}
.tappa .num{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;background:var(--surface);border:6px solid var(--route);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--ink);z-index:1}
.tappa.ok .num{background:var(--route-fill);color:#fff}
.tappa-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:52px}
.tappa-h h2{font-size:26px;font-weight:700}
.tappa-h .min{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:3px 9px}
.tappa-h label{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;user-select:none}
.tappa-h input{width:20px;height:20px;accent-color:var(--route)}
.tappa .body{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.do{margin:0;padding-left:20px;display:grid;gap:4px}
.do li::marker{color:var(--route);font-weight:700}
.do li.ck{background:var(--hl);border-radius:6px;padding:8px 12px}
.do li.ck .hand{font-family:var(--f-hand);font-weight:700;font-size:20px;color:var(--marker);margin-right:8px;display:inline-block;transform:rotate(-2deg)}
.platform{font-size:13px;color:var(--muted)}
.platform b{color:var(--ink)}

.prompt{background:var(--prompt-bg);color:var(--prompt-fg);border-radius:10px;overflow:hidden}
.prompt-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.prompt-h .l{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--prompt-dim)}
.prompt-h .l b{color:var(--sign)}
.copy{margin-left:auto;border:0;background:var(--sign);color:var(--sign-ink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.copy.done{background:var(--route-fill);color:#fff}
.prompt pre{margin:0;padding:12px 14px 14px;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.prompt pre .ph{color:var(--sign);background:rgba(255,203,5,.12);border-radius:3px;padding:0 3px}

.check{position:relative;padding:12px 14px 12px 16px;border-radius:8px;background:linear-gradient(transparent 0,var(--hl) 0)}
.check .hand{font-family:var(--f-hand);font-weight:700;font-size:24px;color:var(--marker);line-height:1;transform:rotate(-2deg);display:inline-block;margin-bottom:4px}
.check ul{margin:0;padding-left:18px}
.check p{margin:0}
.q{border-left:4px solid var(--ink);padding:4px 0 4px 12px;font-weight:600;color:var(--ink)}
.q small{display:block;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.out{display:flex;gap:10px;align-items:baseline;font-size:15px;border-top:1px dashed var(--rule);padding-top:12px}
.out b{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--route);font-size:14px;white-space:nowrap}

.capolinea{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px 22px;margin-left:70px}
.capolinea h3{color:var(--bg);font-size:22px;text-transform:uppercase;margin-bottom:8px}
.capolinea ul{margin:0;padding-left:18px}
@media (max-width:560px){.tappa{padding-left:0}.route::before{display:none}.tappa .num{position:relative;width:44px;height:44px;font-size:18px;border-width:5px}.tappa-h{gap:10px}.tappa-h .num{flex:none}.capolinea{margin-left:0}}

/* aside: timer & materials */
.timer .dial{font-family:var(--f-mono);font-size:44px;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1}
.timer .phase{font-size:14px;color:var(--muted);margin-top:4px}
.track{position:relative;height:30px;margin:16px 0 12px}
.track .bar{position:absolute;left:0;right:0;top:13px;height:5px;background:var(--rule);border-radius:3px;overflow:hidden;display:flex}
.track .bar i{display:block;height:100%}
.track .bus{position:absolute;top:0;width:34px;height:22px;transform:translateX(-50%);transition:left .9s linear}
.track .mk{position:absolute;top:8px;width:3px;height:15px;background:var(--ink);transform:translateX(-50%)}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px}
.btn.pri{background:var(--route-fill);border-color:var(--route-fill);color:#fff}
.btn:hover{border-color:var(--ink)}
.mats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
.mat .ic{width:34px;height:34px;flex:none;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:700;color:#fff;background:var(--ink)}
.mat .ic.img{background:#7A4FD0}.mat .ic.xls{background:#1E7B45}.mat .ic.doc{background:#2B5DB8}
.mat .nm{min-width:0;flex:1;font-size:13.5px;line-height:1.3}
.mat .nm b{display:block;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink);word-break:break-all}
.mat .acts{display:flex;gap:6px}
.mat .acts a,.mat .acts button{font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap}
.mini{font-size:13px;color:var(--muted);margin:10px 0 0}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}
.next a{flex:1 1 220px;text-decoration:none;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:14px 16px}
.next a small{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.next a b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.next a:hover{border-color:var(--route)}

/* drawer for materials */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(5,15,30,.45)}
.drawer .panel{width:min(720px,100%);height:100%;background:var(--surface);overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(22px + env(safe-area-inset-top,0px));box-shadow:-20px 0 40px rgba(0,0,0,.2)}
.drawer .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.drawer h2{font-size:30px;text-transform:uppercase}
.drawer .close{margin-left:auto}
.doc{font-size:15.5px}
.doc h4{font-family:var(--f-display);font-size:20px;color:var(--ink);margin:20px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.doc p{margin:6px 0}
.doc .fict{font-size:13px;color:var(--muted);font-style:italic}
.tblw{overflow-x:auto;margin:8px 0}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:1px solid var(--rule);padding:7px 10px;text-align:left}
.doc th{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.doc td.n,.doc th.n{text-align:right}
.doc .indent td:first-child{padding-left:26px;color:var(--muted)}
.ex5{display:grid;gap:10px}
.ex5 .e{border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.ex5 .e b{font-family:var(--f-display);font-size:18px;color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.tag.skill{background:var(--route-soft);color:var(--route)}
.tag.agente{background:var(--ink);color:var(--bg)}
.tag.nessuno{background:var(--rule);color:var(--ink)}

/* decision helper */
.decide{display:grid;gap:10px}
.decide .qq{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:10px}
.decide .qq span{flex:1 1 260px}
.yn{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.yn button{border:0;background:var(--surface);color:var(--ink);padding:6px 14px;font-weight:600;font-size:14px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.verdict{border-radius:8px;padding:12px 14px;background:var(--route-soft);color:var(--ink)}
.verdict b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}

/* scheda form */
.scheda{display:grid;gap:12px}
.scheda fieldset{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:0;display:grid;gap:10px}
.scheda legend{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:0 6px}
.scheda label{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:var(--ink)}
.scheda input,.scheda textarea,.scheda select{font:inherit;font-weight:400;font-size:14.5px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--text);width:100%}
.scheda textarea{min-height:58px;resize:vertical}
.cases{overflow-x:auto}
.cases table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.cases th{text-align:left;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--muted);padding:4px 6px}
.cases td{padding:4px 6px;vertical-align:top}
.cases td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<p>Puntualità: una corsa è puntuale se arriva a destinazione con meno di 5 minuti di ritardo.</p>
<p>Le linee 135 e 140 sono extraurbane, M1 e M6 urbane e suburbane.</p>
<p>Il dato della linea M6 di settembre non è disponibile per un guasto al sistema di rilevazione.</p>`},

    html:FICT+`<h4>Come scegliere</h4><div class="tblw"><table><thead><tr><th>Quando</th><th>Cosa serve</th><th>Perché</th></tr></thead><tbody>
<tr><td>Un compito ripetitivo con passi e formato fissi, che parte da una richiesta chiara</td><td><span class="tag skill">Skill</span></td><td>Si scrive una volta e si richiama, il risultato ha sempre la stessa forma</td></tr>
<tr><td>Un assistente con un ruolo, che consulta documenti, fa domande e gestisce compiti simili</td><td><span class="tag agente">Agente</span></td><td>Serve conversare, e avere fonti e limiti sempre a disposizione</td></tr>
<tr><td>Un compito che si fa una volta sola o richiede un giudizio nuovo ogni volta</td><td><span class="tag nessuno">Nessuno</span></td><td>Il tempo per costruirlo è maggiore del tempo che fa risparmiare</td></tr>
</tbody></table></div>
<h4>Cinque esempi</h4><div class="ex5">
<div class="e"><b>1. Risposta ai reclami dei passeggeri</b> <span class="tag skill">Skill</span><p><i>Servizio clienti.</i> Ogni giorno si risponde a reclami scritti secondo la stessa procedura.</p><p><b>Riceve:</b> il testo del reclamo. <b>Produce:</b> una risposta di 6-8 righe, con una nota interna di categoria e azione.</p><p><b>Regole:</b> non promettere rimborsi, non ripetere nomi di dipendenti, non inventare numeri di protocollo, chiedere i dati se mancano data, linea o orario.</p></div>
<div class="e"><b>2. Primo triage di una segnalazione di sinistro</b> <span class="tag agente">Agente</span><p><i>Ufficio sinistri.</i> Classificare una segnalazione appena arrivata e decidere chi avvisare.</p><p><b>Riceve:</b> la segnalazione, spesso incompleta, e la procedura di prima gestione come fonte. <b>Produce:</b> categoria (danni a cose, danni a terzi, persone ferite, non è un sinistro), chi avvisare e in quanto tempo, dati mancanti.</p><p><b>Regole:</b> se una persona dice di essersi fatta male, anche in modo incerto, si tratta come possibile lesione. Non si stabilisce la responsabilità. Se mancano data, luogo o bus si chiedono i dati.</p></div>
<div class="e"><b>3. Controllo dei turni della settimana</b> <span class="tag skill">Skill</span><p><i>Pianificazione.</i> Ogni venerdì si controlla il foglio dei turni rispetto a poche regole.</p><p><b>Riceve:</b> il foglio turni con assenze. <b>Produce:</b> una tabella dei problemi (conducente, giorno, regola) e la copertura per giorno.</p><p><b>Regole:</b> massimo 5 giorni di lavoro consecutivi, minimo di conducenti in servizio, nessun turno durante un'assenza.</p></div>
<div class="e"><b>4. Assistente sulle offerte dei fornitori</b> <span class="tag agente">Agente</span><p><i>Direzione tecnica.</i> Rispondere a domande su capitolato e offerte ricevute, confrontandole.</p><p><b>Riceve:</b> i documenti come fonti e domande a voce. <b>Produce:</b> risposte con il riferimento al documento e al punto, e l'elenco di cosa manca.</p><p><b>Regole:</b> citare sempre la fonte, dire "non lo trovo" quando manca, segnalare quando due documenti si contraddicono.</p></div>
<div class="e"><b>5. Avvisi ai passeggeri in italiano e in inglese</b> <span class="tag skill">Skill</span><p><i>Comunicazione.</i> Trasformare le informazioni di una deviazione in un avviso per le fermate.</p><p><b>Riceve:</b> date, linea, fermate non servite, fermata sostitutiva. <b>Produce:</b> un avviso in italiano semplice e uno in inglese, brevi.</p><p><b>Regole:</b> non cambiare date, numeri di linea e nomi di vie.</p></div>
</div>`},

const store = {
  get(k,d){try{const v=localStorage.getItem("l1b:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},

/* ---------- utilità ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const nowMin = ()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function copyText(text,btn){
  const ok=()=>{if(!btn)return;const o=btn.textContent;btn.textContent="Copiato";btn.classList.add("done");setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1600)};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){if(btn)btn.textContent="Seleziona e copia"}ta.remove()};
  try{navigator.clipboard.writeText(text).then(ok,fallback)}catch(e){fallback()}
}
const stepsDone = id=>EX.find(e=>e.id===id).steps.filter((_,i)=>store.get(`s${id}-${i}`,false)).length;
const fmtPrompt = t=>esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>');

/* ---------- HOME ---------- */
function statusFor(a){
  const s=SESS[session].start+a.o, e=s+a.d, n=nowMin();
  if(n<s){const diff=s-n;return diff<=20?{c:"go",t:`tra ${diff}'`}:{c:"go",t:"in orario"}}
  if(n<e) return {c:"now",t:`in corso · ${e-n}'`};
  return {c:"past",t:"partito"};
}

      <td class="tab">${hhmm(SESS[session].start+a.o)}</td>
      <td><span class="plat ${ex?"":"p"}">${ex?"F"+ex.id:"—"}</span></td>
      <td class="dest">${esc(name)}<small>${esc(sub)}</small></td>
      <td class="tab">${a.d}'</td>
      <td class="st ${st.c}">${st.t}</td></tr>`}).join("");
  const stops = AGENDA.map(a=>{
    const ex=a.ex?EX.find(e=>e.id===a.ex):null, st=statusFor(a);
    const t=hhmm(SESS[session].start+a.o);
    if(!ex) return `<li class="stop ${a.k==="term"?"term":"pause"} ${st.c==="now"?"now":""}"><span class="dot">${a.k==="term"?(a.o===0?"INIZIO":"FINE"):""}</span><span class="time tab">${t}</span><span class="name">${esc(a.name)}</span><span class="sub">${esc(a.sub)}</span></li>`;
    const d=stepsDone(ex.id), n=ex.steps.length;
    return `<li class="stop ${d===n?"done":""} ${st.c==="now"?"now":""}"><a class="go" href="#fermata-${ex.id}" aria-label="Apri fermata ${ex.id}: ${esc(ex.short)}"></a><span class="dot">${ex.id}</span><span class="time tab">${t} · ${ex.min}'</span><span class="name">${esc(ex.short)}</span><span class="sub">${esc(ex.sub)}</span><span class="prog tab">${d}/${n} tappe</span></li>`}).join("");
  return `
  <div class="wrap hero">
    <div class="eyebrow">Productivity Booster · seconda sessione · giovedì 26 novembre 2026</div>
    <h1>Dal lavoro di ogni giorno <span class="arrow">→</span> al vostro agente</h1>
    <p class="lede">Quattro fermate, un esercizio per fermata. Ogni esercizio ha le sue tappe, i materiali da usare con Copilot e i punti da controllare con i vostri occhi. Scegliete una fermata dal tabellone o dalla mappa.</p>
  </div>
  <div class="wrap">
    <div class="board" aria-label="Tabellone della giornata">
      <div class="board-head"><div class="lbl">Partenze<span>${esc(SESS[session].label)}</span></div><div class="lbl tab" id="bclock"></div></div>
      <table><thead><tr><th>Ora</th><th>Fermata</th><th>Destinazione</th><th>Durata</th><th>Stato</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="board-foot"><span class="ticker">Avviso ai viaggiatori · tutti i materiali sono fittizi · non incollate dati reali o personali, né di colleghi né dell'ente · ogni numero che vi dà Copilot va controllato sulla fonte · chi resta indietro salta e riparte dalla fermata successiva ·</span></div>
    </div>
  </div>
  <section class="wrap">
    <div class="sec-h"><h2>La linea della giornata</h2><p>Tocca una fermata per aprire l'esercizio.</p></div>
    <div class="linemap"><ol class="stops">${stops}</ol></div>
  </section>
  <section class="wrap">
    <div class="sec-h"><h2>Regole di viaggio</h2></div>
    <div class="rules">
      <div class="rule warn"><div class="k">!</div><h3>Solo dati finti</h3><p>Tutti i materiali sono fittizi. Non incollate dati reali o personali, né di colleghi né dell'ente.</p></div>
      <div class="rule"><div class="k tab">20' + 10'</div><h3>Lavoro, poi confronto</h3><p>Venti minuti con Copilot, dieci in coppia: due persone che si guardano il risultato.</p></div>
      <div class="rule"><div class="k">↷</div><h3>Fermate indipendenti</h3><p>Ogni esercizio sta in piedi da solo. Se restate indietro, saltate e ripartite dal successivo.</p></div>
      <div class="rule"><div class="k">✓</div><h3>Controllate voi</h3><p>Copilot legge, scrive e calcola, ma può indovinare. Le righe evidenziate in giallo dicono cosa verificare a mano.</p></div>
    </div>
  </section>
  <footer class="wrap">Datapizza per Autoguidovie · Blocco 1, giornata 1B · Strumento: Microsoft 365 Copilot. I progressi delle tappe restano solo su questo dispositivo.</footer>`;
}

/* ---------- FERMATA ---------- */
function matItem(k){
  const m=MATS[k]; const ic=m.kind==="img"?"JPG":m.kind==="xls"?"XLSX":"DOCX";
  const view = m.html?`<button type="button" data-mat="${k}">Leggi</button>`:(k==="scheda"?`<a href="#scheda">Compila</a>`:"");
  return `<li class="mat"><span class="ic ${m.kind}">${ic}</span><span class="nm"><b>${m.file}</b>${esc(m.desc)}</span><span class="acts">${view}<a href="${m.drive}" target="_blank" rel="noopener">Drive</a></span></li>`;
}
const CHECK_RE=/^(Controlla|Confronta|Apri la foto accanto|Rileggi|Per ogni risposta controlla|Solo per la skill)/;
function stepHTML(ex,s,i){
  const done=store.get(`s${ex.id}-${i}`,false);
  const items=s.do.map(d=>CHECK_RE.test(d)?`<li class="ck"><span class="hand">controlla</span>${esc(d)}</li>`:`<li>${esc(d)}</li>`).join("");
  const exq=s.ex?`<div class="prompt"><div class="prompt-h"><span class="l">${esc(s.ex.l)} · <b>dalle istruzioni</b></span><button class="copy" type="button" data-copy="${ex.id}-${i}">Copia</button></div><pre>${esc(s.ex.x)}</pre></div>`:"";
  return `<li class="tappa ${done?"ok":""}" id="t${ex.id}-${i}">
    <div class="tappa-h"><span class="num">${i+1}</span><h2>${esc(s.t)}</h2><span class="min tab">${s.min}'</span>
      <label for="c${ex.id}-${i}"><input type="checkbox" id="c${ex.id}-${i}" data-step="${ex.id}-${i}" ${done?"checked":""}> Fatto</label></div>
    <div class="body">
      <ul class="do">${items}</ul>
      ${s.mat?`<div><button class="btn" type="button" data-mat="${s.mat}">Apri il profilo da incollare</button></div>`:""}
      ${exq}
      ${s.q?`<div class="q"><small>Domanda guida</small>${esc(s.q)}</div>`:""}
      <div class="out"><b>Output</b><span>${esc(s.out)}</span></div>
    </div></li>`;
}
function decideHTML(){
  return `<div class="card doc" id="decide"><h3>Come scegliere</h3><div class="tblw"><table><thead><tr><th>Quando</th><th>Cosa serve</th><th>Perché</th></tr></thead><tbody>
<tr><td>Un compito ripetitivo con passi e formato fissi, che parte da una richiesta chiara</td><td><span class="tag skill">Skill</span></td><td>Si scrive una volta e si richiama, il risultato ha sempre la stessa forma</td></tr>
<tr><td>Un assistente con un ruolo, che consulta documenti, fa domande e gestisce compiti simili</td><td><span class="tag agente">Agente</span></td><td>Serve conversare, e avere fonti e limiti sempre a disposizione</td></tr>
<tr><td>Un compito che si fa una volta sola o richiede un giudizio nuovo ogni volta</td><td><span class="tag nessuno">Nessuno dei due</span></td><td>Il tempo per costruirlo è maggiore del tempo che fa risparmiare</td></tr>
</tbody></table></div><p class="mini">Da mat-9-esempi-agenti-e-skill.docx</p></div>`;
}
function verdict(){}
const FORM=[
 ["Parte 1 · Il compito",[["p1a","Che compito ripeti"],["p1b","Ogni quanto",1],["p1c","Cosa ricevi in ingresso"],["p1d","Cosa produci"],["p1e","Regole che rispetti sempre"],["p1f","Cosa non devi mai fare"],["p1g","Chi controlla il risultato",1]]],
 ["Parte 2 · La scelta",[["p2a","Cosa consiglia lo strumento (agente, skill, nessuno dei due) e perché"],["p2b","Cosa scegli tu e perché"]]],
 ["Parte 3 · Agente",[["a1","Nome e ruolo",1],["a2","Istruzioni: tono, limiti, cosa non fa"],["a3","Fonti da caricare"],["a4","Formato della risposta"],["a5","Quando passa la mano a una persona"]],"agente"],
 ["Parte 3 · Skill",[["k1","Nome",1],["k2","Quando si usa (descrizione di 2 frasi)"],["k3","Passi da seguire, numerati"],["k4","Regole: cosa fa sempre e cosa non fa mai"],["k5","Formato della risposta e un esempio"]],"skill"]
];
function formHTML(){
  const f=store.get("form",{}); const kind=f.kind||"agente";
  const fs=FORM.map(([lg,fields,only])=>`<fieldset ${only?`data-only="${only}" ${only!==kind?"hidden":""}`:""}><legend>${lg}</legend>${
    only===undefined&&lg.startsWith("Parte 2")?`<label for="f-kind">Ho scelto<select id="f-kind" data-f="kind"><option value="agente" ${kind==="agente"?"selected":""}>Un agente</option><option value="skill" ${kind==="skill"?"selected":""}>Una skill</option><option value="nessuno" ${kind==="nessuno"?"selected":""}>Nessuno dei due</option></select></label>`:""}${
    fields.map(([k,l,one])=>`<label for="f-${k}">${l}${one?`<input id="f-${k}" data-f="${k}" value="${esc(f[k]||"")}">`:`<textarea id="f-${k}" data-f="${k}">${esc(f[k]||"")}</textarea>`}</label>`).join("")}</fieldset>`).join("");
  const cases=["Tipico","Dato mancante","Fuori perimetro","Non attivazione (skill)"];
  const ct=`<fieldset><legend>Prove · tre casi</legend><div class="cases"><table><thead><tr><th>Caso</th><th>Esito atteso</th><th>Ottenuto prima</th><th>Ottenuto dopo la correzione</th></tr></thead><tbody>${cases.map((c,i)=>`<tr><td>${c}</td>${["e","p","d"].map(x=>`<td><input id="f-c${i}${x}" data-f="c${i}${x}" aria-label="${c} ${x}" value="${esc(f["c"+i+x]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></fieldset>`;
  const nota=`<fieldset><legend>Nota d'uso · 5 righe</legend>${[["n1","Cosa fa"],["n2","Cosa non fa"],["n3","Quando non usarlo"],["n4","Cosa controllare sempre prima di fidarsi"],["n5","Chi lo aggiorna quando cambia la procedura"]].map(([k,l])=>`<label for="f-${k}">${l}<input id="f-${k}" data-f="${k}" value="${esc(f[k]||"")}"></label>`).join("")}</fieldset>`;
  return `<div class="card" id="scheda"><h3>Scheda · agente o skill</h3><p class="mini" style="margin:0 0 12px">Compila man mano. Resta salvata su questo dispositivo. Con "Copia la scheda" la incolli in un documento.</p>
   <form class="scheda" id="form" onsubmit="return false">${fs}${ct}${nota}</form>
   <div class="tbtns" style="margin-top:12px"><button class="btn pri" type="button" id="f-copy">Copia la scheda</button><button class="btn" type="button" id="f-clear">Svuota</button><span class="mini" id="f-msg" style="margin:6px 0 0"></span></div></div>`;
}
function formText(){
  const f=store.get("form",{}); const kind=f.kind||"agente"; let out="SCHEDA AGENTE O SKILL\n";
  FORM.forEach(([lg,fields,only])=>{ if(only&&only!==kind)return; out+=`\n${lg.toUpperCase()}\n`; if(lg.startsWith("Parte 2"))out+=`Ho scelto: ${kind}\n`; fields.forEach(([k,l])=>out+=`${l}: ${f[k]||""}\n`)});
  out+="\nPROVE\n";["Tipico","Dato mancante","Fuori perimetro","Non attivazione"].forEach((c,i)=>out+=`${c} · atteso: ${f["c"+i+"e"]||""} · prima: ${f["c"+i+"p"]||""} · dopo: ${f["c"+i+"d"]||""}\n`);
  out+="\nNOTA D'USO\n";[["n1","Cosa fa"],["n2","Cosa non fa"],["n3","Quando non usarlo"],["n4","Cosa controllare"],["n5","Chi lo aggiorna"]].forEach(([k,l])=>out+=`${l}: ${f[k]||""}\n`);
  return out;
}

function fermata(id){
  const ex=EX.find(e=>e.id===id); if(!ex) return home();
  const ag=AGENDA.find(a=>a.ex===id); const t0=SESS[session].start+ag.o;
  const prev=EX.find(e=>e.id===id-1), next=EX.find(e=>e.id===id+1);
  return `
  <div class="wrap">
    <nav class="crumb"><a href="#linea">← Linea</a><span>/</span><span>Fermata ${ex.id} di ${EX.length}</span><span>/</span><span class="tab">${hhmm(t0)}–${hhmm(t0+ag.d)}</span></nav>
    <div class="pole"><div class="sign" aria-hidden="true"><div><span>FERMATA</span><b>${ex.id}</b></div></div>
      <div><h1>${esc(ex.short)}</h1>
      <div class="chips"><span class="chip lv">${ex.level}</span><span class="chip tab">${ex.min} minuti</span><span class="chip">${ex.steps.length} tappe</span><span class="chip">Microsoft 365 Copilot</span></div></div></div>
    <div class="ex-grid">
      <div style="min-width:0">
        <div class="card"><div class="case"><div class="avatar">${ex.ini}</div><div><div class="who">${esc(ex.who)}</div><div class="role">${esc(ex.role)}</div>
          <p>${esc(ex.caso)}</p><ul class="goals">${ex.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>
          ${ex.note?`<p class="mini"><b>${esc(ex.note)}</b></p>`:""}</div></div></div>
        ${ex.decide?`<div style="margin-top:18px">${decideHTML()}</div>`:""}
        <ol class="route">${ex.steps.map((s,i)=>stepHTML(ex,s,i)).join("")}</ol>
        <div class="capolinea"><h3>Capolinea · cosa porti al confronto</h3><ul>${ex.finale.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
        <div class="card" style="margin-top:18px"><h3>Confronto in coppia · 10'</h3><ol class="do">${ex.confronto.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>
        ${ex.form?`<div style="margin-top:18px">${formHTML()}</div>`:""}
        <div class="next" style="margin-top:18px">
          ${prev?`<a href="#fermata-${prev.id}"><small>← Fermata precedente</small><b>${esc(prev.short)}</b></a>`:`<a href="#linea"><small>← Torna</small><b>Mappa della linea</b></a>`}
          ${next?`<a href="#fermata-${next.id}" style="text-align:right"><small>Fermata successiva →</small><b>${esc(next.short)}</b></a>`:`<a href="#linea" style="text-align:right"><small>Capolinea →</small><b>Chiusura</b></a>`}
        </div>
      </div>
      <aside class="aside">
        <div class="card timer" id="timer"></div>
        <div class="card"><h3>Materiali</h3><ul class="mats">${ex.mats.map(matItem).join("")}</ul>
          <p class="mini">"Leggi" apre il testo qui, da copiare in chat. "Drive" apre il file originale da allegare.</p></div>
      </aside>
    </div>
  </div>`;
}

/* ---------- timer ---------- */
let T={id:null,el:0,run:false,h:null};
function busSVG(){return `<svg class="bus" viewBox="0 0 34 22" aria-hidden="true"><rect x="1" y="2" width="32" height="15" rx="3" fill="var(--route)"/><rect x="4" y="5" width="6" height="5" rx="1" fill="#fff"/><rect x="12" y="5" width="6" height="5" rx="1" fill="#fff"/><rect x="20" y="5" width="6" height="5" rx="1" fill="#fff"/><rect x="28" y="5" width="3" height="8" rx="1" fill="#fff"/><circle cx="8" cy="18" r="3" fill="var(--ink)"/><circle cx="25" cy="18" r="3" fill="var(--ink)"/></svg>`}
function renderTimer(){
  const box=$("#timer"); if(!box)return; const ex=EX.find(e=>e.id===T.id);
  const [w,c]=ex.timer, tot=(w+c)*60, el=Math.min(T.el,tot);
  const inWork=el<w*60, left=inWork?w*60-el:tot-el;
  const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
  const pct=el/tot*100, wp=w/(w+c)*100;
  box.innerHTML=`<h3>Cronometro</h3><div class="dial tab">${mm}:${ss}</div>
   <div class="phase">${el>=tot?"Tempo finito: si passa alla fermata successiva":inWork?`Lavoro con Copilot · ${w}'`:`Confronto in coppia · ${c}'`}</div>
   <div class="track"><div class="bar"><i style="width:${wp}%;background:var(--route)"></i><i style="width:${100-wp}%;background:var(--sign)"></i></div><span class="mk" style="left:${wp}%"></span><span style="position:absolute;left:${pct}%;top:0">${busSVG()}</span></div>
   <div class="tbtns"><button class="btn pri" type="button" id="t-go">${T.run?"Pausa":el>0&&el<tot?"Riprendi":"Avvia"}</button><button class="btn" type="button" id="t-skip">${inWork?"Vai al confronto":"Ricomincia"}</button></div>`;
  $("#t-go").onclick=()=>{T.run=!T.run; if(T.el>=tot)T.el=0; tick(); renderTimer()};
  $("#t-skip").onclick=()=>{T.el=inWork?w*60:0; if(!inWork)T.run=false; renderTimer()};
}
function tick(){clearInterval(T.h); if(!T.run)return; T.h=setInterval(()=>{T.el++;const ex=EX.find(e=>e.id===T.id);if(T.el>=(ex.timer[0]+ex.timer[1])*60){T.run=false;clearInterval(T.h)}renderTimer()},1000)}

/* ---------- drawer ---------- */
let lastFocus=null;
function openMat(k){
  const m=MATS[k]; lastFocus=document.activeElement;
  $("#dr-title").textContent=m.title||m.file; $("#dr-body").innerHTML=m.html+`<p class="mini" style="margin-top:20px">File originale: <a href="${m.drive}" target="_blank" rel="noopener">${m.file} su Drive</a></p>`;
  $("#dr-copy").onclick=e=>copyText($("#dr-body").innerText.replace(/\nFile originale:.*$/s,"").trim(),e.currentTarget);
  $("#drawer").hidden=false; $("#dr-close").focus();
}
function closeMat(){$("#drawer").hidden=true; if(lastFocus)lastFocus.focus()}
$("#dr-close").onclick=closeMat;
$("#drawer").addEventListener("click",e=>{if(e.target.id==="drawer")closeMat()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden)closeMat()});

/* ---------- router ---------- */
function route(){
  const h=location.hash.replace("#","");
  const m=h.match(/^fermata-(\d)$/);
  clearInterval(T.h);
  if(m){const id=+m[1]; if(T.id!==id){T={id,el:0,run:false,h:null}} $("#app").innerHTML=fermata(id); renderTimer(); tick(); verdict(); if(window._fromNav)scrollTo(0,0)}
  else if(h==="scheda"){location.hash="fermata-4";setTimeout(()=>{const s=$("#scheda");if(s)s.scrollIntoView()},50);return}
  else {$("#app").innerHTML=home(); updClock()}
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===session)));
}
window.addEventListener("hashchange",()=>{window._fromNav=true;route()});

/* ---------- eventi delegati ---------- */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]"); if(c){const [a,b]=c.dataset.copy.split("-").map(Number);copyText(EX.find(x=>x.id===a).steps[b].ex.x,c);return}
  const mt=e.target.closest("[data-mat]"); if(mt){openMat(mt.dataset.mat);return}
  const go=e.target.closest("tr[data-go]"); if(go){location.hash=go.dataset.go;return}
  const s=e.target.closest(".seg button"); if(s){session=s.dataset.s;store.set("session",session);route();return}
  const dq=e.target.closest("[data-dq]"); if(dq){const a=store.get("dq",{});a[dq.dataset.dq]=dq.dataset.v;store.set("dq",a);verdict();return}
  if(e.target.id==="f-copy"){copyText(formText(),e.target);return}
  if(e.target.id==="f-clear"){const m=$("#f-msg"); if(m.dataset.arm){store.set("form",{});route();}else{m.dataset.arm="1";m.textContent="Tocca di nuovo per svuotare";setTimeout(()=>{m.textContent="";delete m.dataset.arm},3000)}}
});
document.addEventListener("keydown",e=>{const go=e.target.closest&&e.target.closest("tr[data-go]");if(go&&(e.key==="Enter"||e.key===" ")){e.preventDefault();location.hash=go.dataset.go}});
document.addEventListener("change",e=>{
  const st=e.target.dataset&&e.target.dataset.step; if(st){store.set("s"+st,e.target.checked);e.target.closest(".tappa").classList.toggle("ok",e.target.checked)}
  if(e.target.dataset&&e.target.dataset.f==="kind"){const f=store.get("form",{});f.kind=e.target.value;store.set("form",f);document.querySelectorAll("[data-only]").forEach(fs=>fs.hidden=fs.dataset.only!==e.target.value)}
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.f; if(k&&k!=="kind"){const f=store.get("form",{});f[k]=e.target.value;store.set("form",f)}});

/* ---------- orologio ---------- */
function updClock(){const d=new Date();const t=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;$("#clock").textContent=t;const b=$("#bclock");if(b)b.textContent=t}
let lastMin=nowMin();
setInterval(()=>{updClock();const n=nowMin();if(n!==lastMin){lastMin=n;if(!location.hash.startsWith("#fermata"))route()}},5000);

route(); updClock();
</script>
</body>
