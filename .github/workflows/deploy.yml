name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GSK/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies and build GSK app
        working-directory: GSK
        run: |
          npm ci
          npm run build

      - name: Build static site (inject Firebase config)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -av --delete --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'GSK' ./ dist/
          rm -f dist/firebase-config-local.js
          : "${FIREBASE_API_KEY:?FIREBASE_API_KEY secret is missing}"
          : "${FIREBASE_AUTH_DOMAIN:?FIREBASE_AUTH_DOMAIN secret is missing}"
          : "${FIREBASE_DATABASE_URL:?FIREBASE_DATABASE_URL secret is missing}"
          : "${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID secret is missing}"
          : "${FIREBASE_STORAGE_BUCKET:?FIREBASE_STORAGE_BUCKET secret is missing}"
          : "${FIREBASE_MESSAGING_SENDER_ID:?FIREBASE_MESSAGING_SENDER_ID secret is missing}"
          : "${FIREBASE_APP_ID:?FIREBASE_APP_ID secret is missing}"
          : "${FIREBASE_MEASUREMENT_ID:?FIREBASE_MEASUREMENT_ID secret is missing}"
          cat <<EOF > dist/firebase-config.js
window.firebaseConfig = {
  apiKey: "${FIREBASE_API_KEY}",
  authDomain: "${FIREBASE_AUTH_DOMAIN}",
  databaseURL: "${FIREBASE_DATABASE_URL}",
  projectId: "${FIREBASE_PROJECT_ID}",
  storageBucket: "${FIREBASE_STORAGE_BUCKET}",
  messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
  appId: "${FIREBASE_APP_ID}",
  measurementId: "${FIREBASE_MEASUREMENT_ID}"
};
EOF

      - name: Copy GSK build into artifact
        run: |
          rsync -av --delete GSK/dist/GSK/ dist/GSK/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 
