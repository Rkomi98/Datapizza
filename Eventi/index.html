            color: #2c3e50;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .header .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.15);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #a855f7;
            display: block;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: linear-gradient(135deg, #a855f7, #8b5cf6);
            border-radius: 2px;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        
        .event-card {
            background: linear-gradient(135deg, #fefbff 0%, #f8f4ff 100%);
            border: 2px solid #e9d5ff;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }
        
        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #a855f7, #8b5cf6);
        }
        
        .event-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 15px;
        }
        
        .event-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .event-stat {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e9d5ff;
        }
        
        .event-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #a855f7;
        }
        
        .event-stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .event-link {
            display: inline-block;
            background: linear-gradient(135deg, #a855f7, #8b5cf6);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .event-link:hover {

            font-size: 0.9rem;

            }

                padding: 20px;
            }

        /**
         * Renderizza le statistiche generali
         */
        function renderOverviewStats(events) {
            const statsContainer = document.getElementById('stats-overview');
            
            if (events.length === 0) {
                statsContainer.style.display = 'none';
                return;
            }
            
            // Calcola statistiche aggregate
            let totalParticipants = 0;
            let totalFeedbacks = 0;
            let totalCompanies = new Set();
            let avgSatisfaction = 0;
            let satisfactionCount = 0;
            
            events.forEach(event => {
                const kpis = event.kpis || {};
                totalParticipants += kpis.profiling_responses || 0;
                totalFeedbacks += kpis.feedback_responses || 0;
                totalCompanies = new Set([...totalCompanies, ...(event.profiling_data?.companies?.list || [])]);
                
                if (kpis.overall_satisfaction) {
                    avgSatisfaction += kpis.overall_satisfaction;
                    satisfactionCount++;
                }
            });
            
            const stats = [
                { value: events.length, label: 'Eventi Totali' },
                { value: totalParticipants, label: 'Partecipanti' },
                { value: totalFeedbacks, label: 'Feedback Ricevuti' },
                { value: totalCompanies.size, label: 'Aziende Uniche' },
                { 
                    value: satisfactionCount > 0 ? (avgSatisfaction / satisfactionCount).toFixed(1) : 'N/A', 
                    label: 'Soddisfazione Media' 
                }
            ];
            
            statsContainer.innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <span class="stat-value">${stat.value}</span>
                    <span class="stat-label">${stat.label}</span>
                </div>
            `).join('');
        }
        
        /**
         * Renderizza la lista degli eventi
         */
        function renderEvents(events) {
            const container = document.getElementById('events-container');
            
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="no-events">
                        <div class="no-events-icon">📭</div>
                        <h3>Nessun evento trovato</h3>
                        <p>Esegui <code>python analyze_all_events.py</code> per analizzare gli eventi disponibili.</p>
                    </div>
                `;
                return;
            }
            
            // Ordina per data (più recenti prima)
            const sortedEvents = [...events].sort((a, b) => {
                return new Date(b.analysis_date) - new Date(a.analysis_date);
            });
            
            container.innerHTML = sortedEvents.map(event => {
                const kpis = event.kpis || {};
                const profiling = event.profiling_data || {};
                const feedback = event.feedback_data || {};
                
                return `
                    <div class="event-card" onclick="window.location.href='${event.event_folder}/index.html'">
                        <div class="event-name">${event.event_name}</div>
                        <div class="event-stats">
                            <div class="event-stat">
                                <div class="event-stat-value">${kpis.profiling_responses || 0}</div>
                                <div class="event-stat-label">Partecipanti</div>
                            </div>
                            <div class="event-stat">
                                <div class="event-stat-value">${kpis.feedback_responses || 0}</div>
                                <div class="event-stat-label">Feedback</div>
                            </div>
                            <div class="event-stat">
                                <div class="event-stat-value">${kpis.overall_satisfaction ? kpis.overall_satisfaction.toFixed(1) + '/5' : 'N/A'}</div>
                                <div class="event-stat-label">Soddisfazione</div>
                            </div>
                            <div class="event-stat">
                                <div class="event-stat-value">${profiling.companies?.total_unique || 0}</div>
                                <div class="event-stat-label">Aziende</div>
                            </div>
                        </div>
                        <a href="${event.event_folder}/index.html" class="event-link" onclick="event.stopPropagation()">
                            Vedi Report →
                        </a>
                    </div>
                `;
            }).join('');
        }

                renderOverviewStats(events);
                renderEvents(events);
                
                // Aggiorna data ultimo update
                const lastUpdate = new Date().toLocaleDateString('it-IT', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('last-update').textContent = lastUpdate;
            } else {
                document.getElementById('events-container').innerHTML = `
                    <div class="no-events">
                        <div class="no-events-icon">📭</div>
                        <h3>Nessun evento trovato</h3>
                        <p>Esegui <code>python analyze_all_events.py</code> per generare i dati.</p>
                    </div>
                `;
            }
        }
        
        // Avvia l'applicazione
        init();
    </script>
</body>
</html>
