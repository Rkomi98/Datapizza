<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Tuo Risultato Salariale</title>
    <meta property="og:title" content="Il mio risultato salariale">
    <meta property="og:description" content="Scopri se il tuo stipendio è competitivo">
    <meta property="og:image" content="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 1.1em;
        }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            color: #555;
        }

        .info-value {
            color: #333;
        }

        .highlight {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .share-text {
            color: #555;
            margin: 25px 0 15px;
            font-size: 1.1em;
        }

        .share-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 1em;
        }
        
        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .whatsapp {
            background: #25D366;
        }
        
        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        
        .linkedin {
            background: #0077B5;
        }

        .download-btn {
            background: #6c757d;
        }

        .email {
            background: #ff8c00;
        }

        .loader {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            .share-btn {
                padding: 12px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Caricamento risultato...</p>
        </div>

        <div id="content" style="display: none;">
            <h1>Il Tuo Risultato</h1>
            <p class="subtitle" id="subtitle"></p>
            
            <!-- Immagine risultato dinamica -->
            <img src="" alt="Risultato" class="result-image" id="resultImage">
            
            <!-- Info Box -->
            <div class="info-box">
                <div class="info-row">
                    <span class="info-label">Ruolo:</span>
                    <span class="info-value" id="ruolo"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Località:</span>
                    <span class="info-value" id="localita"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Esperienza:</span>
                    <span class="info-value" id="esperienza"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Tuo stipendio:</span>
                    <span class="info-value highlight" id="stipendio"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Range di mercato:</span>
                    <span class="info-value" id="range"></span>
                </div>
            </div>

            <p class="share-text">Condividi il tuo risultato!</p>
            
            <div class="share-buttons">
                <!-- WhatsApp -->
                <button class="share-btn whatsapp" id="whatsappBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    WhatsApp
                </button>
                
                <!-- Instagram -->
                <button class="share-btn instagram" id="instagramBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                    Instagram
                </button>
                
                <!-- LinkedIn -->
                <button class="share-btn linkedin" id="linkedinBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                    LinkedIn
                </button>

                <!-- Download -->
                <button class="share-btn download-btn" id="downloadBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    Scarica
                </button>

                <!-- Email -->
                <button class="share-btn email" id="emailBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 2v.01L12 13 4 6.01V6h16zM4 18V8l8 5 8-5v10H4z"/>
                    </svg>
                    Email
                </button>
            </div>
        </div>
    </div>

    <script>
        // Ottieni i parametri dall'URL
        const urlParams = new URLSearchParams(window.location.search);
        const score = parseInt(urlParams.get('score')) || 0;
        const ruolo = urlParams.get('ruolo') || 'Non specificato';
        const localita = urlParams.get('localita') || 'Non specificata';
        const esperienza = urlParams.get('esperienza') || 'Non specificata';
        const stipendio = parseInt(urlParams.get('stipendio')) || 0;
        const minEur = parseInt(urlParams.get('min')) || 0;
        const maxEur = parseInt(urlParams.get('max')) || 0;
        const position = urlParams.get('position') || '';

        // Mappa score -> immagine (tutti i file sono .jpg nella cartella images)
        const fallbackImage = 'images/3.jpg';
        const imageMap = {
            1: 'images/1.jpg',
            2: 'images/2.jpg',
            3: 'images/3.jpg',
            4: 'images/4.jpg'
        };
        const imagePath = imageMap[score] || fallbackImage;
        
        // Messaggi in base allo score
        const scoreMessages = {
            1: "Il tuo stipendio è sotto la media di mercato",
            2: "Il tuo stipendio è nella fascia bassa del mercato",
            3: "Il tuo stipendio è in linea con il mercato",
            4: "Il tuo stipendio è nella fascia alta del mercato",
            5: "Il tuo stipendio è sopra la media di mercato"
        };

        // Aggiorna il contenuto della pagina
        const scoreMessage = scoreMessages[score] || "Risultato analisi";
        document.getElementById('subtitle').textContent = scoreMessage;
        const resultImage = document.getElementById('resultImage');
        resultImage.src = imagePath;
        resultImage.alt = `Score ${score}`;
        document.getElementById('ruolo').textContent = ruolo;
        document.getElementById('localita').textContent = localita;
        document.getElementById('esperienza').textContent = esperienza;
        document.getElementById('stipendio').textContent = `€${stipendio.toLocaleString('it-IT')}`;
        document.getElementById('range').textContent = `€${minEur.toLocaleString('it-IT')} - €${maxEur.toLocaleString('it-IT')}`;

        // Nascondi loader e mostra contenuto
        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // URL e testo da condividere
        const pageUrl = window.location.href;
        const normalizedScoreMessage = scoreMessages[score]
            ? scoreMessages[score].toLowerCase()
            : 'risultato della mia analisi salariale';
        const shareText = `Ho scoperto che il mio stipendio come ${ruolo} a ${localita} ${normalizedScoreMessage}! Scopri anche tu.`;

        // Meta tags per social sharing
        document.querySelector('meta[property="og:image"]').setAttribute('content', new URL(imagePath, window.location.href).href);

        async function ensureImageReady(imgEl) {
            if (imgEl.complete && imgEl.naturalWidth) {
                return;
            }

            await new Promise((resolve, reject) => {
                imgEl.addEventListener('load', resolve, { once: true });
                imgEl.addEventListener('error', () => reject(new Error('Immagine non caricata')), { once: true });
            });
        }

        async function getImageBlob(imgEl) {
            await ensureImageReady(imgEl);

            try {
                const response = await fetch(imgEl.src, { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error('Download non riuscito');
                }
                return await response.blob();
            } catch (error) {
                return await new Promise((resolve, reject) => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = imgEl.naturalWidth;
                        canvas.height = imgEl.naturalHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(imgEl, 0, 0);
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('Impossibile creare il file immagine'));
                            }
                        }, 'image/jpeg', 0.92);
                    } catch (canvasError) {
                        reject(canvasError);
                    }
                });
            }
        }

        async function downloadResultImage() {
            try {
                const blob = await getImageBlob(resultImage);
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = `risultato-stipendio-score-${score || 'default'}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(objectUrl);
            } catch (error) {
                alert('Non riesco a scaricare l\'immagine al momento. Riprova tra qualche istante.');
            }
        }

        async function shareImageViaSystem() {
            try {
                const blob = await getImageBlob(resultImage);
                const fileName = `datapizza-score-${score || 'default'}.jpg`;
                const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Il mio risultato salariale Datapizza',
                        text: 'Condividi il tuo risultato salariale con Datapizza',
                        files: [file]
                    });
                } else {
                    window.open(resultImage.src, '_blank');
                }
            } catch (error) {
                window.open(resultImage.src, '_blank');
            }
        }

        // WhatsApp
        document.getElementById('whatsappBtn').addEventListener('click', function() {
            const whatsappMessage = `Vuoi sapere se la tua RAL è in linea col mercato? 💰\nHo appena confrontato il mio stipendio con la media di regione ed esperienza.\nI risultati sono utili per capire il proprio valore.\nFai il check anche tu completando la survey di Datapizza!\nhttps://bit.ly/4nsCV7P`;
            const text = encodeURIComponent(whatsappMessage);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        });

        // Instagram
        document.getElementById('instagramBtn').addEventListener('click', function() {
            shareImageViaSystem();
        });

        // LinkedIn
        document.getElementById('linkedinBtn').addEventListener('click', function() {
            const url = encodeURIComponent(pageUrl);
            const title = encodeURIComponent('Ho confrontato la mia RAL con Datapizza');
            const summary = encodeURIComponent(shareText);
            const source = encodeURIComponent('Datapizza Salaries');
            const shareUrl = `https://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}&summary=${summary}&source=${source}`;
            window.open(shareUrl, '_blank');
        });

        // Download
        document.getElementById('downloadBtn').addEventListener('click', function() {
            downloadResultImage();
        });

        // Email
        document.getElementById('emailBtn').addEventListener('click', function() {
            const subject = encodeURIComponent('Confronta il tuo stipendio con le medie di mercato: ecco uno strumento utile');
            const body = encodeURIComponent(`Ciao,\nti giro un tool interessante che ho appena utilizzato: la survey di Datapizza che confronta la tua Retribuzione Annua Lorda (RAL) con le medie di mercato in base a regione e anni di esperienza.\n\nSe vuoi fare un check veloce e provarlo anche tu, trovi il link di seguito: https://bit.ly/4nsCV7P\n\n\nA presto,\n[Tuo Nome]`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        });

        // Gestione errore caricamento immagine
        resultImage.addEventListener('error', function handleImageError() {
            if (this.dataset.fallbackApplied === 'true') {
                return;
            }
            this.dataset.fallbackApplied = 'true';
            this.src = fallbackImage;
        });
    </script>
</body>
</html>
