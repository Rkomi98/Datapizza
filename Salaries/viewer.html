<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caricamento risultato...</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f1230; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .wrap { width:100%; max-width:880px; background:#11153d; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:20px; font-weight:700; }
    p { margin:0 0 14px; color:#bfc3ff; }
    .row { display:flex; gap:16px; align-items:center; }
    .loader { width:28px; height:28px; border-radius:50%; border:3px solid rgba(255,255,255,.2); border-top-color:#7c84ff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size:12px; color:#94a3b8; margin-top:6px; }
    iframe { width:100%; height:70vh; border:0; border-radius:12px; display:none; background:#fff; }
    .error { color:#ffb4b4; background:#2a1320; border:1px solid #5b1b2d; padding:10px 12px; border-radius:8px; display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="status">
      <div class="row">
        <div class="loader" aria-hidden="true"></div>
        <div>
          <h1>Stiamo preparando il tuo risultato...</h1>
          <p>Attendi qualche secondo mentre calcoliamo lo score.</p>
          <div class="hint">Non chiudere questa finestra.</div>
        </div>
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <iframe id="resultFrame" title="Risultato salariale"></iframe>
  </div>

  <script>
    // ⚠️ CONFIGURAZIONE - Inserisci qui il tuo secret READ-ONLY
    const ZAPIER_STORE_SECRET = 'IL_TUO_SECRET_READ_ONLY_QUI';
    
    const STORE_BASE = 'https://store.zapier.com/api/records';

    // Mappa score -> pagina statica
    function pageForScore(score) {
      const s = Number(score);
      if (s === 1) return 'heyyou1.html';
      if (s === 2) return 'heyyou2.html';
      if (s === 3) return 'heyyou3.html';
      if (s === 4) return 'heyyou4.html';
      if (s === 5) return 'heyyou5.html';
      return 'heyyou3.html';
    }

    // Converti email in key URL-safe (stesso metodo usato in Zapier)
    function emailToKey(email) {
      return email.toLowerCase()
        .replace('@', '_at_')
        .replace(/\./g, '_dot_')
        .replace(/\+/g, '_plus_');
    }

    function getParam(name) {
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }

    async function fetchRecord(key) {
      const url = new URL(STORE_BASE);
      url.searchParams.set('secret', ZAPIER_STORE_SECRET);
      url.searchParams.set('key', key);
      const res = await fetch(url.toString(), { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    (async () => {
      // Leggi parametri dall'URL
      const email = getParam('email');
      const trackingId = getParam('tracking') || getParam('id');
      
      let identifier = null;
      
      if (email) {
        identifier = emailToKey(email);
      } else if (trackingId) {
        identifier = trackingId;
      } else {
        showError('Parametro mancante. Apri questa pagina solo dal redirect del form.');
        return;
      }

      // Costruisci la key per Storage
      const KEY = `dp_result_${identifier}`;
      
      console.log('🔍 Cerco risultati per:', identifier);
      console.log('📦 Storage key:', KEY);
      
      const maxTries = 20;
      const intervalMs = 1500;

      let attempt = 0;
      let found = null;
      
      while (attempt < maxTries && !found) {
        attempt++;
        console.log(`⏳ Tentativo ${attempt}/${maxTries}...`);
        
        try {
          const data = await fetchRecord(KEY);
          const raw = data[KEY];
          
          if (raw) {
            try { 
              found = typeof raw === 'string' ? JSON.parse(raw) : raw; 
              console.log('✅ Risultato trovato:', found);
            }
            catch (e) { 
              found = { score: Number(raw) || 3 }; 
            }
          }
        } catch (e) {
          console.log(`❌ Tentativo ${attempt} fallito:`, e.message);
        }
        
        if (!found) await new Promise(r => setTimeout(r, intervalMs));
      }

      if (!found) {
        showError('Ancora nessun risultato. Ricarica tra qualche secondo oppure controlla il link che ti invieremo.');
        console.error('❌ Nessun risultato trovato dopo', maxTries, 'tentativi');
        return;
      }

      // Mostra la pagina corretta
      const target = pageForScore(found.score);
      console.log('🎯 Carico pagina:', target);
      
      const frame = document.getElementById('resultFrame');
      frame.src = target;
      frame.style.display = 'block';
      document.getElementById('status').style.display = 'none';
    })();
  </script>
</body>
</html>
